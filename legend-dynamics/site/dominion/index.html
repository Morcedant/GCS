<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head><body>
<title>Fracture Lines: Dominion</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A turn-based 4X strategy game in the Fracture Lines setting: explore a hex galaxy, settle worlds, research, trade and fight.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* Layout: a command console. The star map fills the screen; a turn bar runs across the top; the side panel holds the
   selected world or fleet, the empire, research, diplomacy and the log. Deliberately one dark look: a starfield. */
:root { color-scheme: dark;
  --bg: #070a12; --panel: #0e1424; --panel-2: #141c31; --line: rgba(130, 160, 220, .2); --ink: #dfe7f7; --muted: #8e9ab4;
  --accent: #5ec8e0; --accent-ink: #04141a; --gold: #f0c85a; --exo: #d9a8ff; --bad: #ff7a6b; --good: #7bc47f;
  --display: "Chakra Petch", "Segoe UI", system-ui, sans-serif; --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--body); margin: 0; overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
button { font: inherit; color: inherit; }
#app { position: fixed; inset: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px) 0; display: grid; grid-template-rows: auto 1fr; grid-template-columns: 1fr 380px; }
#app[hidden] { display: none; }
.bar { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 8px max(14px, env(safe-area-inset-right, 0px)) 8px max(14px, env(safe-area-inset-left, 0px)); background: var(--panel); border-bottom: 1px solid var(--line); }
#bar-faction { font: 700 15px var(--display); letter-spacing: .04em; display: flex; align-items: center; gap: 8px; }
#bar-stats { display: flex; flex-wrap: wrap; gap: 4px 16px; flex: 1 1 auto; min-width: 0; font-variant-numeric: tabular-nums; }
#bar-stats b { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; margin-right: 4px; }
#bar-stats i { font-style: normal; color: var(--good); } #bar-stats i.neg { color: var(--bad); }
#bar-turn { font: 600 13px var(--display); color: var(--muted); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; box-shadow: 0 0 0 1px rgba(0,0,0,.6); }
.map-wrap { position: relative; min-width: 0; min-height: 0; }
#map { width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
.map-tools { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 12px; display: flex; gap: 6px; }
.map-tools button { width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--line); background: rgba(14, 20, 36, .9); cursor: pointer; font-size: 18px; }
.side { background: var(--panel); border-left: 1px solid var(--line); display: grid; grid-template-rows: auto auto 1fr auto; min-height: 0; }
.tabs { display: flex; flex-wrap: wrap; gap: 2px; padding: 8px 10px 0; border-bottom: 1px solid var(--line); }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 8px; cursor: pointer; color: var(--muted); font: 600 13px var(--display); letter-spacing: .03em; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

.side-foot { padding: 10px 14px; border-top: 1px solid var(--line); display: flex; gap: 8px; }
h1, h2, h3 { font-family: var(--display); letter-spacing: .03em; margin: 0; text-wrap: balance; }
h1 { font-size: 28px; margin-bottom: 8px; } h2 { font-size: 18px; margin-bottom: 6px; display: flex; align-items: center; }
h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 16px 0 6px; }
p { margin: 0 0 8px; } .muted { color: var(--muted); } .small { font-size: 12px; } .bad { color: var(--bad); } .exo { color: var(--exo); } .gold { color: var(--gold); }
.btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 600; }
.btn:hover:not(:disabled) { border-color: var(--accent); }

.btn.danger { border-color: rgba(255, 122, 107, .6); color: var(--bad); }

.btn:disabled { opacity: .5; cursor: default; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; } .btn-row.col { flex-direction: column; align-items: stretch; }

button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.meter { display: block; height: 6px; background: rgba(255,255,255,.08); border-radius: 3px; overflow: hidden; margin: 4px 0; }
.meter > span { display: block; height: 100%; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 0 10px; align-items: center; } .kv .meter { grid-column: 1 / -1; }
.yields { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 6px 0 8px; font-variant-numeric: tabular-nums; } .yields span { color: var(--muted); } .yields b { color: var(--ink); }
.queue { list-style: none; padding: 0; margin: 0 0 8px; display: grid; gap: 6px; }
.queue li { display: grid; grid-template-columns: 1fr auto auto; gap: 0 8px; align-items: center; background: var(--panel-2); border-radius: 6px; padding: 6px 8px; }
.queue li .meter { grid-column: 1 / -1; order: 3; }
.x { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 16px; }
.opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.opt { display: flex; justify-content: space-between; gap: 6px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; cursor: pointer; text-align: left; }
.opt:hover { border-color: var(--accent); } .opt span { color: var(--muted); font-variant-numeric: tabular-nums; }
.row { display: flex; align-items: center; gap: 4px; width: 100%; text-align: left; background: var(--panel-2); border: 1px solid transparent; border-radius: 6px; padding: 6px 8px; margin: 4px 0; cursor: pointer; }
.row:hover { border-color: var(--accent); }
.ships { list-style: none; padding: 0; margin: 6px 0; display: grid; gap: 6px; }
.ships li { display: grid; grid-template-columns: 1fr auto auto; gap: 0 8px; align-items: center; } .ships li .meter { grid-column: 1 / -1; }
.tbl { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; }
.tbl th { text-align: left; color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; padding: 4px; border-bottom: 1px solid var(--line); }
.tbl td { padding: 5px 4px; border-bottom: 1px solid rgba(130,160,220,.08); } .tbl tr[data-selsys] { cursor: pointer; } .tbl tr[data-selsys]:hover td { background: var(--panel-2); }
.techs { display: grid; gap: 6px; }
.tech { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; text-align: left; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; cursor: pointer; }
.tech small { grid-column: 1 / -1; color: var(--muted); } .tech span { color: var(--muted); font-variant-numeric: tabular-nums; }
.tech.done { opacity: .55; cursor: default; } .tech.locked { opacity: .45; cursor: default; } .tech.can:hover { border-color: var(--accent); }
.tech.cur { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; }
.dip, .offer { background: var(--panel-2); border-radius: 8px; padding: 10px 12px; margin: 8px 0; } .dip h3 { margin: 0 0 4px; color: var(--ink); text-transform: none; letter-spacing: .02em; font-size: 15px; }
.offer { border: 1px solid var(--gold); }
.log { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; font-size: 13px; }
.card.obj { background: var(--panel-2); border: 1px solid var(--line); border-left: 4px solid var(--gold); border-radius: 8px; padding: 10px 12px; margin: 10px 0; }
.obj-h { margin: 0 0 6px; color: var(--ink); text-transform: none; letter-spacing: .02em; font-size: 15px; }
.badge-status { font: 600 11px var(--body); letter-spacing: .04em; text-transform: none; border: 1px solid var(--line); border-radius: 10px; padding: 1px 8px; margin-left: 6px; vertical-align: 2px; color: var(--muted); }
.badge-status.good { color: var(--good); border-color: rgba(123,196,127,.5); } .badge-status.bad { color: var(--bad); border-color: rgba(255,122,107,.6); }
.steps-list { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 3px; font-size: 13px; }
.steps-list li { display: flex; gap: 8px; color: var(--muted); } .steps-list li > span { width: 14px; flex: none; text-align: center; }
.steps-list li.done { color: var(--good); } .steps-list li.now { color: var(--ink); font-weight: 600; } .steps-list li.now > span { color: var(--gold); }
.log .t { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 8px; } .log .war { color: #ffb0a6; } .log .victory { color: var(--gold); } .log .research { color: #a8e0ff; } .log .explore, .log .contact { color: #e2d1ff; } .log .turn { color: var(--muted); } h3.log-turn { margin: 14px 0 6px; padding-bottom: 3px; border-bottom: 1px solid var(--line); }
#modal { position: fixed; inset: 0; background: rgba(3, 5, 10, .82); display: grid; place-items: center; z-index: 20; padding: 16px; overflow-y: auto; }
#modal[hidden] { display: none; }
.modal-box { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; max-width: 760px; width: 100%; padding: 22px max(16px, env(safe-area-inset-right, 0px)) 22px max(16px, env(safe-area-inset-left, 0px)); box-shadow: 0 30px 80px rgba(0,0,0,.6); }
.modal-box h1 { font-size: clamp(24px, 5vw, 36px); background: linear-gradient(90deg, #a8e8ff, #f0c85a); -webkit-background-clip: text; background-clip: text; color: transparent; }
.lede { color: var(--muted); font-size: 15px; max-width: 60ch; }
.factions { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 8px; }
.fac { display: flex; gap: 8px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; cursor: pointer; }
.fac:has(input:checked) { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.fac small { display: block; color: var(--muted); margin-top: 4px; }
.ng-row { display: flex; flex-wrap: wrap; gap: 12px; margin: 14px 0 4px; }
.ng-row label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
select, input[type=text], textarea { background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; font: inherit; }
textarea { width: 100%; box-sizing: border-box; font: 12px ui-monospace, monospace; }
.seedbox { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); } .seedbox h3 { margin-top: 0; }
.seed { font: 700 22px var(--display); letter-spacing: .06em; color: var(--gold); user-select: all; font-variant-numeric: tabular-nums; }
/* First steps and the starter guide */
#steps { margin: 10px 12px 0; padding: 10px 12px; border: 1px solid rgba(123, 196, 127, .45); border-radius: 10px; background: rgba(123, 196, 127, .07); }
.steps-head { display: flex; align-items: center; gap: 8px; } .steps-head b { font-family: var(--display); letter-spacing: .04em; flex: 1; }
.steps { list-style: none; padding: 0; margin: 6px 0 0; display: grid; gap: 4px; font-size: 13px; }
.steps li { display: flex; align-items: center; gap: 8px; color: var(--muted); } .steps li > span { width: 16px; color: var(--good); font-weight: 700; }
.steps li.now { color: var(--ink); font-weight: 600; } .steps li.done { text-decoration: line-through; text-decoration-color: rgba(142,154,180,.5); }
.steps .btn { margin-left: auto; text-decoration: none; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(240, 200, 90, 0); } 50% { box-shadow: 0 0 0 6px rgba(240, 200, 90, .55); } }
.pulse { animation: pulse .8s ease-in-out 3; }
.starter .sg-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; margin: 16px 0; }
.sg-card { display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: start; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-width: 0; }
.sg-card h3 { margin: 0 0 4px; color: var(--ink); text-transform: none; letter-spacing: .02em; font-size: 15px; } .sg-card p { margin: 0; font-size: 13px; color: #c6d0e6; }
.sg-icon svg { width: 52px; height: 52px; display: block; }
.sg-keys { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin: 0 0 6px; }
kbd { font: 600 11px var(--body); background: var(--panel-2); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 1px 6px; color: var(--ink); margin-right: 4px; }
.btn.big { font: 700 16px var(--display); letter-spacing: .04em; padding: 12px 20px; }
.check-line { display: flex; align-items: center; gap: 8px; margin-top: 10px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; outline: 2px solid var(--gold); } }
.help { padding-left: 18px; display: grid; gap: 6px; color: #c6d0e6; }
.toast { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); max-width: min(560px, calc(100vw - 32px)); background: #1b2440; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; opacity: 0; pointer-events: none; transition: .25s; z-index: 30; }
.toast.show { opacity: 1; transform: translate(-50%, 0); } .toast.bad { border-color: var(--bad); }
@media (max-width: 820px) {
  #app { grid-template-columns: 1fr; grid-template-rows: auto minmax(260px, 55vh) 1fr; }
  .side { border-left: 0; border-top: 1px solid var(--line); }
  body { overflow: auto; }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

<div id="app" hidden>

<script>
(() => {
"use strict";
// ---- hex.js ----
// Hex grid helpers (axial coordinates, pointy-top) and a seeded random generator.
// Every hex is "q,r"; the map is a hexagon of a given radius around 0,0.

/** A seeded generator (mulberry32): the same seed always builds the same galaxy and rolls the same dice. */
function makeRng(seed) {
  let a = (typeof seed === "number" ? seed : hashString(String(seed))) >>> 0;
  const next = () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  return {
    next,
    int: (n) => Math.floor(next() * n),
    pick: (list) => list[Math.floor(next() * list.length)],
    d6: () => 1 + Math.floor(next() * 6),
    state: () => a,
    setState: (s) => { a = s >>> 0; },
  };
}
function hashString(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

const key = (q, r) => q + "," + r;
const parse = (k) => { const [q, r] = k.split(",").map(Number); return { q, r }; };
const DIRS = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];
const neighbors = (k) => { const { q, r } = parse(k); return DIRS.map(([dq, dr]) => key(q + dq, r + dr)); };
const distance = (a, b) => {
  const A = parse(a), B = parse(b);
  return (Math.abs(A.q - B.q) + Math.abs(A.q + A.r - B.q - B.r) + Math.abs(A.r - B.r)) / 2;
};
/** All hexes of a hexagonal map of this radius. */
function hexagon(radius) {
  const out = [];
  for (let q = -radius; q <= radius; q++)
    for (let r = Math.max(-radius, -q - radius); r <= Math.min(radius, -q + radius); r++) out.push(key(q, r));
  return out;
}
const inMap = (k, radius) => distance(k, "0,0") <= radius;
/** Pixel center of a hex of this size (pointy-top). */
function toPixel(k, size) {
  const { q, r } = parse(k);
  return { x: size * Math.sqrt(3) * (q + r / 2), y: size * 1.5 * r };
}
/** The hex under a pixel. */
function fromPixel(x, y, size) {
  const q = ((Math.sqrt(3) / 3) * x - y / 3) / size, r = ((2 / 3) * y) / size;
  let rx = Math.round(q), rz = Math.round(r), ry = Math.round(-q - r);
  const dx = Math.abs(rx - q), dz = Math.abs(rz - r), dy = Math.abs(ry - (-q - r));
  if (dx > dy && dx > dz) rx = -ry - rz; else if (dz > dy) rz = -rx - ry;
  return key(rx, rz);
}
/** Hexes within n steps of k. */
function within(k, n) {
  const { q, r } = parse(k), out = [];
  for (let dq = -n; dq <= n; dq++)
    for (let dr = Math.max(-n, -dq - n); dr <= Math.min(n, -dq + n); dr++) out.push(key(q + dq, r + dr));
  return out;
}

// ---- data.js ----
// The game's numbers: factions, worlds, buildings, ships and research. Fracture Lines: Dominion is set in the
// Fracture Lines setting of the Legend Dynamics RPG; battles roll 3d6 roll-under, as the tabletop game does.

const FACTIONS = [
  { id: "concord", name: "The Concord", people: "Human", color: "#3d7fbf",
    trait: "Restless energy", traitText: "Colony and outpost ships cost 25% less, and new colonies start with 2 population.",
    homeworld: "Earth" },
  { id: "tessan", name: "The Tessan Dynasties", people: "Tessan", color: "#c2902f",
    trait: "Old money", traitText: "+25% credits from every world, and trade treaties pay double.",
    homeworld: "Tessa Prime" },
  { id: "kel", name: "The Kel Hives", people: "Kel", color: "#5f9e4b",
    trait: "Hive-cities", traitText: "Worlds hold 2 more population, and population grows faster.",
    homeworld: "Kel'vaar" },
  { id: "hegemony", name: "The Hegemony Remnant", people: "Ozhvek and Dresh", color: "#a8342b",
    trait: "Imperial legions", traitText: "Warships hit on +1, and troop transports land twice the force.",
    homeworld: "Ozhvar" },
  { id: "vael", name: "The Vael Living Fleets", people: "Vael", color: "#8a5bb8",
    trait: "Living hulls", traitText: "Ships move 1 hex farther and repair a point of hull every turn, anywhere.",
    homeworld: "The Long Flotilla" },
];

// Worlds: what can live there, and what it gives. maxPop is per size point; rich worlds give more industry.
const WORLDS = {
  terran: { name: "Terran", pop: 3, ind: 1, sci: 1, needs: null, color: "#5fa86a" },
  ocean: { name: "Ocean", pop: 3, ind: 0.8, sci: 1.2, needs: null, color: "#4a8fc4" },
  desert: { name: "Desert", pop: 2, ind: 1.2, sci: 0.8, needs: "xenology", color: "#d0a25a" },
  arctic: { name: "Arctic", pop: 2, ind: 1, sci: 1.2, needs: "xenology", color: "#bcd6e0" },
  barren: { name: "Barren", pop: 1, ind: 1.5, sci: 0.6, needs: "domes", color: "#8c8278" },
  gas: { name: "Gas giant", pop: 0, ind: 0, sci: 0, needs: null, color: "#c98f6a", outpostOnly: true },
};

const BUILDINGS = {
  factory: { name: "Factory", cost: 60, upkeep: 1, text: "+50% industry here." },
  lab: { name: "Research lab", cost: 60, upkeep: 1, text: "+2 science, and +50% science here." },
  market: { name: "Exchange", cost: 50, upkeep: 0, text: "+3 credits here." },
  shipyard: { name: "Shipyard", cost: 80, upkeep: 1, text: "Builds ships here." },
  battery: { name: "Orbital battery", cost: 70, upkeep: 1, needs: "batteries", text: "Defends the world: it fires on enemies in orbit (skill 13, 3 hull)." },
  refinery: { name: "Exotics refinery", cost: 90, upkeep: 1, needs: "refining", text: "+1 exotics if the system has a deposit." },
  engine: { name: "The Corridor Engine", cost: 1200, upkeep: 0, needs: "engine", exotics: 15, wonder: true,
    text: "Finish it and you open a corridor to everywhere at once: you win." },
};

// Ships. skill: the 3d6 roll-under target to hit; dmg: hull a hit takes; hull: what it can take.

// ---- galaxy.js ----
// Building a galaxy: a hexagon of space with nebulae and rifts, star systems scattered across it, and the corridors
// that link them. The same seed always builds the same galaxy.


const SIZES = { small: { radius: 9, systems: 34 }, medium: { radius: 12, systems: 58 }, large: { radius: 15, systems: 88 } };

/** @returns {{ radius, hexes, systems, sysAt, corridors, adj, homes }} */
function makeGalaxy(seed, sizeName, factionCount) {
  const rng = makeRng("galaxy:" + seed), size = SIZES[sizeName] || SIZES.medium, R = size.radius;
  const all = hexagon(R);
  const hexes = Object.fromEntries(all.map((k) => [k, { terrain: "space" }]));
  // Nebulae: soft clouds (slow, and they hide ships). Rifts: short broken lines nothing can cross.
  const blob = (terrain, count, len) => {
    for (let i = 0; i < count; i++) {
      let k = rng.pick(all);
      for (let j = 0; j < len; j++) {
        if (hexes[k] && distance(k, "0,0") < R) hexes[k].terrain = terrain;
        const n = neighbors(k).filter((x) => hexes[x]);
        k = rng.pick(n);
      }
    }
  };
  blob("nebula", Math.round(R * 0.9), 7);
  blob("rift", Math.round(R * 0.45), 4);

  // Systems: spread out, never on a rift, at least 2 hexes apart.
  const systems = {}, sysAt = {};
  const names = [...STAR_NAMES];
  let tries = 0;
  while (Object.keys(systems).length < size.systems && tries++ < 20000) {
    const k = rng.pick(all);
    if (hexes[k].terrain === "rift" || distance(k, "0,0") > R - 1) continue;
    if (Object.keys(sysAt).some((h) => distance(h, k) < 3)) continue;
    const id = "s" + Object.keys(systems).length;
    const nm = names.length ? names.splice(rng.int(names.length), 1)[0] : "System " + id;
    const roll = rng.next();
    const world = roll < 0.16 ? "terran" : roll < 0.3 ? "ocean" : roll < 0.46 ? "desert" : roll < 0.6 ? "arctic" : roll < 0.8 ? "barren" : "gas";
    systems[id] = { id, name: nm, at: k, world, size: 1 + rng.int(4), rich: [0.6, 1, 1, 1.4][rng.int(4)], exotics: rng.next() < 0.22,
      ruins: rng.next() < 0.12, colony: null };
    hexes[k].terrain = "space";
    sysAt[k] = id;
  }

  // Corridors: each system to its two nearest neighbours within 6 hexes, then joined into one network.
  const ids = Object.keys(systems), corridors = [], adj = Object.fromEntries(ids.map((i) => [i, []]));
  const link = (a, b) => { if (a === b || adj[a].includes(b)) return; adj[a].push(b); adj[b].push(a); corridors.push([a, b]); };
  for (const a of ids) {
    const near = ids.filter((b) => b !== a).map((b) => [b, distance(systems[a].at, systems[b].at)]).sort((x, y) => x[1] - y[1]);
    near.filter(([, d]) => d <= 6).slice(0, 2).forEach(([b]) => link(a, b));
  }
  // Join the islands: repeatedly link the closest pair of systems in different components.
  const comp = () => { const c = {}; let n = 0; for (const s of ids) if (c[s] === undefined) { const st = [s]; c[s] = n; while (st.length) { const x = st.pop(); for (const y of adj[x]) if (c[y] === undefined) { c[y] = n; st.push(y); } } n++; } return [c, n]; };
  for (let [c, n] = comp(); n > 1; [c, n] = comp()) {
    let best = null;
    for (const a of ids) for (const b of ids) if (c[a] === 0 && c[b] !== 0) { const d = distance(systems[a].at, systems[b].at); if (!best || d < best[2]) best = [a, b, d]; }
    link(best[0], best[1]);
  }

  // Homeworlds: as far apart as the map allows, each a large terran world with a habitable neighbour or two.
  const homes = [];
  const candidates = ids.filter((i) => distance(systems[i].at, "0,0") >= R * 0.45);
  homes.push(rng.pick(candidates));
  while (homes.length < factionCount) {
    let best = null;
    for (const c of candidates) { if (homes.includes(c)) continue; const d = Math.min(...homes.map((h) => distance(systems[h].at, systems[c].at))); if (!best || d > best[1]) best = [c, d]; }
    homes.push(best[0]);
  }
  for (const h of homes) {
    Object.assign(systems[h], { world: "terran", size: 4, rich: 1, exotics: false, ruins: false });
    const near = ids.filter((i) => !homes.includes(i) && distance(systems[i].at, systems[h].at) <= 5).sort((a, b) => distance(systems[a].at, systems[h].at) - distance(systems[b].at, systems[h].at));
    if (near[0]) Object.assign(systems[near[0]], { world: rng.pick(["terran", "ocean"]), size: 2 + rng.int(2) });
    if (near[1]) Object.assign(systems[near[1]], { exotics: true });
    for (const k of within(systems[h].at, 1)) if (hexes[k] && hexes[k].terrain === "rift") hexes[k].terrain = "space";
  }
  return { radius: R, hexes, systems, sysAt, corridors, adj, homes };
}

// ---- game.js ----
// The rules of Fracture Lines: Dominion, as pure functions over one game state (plain JSON, so it saves as is).
// The player gives orders through these functions; endTurn() lets the computer factions give theirs, then resolves
// movement, battles, the economy, research and victory for everyone at once.



// ---- a new game ----
/** opts: { seed, size: small|medium|large, player: faction id, rivals: number (1–4), difficulty: easy|normal|hard } */
function newGame(opts) {
  const seed = opts.seed || Math.floor(Math.random() * 1e9);
  const pool = FACTIONS.filter((f) => f.id !== opts.player);
  const rng = makeRng("setup:" + seed);
  const rivals = [];
  while (rivals.length < Math.max(1, Math.min(4, opts.rivals || 3))) rivals.push(pool.splice(rng.int(pool.length), 1)[0]);
  const list = [FACTIONS.find((f) => f.id === opts.player) || FACTIONS[0], ...rivals];
  const g = makeGalaxy(seed, opts.size || "medium", list.length);
  const state = {
    version: 1, seed, turn: 1, size: opts.size || "medium", difficulty: opts.difficulty || "normal", radius: g.radius,
    hexes: g.hexes, systems: g.systems, sysAt: g.sysAt, corridors: g.corridors, adj: g.adj,
    factions: [], fleets: {}, nextId: 1, log: [], winner: null, winReason: null, rngState: makeRng("play:" + seed).state(), events: [], offers: [],
  };
  list.forEach((f, i) => {
    const home = g.homes[i];
    state.factions.push({ id: f.id, name: f.name, color: f.color, ai: i > 0, alive: true, capital: home,
      credits: 80, exotics: 0, research: { current: null, progress: 0, done: [] }, explored: {}, visible: {},
      relations: {}, met: {}, stats: { built: 0, lost: 0, won: 0 } });
    state.systems[home].colony = { owner: f.id, kind: "colony", pop: f.id === "concord" ? 4 : 4, growth: 0, buildings: { shipyard: true, factory: false, lab: false, market: false },
      queue: [], stock: 0, defense: 2, capital: true };
    state.systems[home].name = f.homeworld;
    for (const t of ["scout", "frigate", "colony"]) spawnFleet(state, f.id, state.systems[home].at, [t]);
  });
  for (const a of state.factions) for (const b of state.factions) if (a !== b) a.relations[b.id] = { status: "peace", treaty: false, score: 0, turnsAtWar: 0 };
  for (const f of state.factions) updateVision(state, f);
  log(state, null, "The corridors are open. Turn 1.");
  return state;
}

// ---- helpers ----
const faction = (s, id) => s.factions.find((f) => f.id === id);
const has = (s, fid, tech) => faction(s, fid).research.done.includes(tech);
const player = (s) => s.factions[0];
function rng(s) { const r = makeRng(1); r.setState(s.rngState); return { ...r, save: () => { s.rngState = r.state(); } }; }
/** Discoveries (systems charted, ruins surveyed, contacts, technologies) are never trimmed from the log. */
const DISCOVERY = ["explore", "research", "contact"];
function log(s, fid, text, kind = "info") {
  s.log.push({ turn: s.turn, fid, text, kind });
  let n = s.log.length - 400;
  for (let i = 0; i < s.log.length && n > 0; ) { if (!DISCOVERY.includes(s.log[i].kind)) { s.log.splice(i, 1); n--; } else i++; }
}
function coloniesOf(s, fid) { return Object.values(s.systems).filter((x) => x.colony && x.colony.owner === fid); }
function fleetsOf(s, fid) { return Object.values(s.fleets).filter((f) => f.owner === fid); }
function fleetsAt(s, hex) { return Object.values(s.fleets).filter((f) => f.at === hex); }
const atWar = (s, a, b) => a !== b && faction(s, a).relations[b] && faction(s, a).relations[b].status === "war";

function shipStats(s, fid, type) {
  const base = SHIPS[type], warship = base.skill > 0;
  return { ...base,
    speed: base.speed + (has(s, fid, "foldDrives") ? 1 : 0) + (fid === "vael" ? 1 : 0),
    hull: base.hull + (warship && has(s, fid, "shields") ? 1 : 0),
    skill: warship ? base.skill + (has(s, fid, "targeting") ? 1 : 0) + (fid === "hegemony" ? 1 : 0) : 0,
    sensors: base.sensors + (has(s, fid, "sensors") ? 1 : 0),
    troops: (base.troops || 0) * (fid === "hegemony" ? 2 : 1),
    cost: Math.round(base.cost * (has(s, fid, "orbitalYards") ? 0.8 : 1) * ((type === "colony" || type === "outpost") && fid === "concord" ? 0.75 : 1)) };
}
function spawnFleet(s, owner, at, types) {
  const id = "f" + s.nextId++;
  s.fleets[id] = { id, owner, at, ships: types.map((t) => ({ type: t, hull: shipStats(s, owner, t).hull })), path: [], dest: null };
  return s.fleets[id];
}
const fleetSpeed = (s, f) => Math.min(...f.ships.map((x) => shipStats(s, f.owner, x.type).speed));
const armed = (f) => f.ships.some((x) => SHIPS[x.type].skill > 0);

// ---- worlds ----
function canSettle(s, fid, sys, kind) {
  if (sys.colony) return false;
  const w = WORLDS[sys.world];
  if (kind === "outpost") return true;
  return !w.outpostOnly && (!w.needs || has(s, fid, w.needs));
}
function maxPop(s, sys) {
  const c = sys.colony; if (!c || c.kind !== "colony") return 0;
  return WORLDS[sys.world].pop + sys.size * 2 + (has(s, c.owner, "terraforming") ? 2 : 0) + (c.owner === "kel" ? 2 : 0);
}
/** What a world gives each turn: { ind, sci, cr, exo, upkeep }. */
function yields(s, sys) {
  const c = sys.colony; if (!c) return { ind: 0, sci: 0, cr: 0, exo: 0, upkeep: 0 };
  const w = WORLDS[sys.world], fid = c.owner, B = c.buildings || {};
  let ind = 0, sci = 0, cr = 0;
  if (c.kind === "colony") {
    ind = c.pop * w.ind * sys.rich + (has(s, fid, "automation") ? 1 : 0) + (c.capital ? 2 : 0);
    sci = c.pop * 0.5 * w.sci + (B.lab ? 2 : 0) + (c.capital ? 1 : 0);
    cr = c.pop * 0.6 + (B.market ? 3 + (has(s, fid, "commerce") ? 2 : 0) : 0) + (has(s, fid, "commerce") ? 1 : 0) + (c.capital ? 2 : 0);
    if (B.factory) ind *= 1.5;
    if (B.lab) sci *= 1.5;
    if (fid === "tessan") cr *= 1.25;

  const upkeep = Object.keys(B).filter((b) => B[b] && BUILDINGS[b]).reduce((t, b) => t + BUILDINGS[b].upkeep, 0) * 0.5;

}
const round1 = (x) => Math.round(x * 10) / 10;

/** The empire's totals this turn: { cr, sci, ind, exo, upkeep, net }. */
function totals(s, fid) {
  let cr = 0, sci = 0, ind = 0, exo = 0, upkeep = 0;
  for (const sys of coloniesOf(s, fid)) { const y = yields(s, sys); cr += y.cr; sci += y.sci; ind += y.ind; exo += y.exo; upkeep += y.upkeep; }
  for (const f of fleetsOf(s, fid)) for (const x of f.ships) upkeep += SHIPS[x.type].upkeep;
  const F = faction(s, fid);
  for (const [oid, r] of Object.entries(F.relations)) if (r.treaty && faction(s, oid).alive) cr += fid === "tessan" ? 6 : 3;
  return { cr: round1(cr), sci: round1(sci), ind: round1(ind), exo, upkeep: round1(upkeep), net: round1(cr - upkeep) };
}

// ---- what a world can build ----
function buildOptions(s, sys) {
  const c = sys.colony, fid = c.owner, out = [];
  if (c.kind !== "colony") return out;
  if (c.buildings.shipyard) for (const [t, d] of Object.entries(SHIPS)) if (!d.needs || has(s, fid, d.needs)) out.push({ kind: "ship", id: t, name: d.name, cost: shipStats(s, fid, t).cost, exotics: d.exotics || 0 });
  for (const [b, d] of Object.entries(BUILDINGS)) {
    if (c.buildings[b] || (d.needs && !has(s, fid, d.needs)) || c.queue.some((q) => q.id === b)) continue;
    if (d.wonder && !c.capital) continue;
    out.push({ kind: "building", id: b, name: d.name, cost: d.cost, exotics: d.exotics || 0 });
  }

}
function enqueue(s, sysId, kind, id) {
  const sys = s.systems[sysId], opt = buildOptions(s, sys).find((o) => o.kind === kind && o.id === id);
  if (!opt) return { error: "That can't be built here." };
  if (sys.colony.queue.length >= 6) return { error: "The queue is full." };
  sys.colony.queue.push({ kind, id, name: opt.name, cost: opt.cost, exotics: opt.exotics, progress: 0 });
  if (id === "engine") log(s, null, `${faction(s, sys.colony.owner).name} has begun building the Corridor Engine at ${sys.name}.`, "victory");
  return { ok: true };
}

  return Math.ceil((q.cost - q.progress) * RULES.rushRate);
}
function rush(s, sysId) {

  if (!q || c === null) return { error: "Nothing to rush." };

// ---- research ----
function availableTechs(s, fid) { const done = faction(s, fid).research.done; return TECHS.filter((t) => !done.includes(t.id) && t.needs.every((n) => done.includes(n))); }
function setResearch(s, fid, techId) {
  if (!availableTechs(s, fid).some((t) => t.id === techId)) return { error: "Not available yet." };
  const R = faction(s, fid).research; if (R.current !== techId) { R.current = techId; } return { ok: true };
}

// ---- movement ----
const corridorCost = (s, fid) => (has(s, fid, "corridorTheory") ? 0.25 : 1);
/** The cheapest path from a hex to another: [{ hex, cost }] steps (the first step's hex is the next hex). */
function findPath(s, fid, from, to) {
  if (!s.hexes[to] || s.hexes[to].terrain === "rift") return null;
  const dist = { [from]: 0 }, prev = {}, open = [[0, from]], cc = corridorCost(s, fid);
  while (open.length) {
    open.sort((a, b) => a[0] - b[0]);
    const [d, k] = open.shift();
    if (k === to) break;
    if (d > dist[k]) continue;
    const steps = neighbors(k).filter((n) => s.hexes[n] && s.hexes[n].terrain !== "rift").map((n) => [n, s.hexes[n].terrain === "nebula" ? 2 : 1]);
    const sid = s.sysAt[k];
    if (sid) for (const o of s.adj[sid]) steps.push([s.systems[o].at, cc]);
    for (const [n, c] of steps) {
      const nd = d + c;

    }

  // Warships only: colony ships, outposts, scouts and transports keep their own fleets until the player joins them.
  const warOnly = (f) => f.ships.every((x) => SHIPS[x.type].skill > 0);
  for (const f of Object.values(s.fleets)) { if (f.path.length || !warOnly(f)) continue; const k = f.owner + "|" + f.at; if (byHex[k]) { byHex[k].ships.push(...f.ships); delete s.fleets[f.id]; } else byHex[k] = f; }
}

// ---- settling and invading ----
function settle(s, fleetId) {
  const f = s.fleets[fleetId], sid = s.sysAt[f.at], sys = sid && s.systems[sid];
  if (!sys) return { error: "There's no system here." };
  const ci = f.ships.findIndex((x) => x.type === "colony"), oi = f.ships.findIndex((x) => x.type === "outpost");
  if (sys.colony) return { error: "Someone already holds this system." };
  if (ci >= 0 && canSettle(s, f.owner, sys, "colony")) {
    f.ships.splice(ci, 1);
    sys.colony = { owner: f.owner, kind: "colony", pop: f.owner === "concord" ? 2 : 1, growth: 0, buildings: {}, queue: [], stock: 0, defense: 0, capital: false };
    log(s, f.owner, `${faction(s, f.owner).name} founded a colony on ${sys.name}, ${worldDesc(sys)}.`, "settle");
  } else if (oi >= 0 || ci >= 0) {
    if (oi < 0 && !canSettle(s, f.owner, sys, "outpost")) return { error: "Nothing here to settle with." };
    f.ships.splice(oi >= 0 ? oi : ci, 1);
    sys.colony = { owner: f.owner, kind: "outpost", pop: 0, growth: 0, buildings: {}, queue: [], stock: 0, defense: 0, capital: false };
    log(s, f.owner, `${faction(s, f.owner).name} claimed ${sys.name} as an outpost: ${worldDesc(sys)}. It extends your borders${sys.exotics ? " and mines its exotics" : ""}.`, "settle");
  } else return { error: "This fleet has no colony or outpost ship." };
  if (!f.ships.length) delete s.fleets[f.id];
  noticeSettling(s, f.owner, sys);
  updateVision(s, faction(s, f.owner));
  return { ok: true };
}
/** Others don't like it when you settle next door. */
function noticeSettling(s, fid, sys) {
  for (const o of s.factions) if (o.id !== fid && o.alive && coloniesOf(s, o.id).some((x) => distance(x.at, sys.at) <= 4)) o.relations[fid].score -= 8;
}
function invasionOdds(s, fleetId) {
  const f = s.fleets[fleetId], sid = s.sysAt[f.at], sys = sid && s.systems[sid];
  if (!sys || !sys.colony || sys.colony.owner === f.owner) return null;
  const troops = f.ships.filter((x) => x.type === "transport").reduce((t, x) => t + shipStats(s, f.owner, "transport").troops, 0);
  const defense = sys.colony.kind === "outpost" ? 0.5 : sys.colony.pop * RULES.troopDefensePerPop + (sys.colony.capital ? 2 : 0);
  return { troops, defense: round1(defense), guarded: guarded(s, sys, f.owner) };
}
function guarded(s, sys, attacker) {
  return (sys.colony.buildings.battery || sys.colony.capital) && sys.colony.defense > 0
    || fleetsAt(s, sys.at).some((o) => o.owner === sys.colony.owner && armed(o));
}
function invade(s, fleetId) {
  const f = s.fleets[fleetId], o = invasionOdds(s, fleetId);
  if (!o) return { error: "There's no enemy world here." };
  const sys = s.systems[s.sysAt[f.at]], def = sys.colony.owner;
  if (!atWar(s, f.owner, def)) return { error: "You're not at war with them." };
  if (!o.troops) return { error: "This fleet carries no troops." };
  if (o.guarded) return { error: "Its defenses still hold the orbit: destroy them first." };
  f.ships = f.ships.filter((x) => x.type !== "transport");
  if (!f.ships.length) delete s.fleets[f.id];
  if (o.troops >= o.defense) {
    capture(s, sys, f.owner);
    return { ok: true, taken: true };
  }
  sys.colony.pop = Math.max(1, sys.colony.pop - 1);
  log(s, f.owner, `The landing on ${sys.name} failed.`, "war");
  return { ok: true, taken: false };
}
function capture(s, sys, by) {
  const was = sys.colony.owner, wasCapital = sys.colony.capital;
  log(s, by, `${faction(s, by).name} took ${sys.name} from ${faction(s, was).name}.`, "war");
  sys.colony.owner = by; sys.colony.capital = false; sys.colony.queue = []; sys.colony.stock = 0;
  if (sys.colony.kind === "colony") sys.colony.pop = Math.max(1, sys.colony.pop - 1);
  delete sys.colony.buildings.engine;
  if (wasCapital) {
    const rest = coloniesOf(s, was).filter((x) => x.colony.kind === "colony").sort((a, b) => b.colony.pop - a.colony.pop);
    if (rest[0]) { rest[0].colony.capital = true; rest[0].colony.buildings.shipyard = true; faction(s, was).capital = rest[0].id; log(s, was, `${faction(s, was).name} moved its capital to ${rest[0].name}.`, "war"); }
  }
  checkAlive(s, was);
}
function checkAlive(s, fid) {
  const F = faction(s, fid);
  if (F.alive && !coloniesOf(s, fid).some((x) => x.colony.kind === "colony")) {
    F.alive = false;
    for (const f of fleetsOf(s, fid)) delete s.fleets[f.id];
    for (const sys of coloniesOf(s, fid)) sys.colony = null;
    log(s, fid, `${F.name} has fallen.`, "war");
  }
}

// ---- battles: 3d6 roll-under, three exchanges ----
const r3d6 = (R) => R.d6() + R.d6() + R.d6();
function battles(s) {
  const R = rng(s), hexes = new Set(Object.values(s.fleets).map((f) => f.at));
  for (const hex of hexes) {
    const sid = s.sysAt[hex], sys = sid && s.systems[sid];
    const sides = {};
    for (const f of fleetsAt(s, hex)) (sides[f.owner] = sides[f.owner] || []).push(f);
    const owners = new Set(Object.keys(sides));
    if (sys && sys.colony) owners.add(sys.colony.owner);
    const list = [...owners];
    if (!list.some((a) => list.some((b) => atWar(s, a, b)))) continue;
    // Units: ships, and the world's guns.
    const units = [];
    for (const [fid, fl] of Object.entries(sides)) for (const f of fl) for (const sh of f.ships) units.push({ fid, fleet: f, ship: sh, st: shipStats(s, fid, sh.type) });
    const worldGuns = sys && sys.colony && (sys.colony.buildings.battery || sys.colony.capital) && sys.colony.defense > 0;
    if (worldGuns) units.push({ fid: sys.colony.owner, world: sys, st: { skill: 13 + (has(s, sys.colony.owner, "targeting") ? 1 : 0), dmg: 1, name: "Orbital guns" } });
    const hp = (u) => (u.world ? u.world.colony.defense : u.ship.hull);
    const hit = (u, n) => { if (u.world) u.world.colony.defense = Math.max(0, u.world.colony.defense - n); else u.ship.hull -= n; };
    let fights = 0;
    for (let round = 0; round < 3; round++) {
      const live = units.filter((u) => hp(u) > 0);
      for (const u of live) {
        if (!u.st.skill || hp(u) <= 0) continue;
        const foes = live.filter((v) => hp(v) > 0 && atWar(s, u.fid, v.fid));
        if (!foes.length) continue;
        const t = foes[R.int(foes.length)], roll = r3d6(R);
        fights++;
        if (roll <= 4 || (roll < 17 && roll <= u.st.skill)) hit(t, u.st.dmg);
      }
    }
    if (!fights) continue;
    // The dead are removed; who was there hears about it.
    const lost = {};
    for (const u of units) if (u.ship && u.ship.hull <= 0) { lost[u.fid] = (lost[u.fid] || 0) + 1; u.fleet.ships = u.fleet.ships.filter((x) => x !== u.ship); }
    for (const f of fleetsAt(s, hex)) if (!f.ships.length) delete s.fleets[f.id];
    for (const [fid, n] of Object.entries(lost)) faction(s, fid).stats.lost += n;
    const where = sys ? sys.name : "deep space";
    const names = list.map((x) => faction(s, x).name).join(" and ");
    log(s, null, `Battle at ${where} between ${names}: ${Object.entries(lost).map(([fid, n]) => `${faction(s, fid).name} lost ${n} ship${n > 1 ? "s" : ""}`).join("; ") || "no ships lost"}.`, "war");
    s.events.push({ turn: s.turn, kind: "battle", hex, sides: list });
  }
  R.save();
}

// ---- diplomacy ----
function declareWar(s, a, b) {
  const A = faction(s, a), B = faction(s, b);
  A.relations[b].status = "war"; B.relations[a].status = "war"; A.relations[b].treaty = B.relations[a].treaty = false;
  A.relations[b].turnsAtWar = B.relations[a].turnsAtWar = 0;
  B.relations[a].score -= 30;
  log(s, a, `${A.name} declared war on ${B.name}.`, "war");
  return { ok: true };
}
/** Ask for peace or a trade treaty. The computer says yes or no now. */
function propose(s, from, to, what) {
  const A = faction(s, from), B = faction(s, to), rel = B.relations[from];
  if (!A.met[to]) return { error: "You haven't met them yet." };
  let yes;
  if (what === "peace") {
    if (rel.status !== "war") return { error: "You're already at peace." };
    const mine = militaryPower(s, to), theirs = militaryPower(s, from);
    yes = !B.ai || rel.turnsAtWar >= 8 || mine < theirs * 0.8 || rel.score > -10;
    if (yes) { A.relations[to].status = B.relations[from].status = "peace"; rel.score += 10; log(s, from, `${A.name} and ${B.name} made peace.`, "diplo"); }
  } else if (what === "trade") {
    if (rel.status === "war") return { error: "Not while you're at war." };
    if (rel.treaty) return { error: "You already trade." };
    yes = !B.ai || rel.score >= -5;
    if (yes) { A.relations[to].treaty = B.relations[from].treaty = true; rel.score += 5; log(s, from, `${A.name} and ${B.name} signed a trade treaty.`, "diplo"); }
  } else if (what === "endTrade") {
    A.relations[to].treaty = B.relations[from].treaty = false; rel.score -= 5; yes = true;
  }
  return { ok: true, accepted: !!yes };
}
function militaryPower(s, fid) {
  return fleetsOf(s, fid).reduce((t, f) => t + f.ships.reduce((u, x) => u + (SHIPS[x.type].skill ? shipStats(s, fid, x.type).hull * SHIPS[x.type].dmg * 2 : 0), 0), 0);
}

// ---- seeing ----
function updateVision(s, F) {
  const vis = {};
  const charted = [];
  const see = (hex, n) => { for (const k of within(hex, n)) if (s.hexes[k]) { vis[k] = 1; if (!F.explored[k] && !F.ai && s.sysAt[k]) charted.push(s.systems[s.sysAt[k]]); F.explored[k] = 1; } };
  const bonus = has(s, F.id, "sensors") ? 1 : 0;
  for (const sys of coloniesOf(s, F.id)) see(sys.at, (sys.colony.kind === "colony" ? 2 : 1) + bonus);
  for (const f of fleetsOf(s, F.id)) see(f.at, Math.max(...f.ships.map((x) => shipStats(s, F.id, x.type).sensors)));
  F.visible = vis;
  // Every system the player charts goes into the log, with what's there.
  for (const sys of charted) {
    const what = [worldDesc(sys)];
    if (sys.ruins) what.push("ancient ruins to survey");
    if (sys.colony && sys.colony.owner !== F.id) what.push(`${sys.colony.kind === "colony" ? "a colony" : "an outpost"} of ${faction(s, sys.colony.owner).name}`);
    log(s, F.id, `Charted ${sys.name}: ${what.join(", ")}.`, "explore");
  }
  // Meeting: anyone whose world or fleet you can see.
  for (const o of s.factions) if (o.id !== F.id && o.alive && !F.met[o.id]) {
    const seen = coloniesOf(s, o.id).some((x) => vis[x.at]) || fleetsOf(s, o.id).some((f) => vis[f.at]);
    if (seen) {
      F.met[o.id] = true; o.met[F.id] = true;
      const w = coloniesOf(s, o.id).find((x) => vis[x.at]), fl = fleetsOf(s, o.id).find((f) => vis[f.at]);
      const where = w ? `their world ${w.name}` : `${fl.ships.length > 1 ? "a fleet" : "a ship"} of theirs${s.sysAt[fl.at] ? ` at ${s.systems[s.sysAt[fl.at]].name}` : " in deep space"}`;
      log(s, F.id, `${F.name} made contact with ${o.name}: ${where} came into view. Diplomacy is open with them now.`, "contact");
    }
  }
  // Ruins: the first to see them learns something.
  for (const sys of Object.values(s.systems)) if (sys.ruins && vis[sys.at] && fleetsAt(s, sys.at).some((f) => f.owner === F.id)) {
    sys.ruins = false; F.research.progress += 60;
    const cur = TECHS.find((x) => x.id === F.research.current);
    log(s, F.id, `${F.name} surveyed the ruins at ${sys.name}: what the old empires left there is worth +60 research${cur ? ` toward ${cur.name}` : ", banked for your next technology"}.`, "explore");
  }
}

// ---- the end of a turn ----
/** aiTurn(state, faction) gives each computer faction's orders (ai.js); the player has given theirs. */
function endTurn(s, aiTurn) {
  if (s.winner) return;
  for (const F of s.factions) if (F.ai && F.alive && aiTurn) aiTurn(s, F);
  moveFleets(s);
  battles(s);
  for (const F of s.factions) if (F.alive) economy(s, F);
  for (const F of s.factions) if (F.alive) updateVision(s, F);
  // Relations drift: borders rub, trade warms, wars wear on everyone.
  for (const A of s.factions) for (const [bid, r] of Object.entries(A.relations)) {
    if (r.status === "war") r.turnsAtWar++;
    if (r.treaty) r.score = Math.min(40, r.score + 0.5);
    const B = faction(s, bid);
    if (A.alive && B.alive && coloniesOf(s, A.id).some((x) => coloniesOf(s, bid).some((y) => distance(x.at, y.at) <= 3))) r.score = Math.max(-60, r.score - 0.4);
  }
  checkVictory(s);
  s.turn++;
}
/** "an ocean world, size 2, rich, an exotics deposit" */
function worldDesc(sys) {
  const w = WORLDS[sys.world], what = [`${/^[AEIOU]/.test(w.name) ? "an" : "a"} ${w.name.toLowerCase()} world`, `size ${sys.size}`];
  if (sys.rich > 1) what.push("rich"); else if (sys.rich < 1) what.push("poor");
  if (sys.exotics) what.push("an exotics deposit");
  return what.join(", ");
}
function economy(s, F) {
  const t = totals(s, F.id);
  if (!F.ai) {
    const cur = TECHS.find((x) => x.id === F.research.current);
    log(s, F.id, `The books: ${t.net >= 0 ? "+" : "−"}${Math.abs(round1(t.net))} credits (treasury ${round1(F.credits + t.net)}), +${round1(t.sci)} science ${cur ? `toward ${cur.name} (${Math.round(F.research.progress + t.sci)}/${cur.cost})` : "with nothing to research: choose a technology"}${t.exo ? `, +${round1(t.exo)} exotics` : ""}.`, "turn");
  }
  const strike = F.credits < 0 ? 0.75 : 1; // in debt: the yards and the labs slow down
  F.credits = round1(F.credits + t.net);
  F.exotics += t.exo;
  // Research.
  const R = F.research;
  if (R.current) {
    R.progress += t.sci * strike;
    const tech = TECHS.find((x) => x.id === R.current);
    if (R.progress >= tech.cost) {
      R.progress -= tech.cost; R.done.push(tech.id); R.current = null;
      log(s, F.id, `${F.name} discovered ${tech.name}: ${tech.text}`, "research");
      if (tech.id === "shields") for (const f of fleetsOf(s, F.id)) for (const x of f.ships) if (SHIPS[x.type].skill) x.hull += 1;
    }
  }
  // Each world: production, growth, defenses.
  for (const sys of coloniesOf(s, F.id)) {
    const c = sys.colony, y = yields(s, sys);
    if (c.kind === "colony") {
      c.stock += y.ind * strike;
      while (c.queue.length) {
        const q = c.queue[0];
        const need = q.cost - q.progress, put = Math.min(need, c.stock);
        q.progress += put; c.stock -= put;
        if (q.progress + 1e-9 < q.cost) break;
        if (q.exotics && F.exotics < q.exotics) { if (!q.waiting) log(s, F.id, `${q.name} at ${sys.name} waits for ${q.exotics} exotics.`, "build"); q.waiting = true; break; }
        F.exotics -= q.exotics || 0;
        c.queue.shift();
        if (q.kind === "ship") {
          const warship = SHIPS[q.id].skill > 0;
          const here = (warship && fleetsAt(s, sys.at).find((f) => f.owner === F.id && !f.path.length && f.ships.every((x) => SHIPS[x.type].skill > 0))) || spawnFleet(s, F.id, sys.at, []);
          here.ships.push({ type: q.id, hull: shipStats(s, F.id, q.id).hull });
          F.stats.built++;
        } else {
          c.buildings[q.id] = true;
          if (q.id === "battery") c.defense = 3;
          if (q.id === "engine") { s.winner = F.id; s.winReason = "engine"; log(s, F.id, `${F.name} finished the Corridor Engine.`, "victory"); }
        }
        if (!F.ai || q.kind === "building") {
          const what = (q.kind === "ship" ? SHIPS : BUILDINGS)[q.id];
          log(s, F.id, `${sys.name} finished ${/^[AEIOU]/.test(q.name) ? "an" : "a"} ${q.name}${what && what.text ? `: ${what.text}` : "."}${q.kind === "ship" && !F.ai ? " It's in orbit, waiting for orders." : ""}`, "build");
        }
      }
      c.stock = Math.min(c.stock, 40); // a world can only stockpile so much
      // Growth.
      const max = maxPop(s, sys);
      if (c.pop < max) { c.growth += RULES.growthPerTurn * (F.id === "kel" ? 1.5 : 1) * (1 + (max - c.pop) / max); if (c.growth >= 1) { c.growth -= 1; c.pop++; } }
      else c.growth = 0;
    }
    const maxDef = c.buildings.battery ? 3 : c.capital ? 2 : 0;
    if (c.defense < maxDef) c.defense = Math.min(maxDef, c.defense + 1);
  }
  // Living hulls heal anywhere; others at their own worlds.
  for (const f of fleetsOf(s, F.id)) {
    const home = s.sysAt[f.at] && s.systems[s.sysAt[f.at]].colony && s.systems[s.sysAt[f.at]].colony.owner === F.id;
    if (home || F.id === "vael") for (const x of f.ships) x.hull = Math.min(shipStats(s, F.id, x.type).hull, x.hull + 1);
  }
}

// ---- winning ----
function score(s, fid) {
  const cols = coloniesOf(s, fid);
  return Math.round(cols.reduce((t, x) => t + (x.colony.kind === "colony" ? 5 + x.colony.pop * 2 : 2), 0) + faction(s, fid).research.done.length * 6 + militaryPower(s, fid) / 4);
}
function checkVictory(s) {
  if (s.winner) return;
  const alive = s.factions.filter((f) => f.alive);
  if (alive.length === 1) { s.winner = alive[0].id; s.winReason = "conquest"; log(s, alive[0].id, `${alive[0].name} stands alone. Conquest victory.`, "victory"); return; }
  if (!player(s).alive) { s.winner = "none"; s.winReason = "fallen"; return; }
  if (s.turn >= RULES.maxTurns) {
    const best = alive.sort((a, b) => score(s, b.id) - score(s, a.id))[0];
    s.winner = best.id; s.winReason = "score"; log(s, best.id, `Turn ${RULES.maxTurns}: ${best.name} leads on score.`, "victory");
  }
}

// ---- ai.js ----
// The computer factions: each turn they pick research, fill their build queues, explore, settle, defend and, when
// they're strong enough and angry enough, go to war. Simple rules, read from what each faction can see.



const PRIORITY = {
  concord: ["xenology", "automation", "sensors", "domes", "commerce", "heavyHulls", "foldDrives", "terraforming", "refining", "orbitalYards"],
  tessan: ["commerce", "automation", "xenology", "sensors", "refining", "heavyHulls", "terraforming", "orbitalYards", "domes"],
  kel: ["automation", "xenology", "commerce", "domes", "terraforming", "sensors", "batteries", "heavyHulls"],
  hegemony: ["automation", "heavyHulls", "shields", "targeting", "orbitalYards", "xenology", "batteries", "refining", "capitalShips"],
  vael: ["sensors", "foldDrives", "automation", "xenology", "shields", "heavyHulls", "corridorTheory", "refining"],
};
const AGGRESSION = { concord: 0.9, tessan: 0.7, kel: 0.9, hegemony: 1.4, vael: 1.0 };
const DIFF = { easy: 0.7, normal: 1, hard: 1.35 };

function aiTurn(s, F) {
  const diff = DIFF[s.difficulty] || 1;
  research(s, F);
  diplomacy(s, F, diff);
  production(s, F, diff);
  fleets(s, F);
}

function research(s, F) {
  if (F.research.current) return;
  const avail = availableTechs(s, F.id); if (!avail.length) return;
  const pri = PRIORITY[F.id] || [];
  const want = pri.find((id) => avail.some((t) => t.id === id)) || [...avail].sort((a, b) => a.cost - b.cost)[0].id;
  // Late in the game, the Corridor Engine.
  setResearch(s, F.id, avail.some((t) => t.id === "engine") && s.turn > 90 ? "engine" : want);
}

function diplomacy(s, F, diff) {
  for (const [oid, r] of Object.entries(F.relations)) {
    const O = faction(s, oid); if (!O.alive || !F.met[oid]) continue;
    const mine = militaryPower(s, F.id), theirs = militaryPower(s, oid);
    if (r.status === "war") {
      // Tired of losing: offer peace. To another computer faction, settle it now; to the player, ask.
      if (r.turnsAtWar > 12 && mine < theirs * 1.1) {
        if (O.ai) propose(s, F.id, oid, "peace");
        else if (!s.offers.some((o) => o.from === F.id)) { s.offers.push({ from: F.id, to: oid, what: "peace", turn: s.turn }); log(s, oid, `${F.name} offers peace.`, "diplo"); }
      }
    } else {
      const angry = r.score < -18 / (AGGRESSION[F.id] || 1);
      if (s.turn > 25 && angry && mine > 6 && mine >= theirs * 1.25 / diff) { declareWar(s, F.id, oid); continue; }
      if (!r.treaty && r.score >= 0 && s.turn % 7 === 0) {
        if (O.ai) propose(s, F.id, oid, "trade");
        else if (!s.offers.some((o) => o.from === F.id)) { s.offers.push({ from: F.id, to: oid, what: "trade", turn: s.turn }); log(s, oid, `${F.name} proposes a trade treaty.`, "diplo"); }
      }
    }
  }
}

/** Systems this faction knows of that it could settle, best first. */
function settleTargets(s, F, kind) {
  const cols = coloniesOf(s, F.id); if (!cols.length) return [];
  const claimed = new Set(fleetsOf(s, F.id).filter((f) => f.dest).map((f) => f.dest));

  // Discoveries: every one, from the first turn. Everything: the latest 80 entries.
  const found = mine.filter((l) => l.fid === me.id && DISCOVERY.includes(l.kind));
  const rows = logFilter === "discovery" ? found : mine.slice(-150);
  // In order: oldest first, under a heading for each turn; the panel opens scrolled to the latest.
  let body = "", turn = null;
  for (const l of rows) {
    if (l.turn !== turn) { if (turn !== null) body += "<\/ul>"; turn = l.turn; body += `<h3 class="log-turn">Turn ${l.turn}<\/h3><ul class="log">`; }
    body += `<li class="${l.kind}">${esc(l.text)}<\/li>`;
  }
  if (turn !== null) body += "<\/ul>";
  return `<h2>Log<\/h2><div class="btn-row"><button class="btn small ${logFilter === "all" ? "primary" : ""}" data-logf="all">Everything<\/button><button class="btn small ${logFilter === "discovery" ? "primary" : ""}" data-logf="discovery">Discoveries (${found.length})<\/button><\/div>` + body;
}

// ---------- the panel's buttons ----------
function bindChrome() {

    if (d.selfleet) { select({ kind: "fleet", id: d.selfleet }); const f = S.fleets[d.selfleet]; if (f) { centerOn(f.at); draw(); } return; }
    if (d.selsys) { select({ kind: "system", id: d.selsys }); centerOn(S.systems[d.selsys].at); draw(); return; }
    if (d.build) { const [k, id] = d.build.split(":"); const r = enqueue(S, sel.id, k, id); if (r.error) toast(r.error, true); }
    else if (d.deq !== undefined) dequeue(S, sel.id, +d.deq);
    else if (d.rush !== undefined) { const r = rush(S, sel.id); if (r.error) toast(r.error, true); }
    else if (d.move !== undefined) { moveMode = !moveMode; if (moveMode) toast("Click where to send this fleet. Esc cancels."); }
    else if (d.stop !== undefined) setDestination(S, sel.id, S.fleets[sel.id].at);
    else if (d.sentry !== undefined) { const f = S.fleets[sel.id]; f.sentry = !f.sentry; if (f.sentry) nextIdle(); }
    else if (d.settle !== undefined) { const at = S.fleets[sel.id].at, r = settle(S, sel.id); if (r.error) toast(r.error, true); else { toast(`${S.systems[S.sysAt[at]].name} is yours.`); if (!S.fleets[sel.id]) sel = { kind: "system", id: S.sysAt[at] }; } }
    else if (d.invade !== undefined) { const r = invade(S, sel.id); if (r.error) toast(r.error, true); else toast(r.taken ? "The world is yours." : "The landing failed.", !r.taken); if (!S.fleets[sel.id]) sel = null; }
    else if (d.merge) { const r = mergeFleets(S, sel.id, d.merge); if (r.error) toast(r.error, true); }
    else if (d.split) { const r = splitFleet(S, sel.id, d.split); if (r.error) toast(r.error, true); else sel = { kind: "fleet", id: r.fleet }; }
    else if (d.tech) setResearch(S, me.id, d.tech);

      else { const r = propose(S, me.id, fid, what); if (r.error) toast(r.error, true); else toast(what === "endTrade" ? "Trade ended." : r.accepted ? "They accept." : "They refuse.", !r.accepted); }
    } else if (d.offer) {
      const [i, ans] = d.offer.split(":"); const o = S.offers[+i];

    } else return;
    save(); renderAll();
  });
  document.querySelectorAll("[data-tab]").forEach((b) => b.addEventListener("click", () => { tab = b.dataset.tab; renderTabs(); renderPanel(); }));
  $("steps").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b || !S) return;

  });

  $("menu").addEventListener("click", () => showMenu());

  document.addEventListener("keydown", (e) => {
    if (!S || e.target.closest("input, textarea, select") || !$("modal").hidden) return;
    if (e.key === "Escape") { moveMode = false; renderPanel(); draw(); }
    if (e.key === "Enter" && !e.repeat) doEndTurn();
    if ((e.key === "m" || e.key === "M") && sel && sel.kind === "fleet") { moveMode = !moveMode; renderPanel(); draw(); }
    if (e.key === "n" || e.key === "N") nextIdle();
  });
}
function idleThings() {
  const me = player(S);
  return [...fleetsOf(S, me.id).filter((f) => !f.path.length && !f.sentry).map((f) => ({ kind: "fleet", id: f.id, at: f.at })),
    ...coloniesOf(S, me.id).filter((x) => x.colony.kind === "colony" && !x.colony.queue.length).map((x) => ({ kind: "system", id: x.id, at: x.at }))];
}
let nextIdx = 0;
function nextIdle() {
  const list = idleThings(); if (!list.length) { toast("Everyone has orders."); return; }

}
function doEndTurn() {
  if (!S || S.winner) return;

  const before = { cols: coloniesOf(S, me.id).length, log: S.log.length };

    const news = S.log.slice(before.log).filter((l) => l.fid === me.id || l.kind === "victory" || (l.kind === "war" && (l.text.includes(me.name))) || ((l.kind === "diplo" || l.kind === "contact") && l.text.includes(me.name))).filter((l) => !l.text.startsWith("Charted ") && l.kind !== "turn");

// First steps: a checklist that ticks itself off as the player does each thing.
function stepsList() {
  const me = player(S), cols = coloniesOf(S, me.id);
  return [
    { id: "research", label: "Choose what to research", done: !!me.research.current || me.research.done.length > 0 },
    { id: "build", label: "Build something at your capital", done: cols.some((x) => x.colony.queue.length) || me.stats.built > 0 },
    { id: "scout", label: "Send your scout into the dark", done: !!(S.tutorial && S.tutorial.scouted) || S.turn > 12 },
    { id: "colony", label: "Found a second colony", done: cols.filter((x) => x.colony.kind === "colony").length >= 2 },
    { id: "turn", label: "End your turn", done: S.turn >= 2 },

}
function renderSteps() {
  const el = $("steps");
  if (!S || !S.tutorial || !S.tutorial.on) { el.hidden = true; return; }
  const list = stepsList(), n = list.filter((x) => x.done).length;
  el.hidden = false;
  if (n === list.length) {
    el.innerHTML = `<div class="steps-head"><b>First steps: done<\/b><button class="x" data-steps-off title="Hide">×<\/button><\/div>
      <p class="small">You're off. Next: build a Factory and a Research lab at your capital, keep two or three frigates at home, and look for your neighbours under <b>Diplomacy<\/b>.<\/p>
      <button class="btn small" data-steps-off>Hide the checklist<\/button>`;

  }

    <ol class="steps">${list.map((x) => `<li class="${x.done ? "done" : x === next ? "now" : ""}"><span>${x.done ? "✓" : ""}<\/span>${esc(x.label)}${x === next ? ` <button class="btn small" data-show="${x.id}">Show me<\/button>` : ""}<\/li>`).join("")}<\/ol>`;
}
function showMe(id) {
  const me = player(S), cap = S.systems[me.capital];
  if (id === "research") { tab = "research"; renderTabs(); renderPanel(); toast("Click a technology to research it. Deep sensors and Xenology are good first picks."); return; }
  if (id === "build") { select({ kind: "system", id: cap.id }); centerOn(cap.at); draw(); toast("Under Add to the queue, click a Scout, a Factory or a Colony ship."); return; }
  if (id === "scout") {
    const f = fleetsOf(S, me.id).find((x) => x.ships.some((y) => y.type === "scout"));
    if (!f) { select({ kind: "system", id: cap.id }); toast("Build a Scout at your capital first."); return; }
    select({ kind: "fleet", id: f.id }); centerOn(f.at); moveMode = true; renderPanel(); draw();
    toast("Your scout is selected. Click a dark hex far from home to send it there."); return;
  }
  if (id === "colony") {
    const f = fleetsOf(S, me.id).find((x) => x.ships.some((y) => y.type === "colony"));
    if (!f) { select({ kind: "system", id: cap.id }); toast("Build a Colony ship at your capital (Add to the queue)."); return; }
    const here = S.sysAt[f.at] && S.systems[S.sysAt[f.at]];
    if (here && canSettle(S, me.id, here, "colony")) { select({ kind: "fleet", id: f.id }); toast(`Your colony ship is at ${here.name}: press Found a colony.`); return; }
    const best = Object.values(S.systems).filter((x) => me.explored[x.at] && canSettle(S, me.id, x, "colony"))

    select({ kind: "fleet", id: f.id });
    if (best) { setDestination(S, f.id, best.at); centerOn(best.at); save(); renderPanel(); draw(); toast(`Your colony ship is on its way to ${best.name}, a good world nearby. When it arrives, select it and press Found a colony.`); }

}

    if (p) p.then(() => toast("Seed copied, with its settings."), fail); else fail();
  };
  $("seed-replay").onclick = () => showNewGame(true, g.preset);
}
function showMenu() {
  modal(`<h1>Menu<\/h1><div class="btn-row col">
    <button class="btn" id="m-resume">Back to the game<\/button>
    <button class="btn" id="m-help">How to play<\/button>
    <button class="btn" id="m-guide">The starter guide<\/button>
    <button class="btn" id="m-steps">${S && S.tutorial && S.tutorial.on ? "Hide" : "Show"} the First steps checklist<\/button>
    <button class="btn" id="m-export">Save code (copy)<\/button>
    <button class="btn" id="m-load">Load a saved game<\/button>
    <button class="btn danger" id="m-new">New game<\/button><\/div>
    <p class="small muted">Your game saves itself in this browser after every action.<\/p>${galaxyBox()}`);
  bindGalaxyBox();
  $("m-resume").onclick = closeModal;
  $("m-help").onclick = () => showHelp(showMenu);
  $("m-guide").onclick = () => showStarter(true);
  $("m-steps").onclick = () => { S.tutorial = S.tutorial || {}; S.tutorial.on = !S.tutorial.on; save(); closeModal(); renderSteps(); };
  $("m-new").onclick = () => showNewGame(!!S);
  $("m-load").onclick = () => showLoad(showMenu);
  $("m-export").onclick = () => {
    const code = btoa(unescape(encodeURIComponent(JSON.stringify(S))));
    modal(`<h1>Save code<\/h1><p class="small">Keep this text somewhere safe; paste it into <b>Load a saved game<\/b> to come back to this turn.<\/p><textarea id="save-code" rows="8" readonly>${esc(code)}<\/textarea><div class="btn-row"><button class="btn primary" id="sc-copy">Copy<\/button><button class="btn" id="sc-back">Back<\/button><\/div>`);
    $("sc-back").onclick = showMenu;
    $("sc-copy").onclick = () => { const p = navigator.clipboard && navigator.clipboard.writeText(code); const fail = () => { $("save-code").select(); toast("Copying is blocked here: the code is selected, copy it yourself."); }; if (p) p.then(() => toast("Copied."), fail); else fail(); };
  };
}
function showLoad(back) {
  modal(`<h1>Load a saved game<\/h1><p class="small">Paste a save code.<\/p><textarea id="load-code" rows="8"><\/textarea><div class="btn-row"><button class="btn primary" id="ld-go">Load<\/button><button class="btn" id="ld-back">Back<\/button><\/div>`);
  $("ld-back").onclick = back;
  $("ld-go").onclick = () => {
    try { const st = JSON.parse(decodeURIComponent(escape(atob($("load-code").value.trim())))); if (!st.factions || !st.systems) throw 0; startGame(st); save(); toast("Loaded."); }
    catch { toast("That isn't a save code.", true); }
  };
}
function showEnd() {
  const me = player(S), won = S.winner === me.id, W = S.winner && S.winner !== "none" ? faction(S, S.winner) : null;
  const why = { conquest: "by conquest", engine: "by finishing the Corridor Engine", score: `with the highest score at turn ${RULES.maxTurns}`, fallen: "" }[S.winReason] || "";
  modal(`<h1>${won ? "Victory" : "Defeat"}<\/h1><p class="lede">${won ? `You win ${why}.` : W ? `${esc(W.name)} wins ${why}.` : "Your people have fallen."}<\/p>
    <table class="tbl"><tr><th>Faction<\/th><th>Worlds<\/th><th>Score<\/th><\/tr>${S.factions.map((F) => `<tr><td><span class="dot" style="background:${F.color}"><\/span>${esc(F.name)}${F.alive ? "" : " †"}<\/td><td>${coloniesOf(S, F.id).length}<\/td><td>${score(S, F.id)}<\/td><\/tr>`).join("")}<\/table>
    <div class="btn-row"><button class="btn primary" id="end-new">New game<\/button><button class="btn" id="end-look">Look at the map<\/button><\/div>${galaxyBox()}`);
  bindGalaxyBox();
  $("end-new").onclick = () => showNewGame(false);
  $("end-look").onclick = closeModal;
}
let toastTimer = null;
function toast(msg, bad) { const t = $("toast"); t.textContent = msg; t.className = "toast show" + (bad ? " bad" : ""); clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.className = "toast"), 4200); }

if (document.readyState === "loading") window.addEventListener("DOMContentLoaded", boot); else boot();

})();
</script>

</body></html>
