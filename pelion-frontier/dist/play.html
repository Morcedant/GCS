    keys: ["Commander Ilse Varga|who hasn't slept in a week", "Lieutenant Pip Doyle|in charge since the commander fell ill", "Commander Soren|a Vulcan, unimpressed by everything", "Lieutenant Commander Aiko Rhee|twenty years on the line"],
    strange: ["a buoy that broadcasts on a frequency no buoy uses", "coordinates repeated in a loop, every eleven seconds", "a Romulan sentry ship that watches but doesn't approach", "a second, fainter signal underneath the first"],
    brief: "A Romulan marker buoy has drifted across the Neutral Zone near {world}. Neither side may touch the other's buoys; touching it could be an act of war. Leaving it means listening to whatever it's saying.",
    arrive: "The buoy turns slowly in Federation space, a black spike a few metres long with a Romulan bird painted on its side. {key} has been watching it for three days from the listening post. \"It isn't drifting,\" {key} says. \"It's holding position. And it's broadcasting {strange}.\"\n\nOn the far side of the Zone, sitting very still, a Romulan sentry ship watches the Pelion arrive.",
    steps: [
      ["Read the buoy", "Rrinn listens for six hours and decodes it: coordinates, dozens of them, on both sides of the Zone. Sevek lays them on the chart and goes very still. \"Captain. These are the Makers' sites. Some I recognize. Many I do not. These are on the Romulan side.\""],
      ["Face the sentry", "The Romulan sentry ship hails, for the first time anyone at the post can remember. Its commander is courteous, and precise, and makes it clear that the buoy is Romulan property, and that the Pelion will not touch it, and that the commander would very much regret having to make that point any other way."],
    ],
    choice: { title: "The buoy", text: "The buoy holds a Romulan map of Makers' sites the Federation has never seen. Copying its data in full would mean touching it: a treaty violation. Leaving it means the Romulans keep their map and the Federation keeps the peace.\n\nThe Romulan commander is watching.",
      options: [
        { id: "copy", name: "Copy its data", blurb: "+12 science, the Romulans' map; a Romulan reprisal against the listening posts.", how: "The Neutral Zone patrolled; a Romulan buoy's map copied.", fx: { science: 12, romulan: 1 }, text: "Grath makes the link in eleven seconds, and the buoy's memory is the Pelion's. The Romulan commander's hail comes a minute later, quite calm, and says only: \"Noted.\" The sentry ship turns and goes. Everyone at the listening post knows what \"noted\" means." },
        { id: "leave", name: "Leave it alone", blurb: "+1 commendation; the Romulans keep their map.", how: "The Neutral Zone patrolled; a Romulan buoy left untouched.", fx: { commendations: 1 }, text: "The captain hails the Romulan commander and says, politely, that the buoy appears to have drifted, and that the Federation wouldn't dream of touching it. A pause. \"Of course,\" the commander says. The buoy is gone by morning. So is the sentry. {key} pours the captain a cup of the asteroid coffee in silent respect." },
      ] },
    fail: "The patrol never came. The buoy finished broadcasting, and went home.",
  },
  "Recover a lost probe or artifact#2": {
    mission: "Recover a lost probe or artifact", name: "The museum's missing piece", type: "Exploration",
    reason: "A shipment from the Federation Archaeological Council went missing near {world}: one crate, on a freighter that arrived without it. The Council wants it back.",
    why: "The missing crate held a Makers' tablet, found on a dig thirty years ago and never deciphered. It's turned up for sale on an Orion market. Someone knows what it's for.",
    thread: "The tablet is a Makers' key: a pattern that tells a caretaker who's allowed near it. The diggers have been using copies to walk past the machines' defences. That's how they cut them out without waking them.",
    keys: ["Curator Aldo Finch|of the Archaeological Council", "Tib Rolle|the freighter's cargo master", "Dr. Ana Kaur|who found the tablet thirty years ago", "Archivist Jun Bell|who packed the crate"],
    strange: ["a tablet covered in a script no one can read", "a crate whose seals were opened and resealed", "an auction listing in an Orion market", "a pattern on the tablet that matches the Corvan II caretaker's carvings"],
    brief: "One crate from the Archaeological Council, gone missing between {world} and Starbase 23. The freighter arrived. The crate didn't. It has turned up for sale on an Orion market.",
    arrive: "The freighter's cargo hold is spotless, and the crate's empty berth has fresh scratches on the clamps. {key} wrings their hands. \"Thirty years in the Council's archive and nobody gave it a second look. And then someone steals it the very first time we move it.\"\n\nRrinn already has the auction listing up: {strange}. Bids close in four days.",
    steps: [
      ["Find the seller", "The listing traces to an Orion trading post in an asteroid field near {world}, the kind of place that changes its name every month. Reyes goes in under cover, as a buyer. She's very good at it, which nobody on the bridge comments on."],
      ["Get it back", "The dealer has three buyers bidding, and one of them is a Klingon, standing very still at the back of the room. Reyes outbids them all with Federation credit she doesn't have, and gets the tablet out before anyone checks."],
      ["Read the tablet", "Sevek works on it for two nights. On the third morning he has it: the tablet isn't writing. It's a pattern. A key, he thinks. The pattern a caretaker reads to know who's allowed near it. Anyone carrying a copy could walk right past one."],
    ],
    choice: { title: "The key", text: "The tablet is a key to the Makers' machines, and the diggers have almost certainly copied it already. Returned to the Archaeological Council, it goes back in a drawer. Sevek could study it aboard the Pelion instead, and learn how to block it, which would mean keeping it from its rightful owners.",
      options: [
        { id: "return", name: "Return it to the Council", blurb: "+1 commendation, +4 supplies in thanks.", how: "The Council's tablet recovered and returned.", fx: { commendations: 1, supplies: 4 }, text: "The tablet goes back to the Council under guard, and {key} weeps a little, holding it. Sevek sends the Council a long, careful letter about what it is. They put it in a better drawer." },
        { id: "study", name: "Keep it to study", blurb: "+12 science; the Council files a complaint.", how: "The Council's tablet recovered and kept for study.", fx: { science: 12, command: 1 }, text: "Sevek keeps the tablet in the science lab, and in a month he understands it well enough to know how a caretaker could be taught to refuse it. The Council files a formal complaint, and Starfleet Command sides with the Council, and Sevek doesn't regret a moment of it." },
      ] },
    fail: "The auction closed without the Pelion. The tablet went to the highest bidder, and the highest bidder was standing at the back of the room.",
  },
  "Mediate a dispute between two worlds#2": {
    mission: "Mediate a dispute between two worlds", name: "The water treaty", type: "Diplomatic",
    reason: "{world} and its twin share a single ice comet that waters them both. It's running out, and each world says the other is taking more than its share.",
    why: "The comet's ice holds a Makers' relay, frozen in its heart. Both worlds have found it, and both think it's theirs, and the diggers would buy it from whichever one wins.",
    thread: "Frozen in the comet's heart is a Makers' relay, still transmitting toward the same point as all the others. Someone has already been out to the comet. There are drill holes in the ice.",
    keys: ["Speaker Olun Breck|for the near world", "Speaker Ama Tessaly|for the far world", "Chief Hydrologist Teo Vance|who has the numbers", "Judge Ilka Morrow|retired, called back to witness"],
    strange: ["a comet whose orbit never decays", "ice that is warmer at the core than the surface", "drill holes in the ice that neither world made", "a signal from the comet's heart, very faint"],
    brief: "{world} and its twin share one comet: every few years it passes close and they each take their water from it. This year it's running short, each says the other is stealing, and both have armed their mining ships.",
    arrive: "The comet hangs between the two worlds, a white smudge trailing its tail, and around it, nose to nose, two fleets of armed ice-haulers. {key} meets the captain on the comet's surface, of all places: the only ground both sides will stand on.\n\n\"We have taken water from this ice for nine hundred years,\" {key} says. \"In fair shares. Until now.\"",
    steps: [
      ["Separate the fleets", "sh'Vari puts the Pelion between the two fleets, close enough to scrape paint, and keeps it there. Neither side wants to be the one to fire past a Federation starship. It isn't peace. It's room to talk."],
      ["Count the water", "The hydrologist's numbers don't add up, and neither do anyone else's. Sevek finds out why: neither world is stealing. Someone else has drilled into the comet: {strange}. The water's been taken from below."],
      ["Find what's inside", "And under the drill holes, in the comet's heart, Sevek's sensors find what the drillers were after: a relay, frozen in the ice, still transmitting. Both worlds knew it was there. Neither told the other."],
    ],
    choice: { title: "The water", text: "Both worlds are short of water and neither is to blame. The captain can propose they share what's left equally and jointly guard the comet. Or that the Federation takes over the comet's management, and the relay with it, and supplies both worlds fairly.",
      options: [
        { id: "share", name: "Share and guard it together", blurb: "+2 accord with {world}; the relay stays in the ice.", how: "The water dispute settled: a shared, guarded comet.", fx: { accord: 2 }, text: "The two speakers sign the new treaty on the comet's surface, standing in the snow. Their fleets turn their guns outward together for the first time in a generation, toward whoever comes to drill next. {key} keeps the pen." },
        { id: "federation", name: "Federation stewardship", blurb: "+10 science from the relay, +1 commendation; both worlds lose a little pride.", how: "The water dispute settled under Federation stewardship.", fx: { science: 10, commendations: 1, accord: -1 }, text: "Starfleet takes the comet into its keeping, and the relay with it. Both worlds get their water, measured and fair, and both resent it a little, the way you resent a referee. Sevek gets the relay. He considers it a good trade." },
      ] },
    fail: "The talks broke down. The haulers fired. Both worlds are thirstier now, and angrier.",
  },
  "Test experimental technology#2": {
    mission: "Test experimental technology", name: "The shield harmonics", type: "Technology",
    reason: "Starfleet R&D has a new shield emitter design: stronger, faster to recover, and built from principles nobody fully understands yet. It needs a starship's power to test.",
    why: "The emitter's design came from studying the field around the Corvan II caretaker. R&D wants to know if Makers' technology can protect a starship. So, Starfleet suspects, do the people taking the machines apart.",
    thread: "The harmonics match the field around every Makers' site: it's how the caretakers protected themselves. Whoever is taking them apart has been learning to build them. House Kor'vath's ships may soon carry Makers' shields.",
    keys: ["Dr. Ruth Calder|of Starfleet R&D, who designed it", "Chief Yanni Pell|an engineer who's installed it twice before", "Commander Ida Vosk|of Starfleet R&D, with a deadline", "Dr. Pell Annix|a brilliant, reckless scientist"],
    strange: ["a shield that sings when it's struck", "harmonics that match the Corvan II field exactly", "an emitter that seems to anticipate the hit", "a power curve no engineer can explain"],
    brief: "Starfleet R&D's new shield emitter, built from principles nobody quite understands, needs a field test under a real starship's power near {world}. It's either a breakthrough or a very expensive fire.",
    arrive: "{key} brings the emitter aboard in a single crate the size of a coffin and installs it personally, with Grath standing over every connection with his arms folded.\n\n\"How does it work?\" Grath asks.\n\n\"We're not entirely sure,\" {key} says, cheerfully. \"That's what the test is for.\"",
    steps: [
      ["Fit it", "Fitting it takes a day. Grath objects to every connection and then, grudgingly, admires most of them. When the emitter powers up the whole ship hums, faintly, a low note just at the edge of hearing. Rrinn's ears flatten and stay that way."],
      ["Take the hits", "The test range: a drone that fires phasers at the Pelion's shields, harder and harder. The new shields take it all and recover in half the time. And they do something else: {strange}. Nobody asked for that."],
      ["Find its limit", "At full power the shields shrug off a hit that would have holed the old ones. And Sevek, reading the harmonics, goes still. \"Captain. These are the same harmonics as the field around the Corvan II caretaker. Exactly the same.\" R&D didn't invent this. They copied it."],
    ],
    choice: { title: "The emitter", text: "It works. It's a stronger shield than anything in the fleet, and it was copied from a Makers' machine. {key} wants it left fitted to the Pelion for further field trials. Sevek is uneasy: nobody knows what else the harmonics do.",
      options: [
        { id: "keep", name: "Keep it fitted", blurb: "Shield emitters fitted to the Pelion for free (Shields 5 → 6); +4 science.", how: "The new shield emitter tested and left fitted to the Pelion.", fx: { science: 4, refit: "shields" }, text: "The emitter stays. The Pelion's shields are the strongest in the sector now, and hum faintly whenever they're up, a low note that the crew come to find oddly comforting. Sevek keeps watching the harmonics, and writes careful notes, and doesn't say what he's worried about." },
        { id: "return", name: "Send it back to R&D", blurb: "+10 science, +1 commendation for caution.", how: "The new shield emitter tested and returned to R&D.", fx: { science: 10, commendations: 1 }, text: "The emitter goes back to R&D with Sevek's notes attached: a long, careful document about the Makers' harmonics and what nobody knows about them. {key} is disappointed. R&D reads the notes, and quietly puts the program on hold." },
      ] },
    fail: "The trials never happened. R&D's emitter sits in its crate, and the questions it raises go unasked.",
  },
  "Ferry a delegation to a world that left the Federation#2": {
    mission: "Ferry a delegation to a world that left the Federation", name: "The broken treaty", type: "Diplomatic",
    reason: "{world} left the Federation over a trade treaty it says Starfleet broke. It's been ten years. They've asked for a delegation to talk about the terms of coming back.",
    why: "{world} is offering to come back to the Federation in exchange for protection: something has been digging in their mountains, and they're frightened.",
    thread: "{world}'s mountains held a Makers' site, and it's been dug up. Their scouts saw the diggers: Orion crews, and a Klingon ship that paid them. {world} came back to the Federation because the diggers frightened them more than old grudges.",
    keys: ["Chancellor Mira Dov|who signed the treaty, and the withdrawal", "Trade Minister Rook|who still thinks the Federation cheated", "Envoy Sela Grant|the Federation's last ambassador here", "Captain Jon Abara|of their small defence fleet"],
    strange: ["a treaty clause nobody on either side remembers agreeing to", "scouts' reports of lights in the mountains", "a trade ledger that doesn't balance by eleven percent", "a mountain pass that's been closed for a month"],
    brief: "{world} left the Federation ten years ago over a broken trade treaty. Now they've asked for a delegation. The message doesn't say why, and it's the first time in a decade they've called.",
    arrive: "{world}'s capital is ten years older and poorer than the briefing pictures, but not bitter. The delegation is met at the spaceport by {key}, and taken, before anything else, to see the mountains on the horizon, where at night there are lights.\n\n\"That's why we called,\" {key} says. \"We'll talk about the treaty. But that's why.\"",
    steps: [
      ["Settle the old grievance", "The treaty dispute takes a day of shouting and a night of ledgers. Rrinn finds it: {strange}. Neither side cheated. Both were cheated, by the same broker, who's long gone. It doesn't fix ten years. But it lets everyone stop shouting."],
      ["Hear the new fear", "Then {world}'s scouts tell the delegation about the mountains: a ruin nobody visited, and since last month, lights, cutting, ships coming and going at night. Their small fleet went to look. It came back with holes in it."],
      ["See for themselves", "Reyes and Sevek go up the mountain with two of {world}'s scouts. They find the ruin cut open, the caretaker gone, and the diggers' camp abandoned, still warm. In the mud, a footprint too big for an Orion."],
    ],
    choice: { title: "The terms", text: "{world} wants to rejoin the Federation, and wants a Starfleet guard on their mountains as the price. The delegation can agree on Starfleet's behalf, which isn't quite its place. Or carry the request back, and let Starfleet decide, which will take months.",
      options: [
        { id: "agree", name: "Agree to the guard", blurb: "+3 accord with {world}; Starfleet Command marks a box for promising its ships.", how: "{world} brought back toward the Federation, with a guard promised.", fx: { accord: 3, command: 1 }, text: "The delegation agrees, and {world}'s council votes to apply for readmission the same night. There's dancing in the capital. Starfleet Command's response is, to put it mildly, firm. But the guard is sent, and the mountain lights don't come back." },
        { id: "carry", name: "Carry the request back", blurb: "+1 accord, +1 commendation.", how: "{world}'s request to rejoin carried to Starfleet.", fx: { accord: 1, commendations: 1 }, text: "The request goes back to Starfleet through proper channels, with the delegation's strong recommendation attached. {key} understands. That doesn't make the waiting easier. The mountain lights come back twice more before the answer does." },
      ] },
    fail: "The delegation never arrived. {world} watched its mountains alone, and stopped calling.",
  },
  "Shore leave that goes wrong#2": {
    mission: "Shore leave that goes wrong", name: "The festival of masks", type: "Crew",
    reason: "Shore leave at {world}'s Festival of Masks, the most famous party in the sector. The crew have earned it.",
    why: "Starfleet Intelligence would like the Pelion's crew to keep their eyes open at the Festival: Orion brokers are said to be selling Makers' pieces there, behind the masks.",
    thread: "Behind the Festival's masks, an Orion broker was selling Makers' fragments to a buyer in a Klingon house's colours. Two of the Pelion's crew saw the deal. Now they know the broker's name.",
    keys: ["Mistress Vey|who owns the Festival's grandest house", "Constable Haro Finch|of the colony constabulary", "Lord Masque|the Festival's master of ceremonies", "Tamsin Ro|a fortune-teller who knows everyone"],
    strange: ["masks that change their faces when no one's looking", "a masked broker selling pieces of ancient machinery", "a dance that everyone knows and no one was taught", "a mask that won't come off"],
    brief: "Shore leave at {world}'s Festival of Masks: a week of music and masks and nobody being who they are. The crew have been counting the days.",
    arrive: "{world}'s capital at Festival time is a riot of colour: every face masked, every street lantern-lit, music from every window. The crew pour down from the transporter room in borrowed masks, and the captain watches them go, and allows themselves a moment of hope that this will be a quiet week.\n\nIt lasts until the second evening, when {key} comes to find the captain with an expression the mask doesn't quite hide.",
    steps: [
      ["Find out what happened", "Three crew members, one of them Rrinn, are in a cell under the Festival hall: caught, they say, where they shouldn't have been, behind a curtain where {strange}. Rrinn says she heard something she wasn't supposed to hear. Rrinn is very hard to sneak up on."],
      ["Get them out", "The captain argues them out of the cell with a mixture of charm, Starfleet credit, and a quiet word from Reyes. On the way back to the ship Rrinn tells the captain what she heard: a broker's name, a price, and a buyer with Klingon accents."],
    ],
    choice: { title: "The broker", text: "Rrinn knows the broker's name and where they'll be tomorrow night. {key} would very much like this not to become a Starfleet matter: the Festival lives on discretion. The captain can let Starfleet Intelligence know, quietly, or step in personally, publicly, and stop the deal.",
      options: [
        { id: "quiet", name: "Tell Intelligence, quietly", blurb: "+8 science from what they learn; the Festival never knows.", how: "Shore leave at the Festival, and a broker's name passed to Intelligence.", fx: { science: 8 }, text: "The name goes to Starfleet Intelligence in a coded burst from orbit, and the rest of the Festival passes in music and masks. Three weeks later, a broker who sold to a Klingon house stops answering their messages. The crew come back aboard tired, sunburned and happy, which is the whole point of shore leave." },
        { id: "stop", name: "Stop the deal", blurb: "+1 commendation; the Festival is not pleased with Starfleet.", how: "Shore leave at the Festival, and an Orion deal stopped in public.", fx: { commendations: 1, accord: -1 }, text: "Reyes walks into the deal at midnight, in a Festival mask and Starfleet uniform, and the broker runs, leaving the pieces on the table. It's spectacular. It's also the talk of the Festival for all the wrong reasons, and {key} makes it clear that the Pelion's crew will not be welcome next year." },
      ] },
    fail: "Shore leave ended badly. Three of the crew spent the Festival in a cell, and the broker's name went unheard.",
  },
  "Carry a message across the Neutral Zone#2": {
    mission: "Carry a message across the Neutral Zone", name: "The prisoner exchange", type: "Security",
    reason: "A Starfleet officer captured by the Romulans six years ago is to be exchanged at the edge of the Neutral Zone. The Romulans asked for the Pelion. Nobody knows why.",
    why: "The Romulans are offering more than a prisoner: their exchange officer wants to talk, quietly, about a common enemy digging up sites on both sides of the Zone.",
    thread: "The Romulan officer's message is plain: the diggers have taken sites on the Romulan side too, and the Romulans know who's paying them. House Kor'vath. The Romulans would like it known they didn't do it.",
    keys: ["Admiral Rhys Caldwell|who arranged the exchange", "Lieutenant Sabine Aube|an admiral's intelligence aide", "Dr. Nils Arden|a Starfleet doctor sent to meet the prisoner", "Commander Hollis Reyne|who served with the prisoner before her capture"],
    strange: ["a prisoner who's been held for six years and doesn't know the war's over", "a Romulan officer who asks to speak to the captain alone", "a message slipped into the exchange papers", "an exchange point no Federation ship has visited in decades"],
    brief: "A prisoner exchange at the edge of the Neutral Zone near {world}: one Starfleet officer, held six years, for a Romulan held two. The Romulans asked for the Pelion by name.",
    arrive: "The exchange point is a patch of empty space the treaty set aside a century ago. A Romulan bird-of-prey waits there, decloaked, which in itself is a statement. Its commander hails: Subcommander Velan. Correct, cold, very formal. \"Captain. You are expected.\"\n\nAboard the Pelion for the exchange is {key}. In the brig, the Romulan prisoner waits, perfectly calm. Somewhere aboard the bird-of-prey is a Starfleet officer who hasn't seen home in six years.",
    steps: [
      ["Make the exchange", "Two officers cross between two ships in the same instant, beams locked together so neither side can cheat. The Starfleet officer materializes on the Pelion's transporter pad thin, pale and upright, and salutes the captain, and then sits down on the pad very suddenly and puts her face in her hands. Vessik is beside her before anyone else moves."],
      ["Take the message", "The Romulan exchange officer asks for one more thing: a word with the captain, alone, by viewscreen. When the captain agrees, the Romulan speaks quickly and quietly: their sites have been dug up too. They know who's paying. They would like the Federation to know it isn't them."],
    ],
    choice: { title: "The offer", text: "The Romulan officer has offered, without quite saying so, to share what they know about the diggers: in exchange for what the Federation knows. It would be an unprecedented channel between the two powers. Starfleet would never authorize it. The captain could open it anyway, or report the offer and leave it to the admirals.",
      options: [
        { id: "open", name: "Open the channel", blurb: "+14 science from what they share; Starfleet Command marks a box.", how: "The prisoner exchanged; a quiet channel opened with a Romulan officer.", fx: { science: 14, command: 1 }, text: "A coded frequency, a schedule, two officers on opposite sides of a line who will never meet. What comes through it in the months that follow is extraordinary. Starfleet Command finds out, eventually, and is furious, and keeps using it." },
        { id: "report", name: "Report it and wait", blurb: "+1 commendation; the offer is never repeated.", how: "The prisoner exchanged; the Romulan offer reported to Starfleet.", fx: { commendations: 1 }, text: "The captain reports the offer word for word, and Starfleet Command thanks them for their discretion and does nothing at all. The Romulan never calls again. The rescued officer, at least, is home, and on her first night aboard she eats three dinners." },
      ] },
    fail: "The Pelion never came. The Romulans took their officer home, and Starfleet's officer back to her cell.",
  },
});

/**
 * Complications: partway through an order, something goes wrong. Press on (an opposed roll: win and you gain ground,
 * lose and it costs you) or fall back (safe, but a week lost). One set for each kind of mission.
 */
const COMPLICATIONS = {
  Rescue: { title: "A second disaster", text: "Halfway through, it gets worse. A secondary explosion somewhere below decks, a deep boom felt through the boots more than heard, and then a hull section groaning and giving way. Smoke rolls down the corridor toward the rescue team, thick and yellow, and on the far side of it, through the haze, there are still people: Reyes can see their hand-lights waving.\n\n\"Thirty seconds before that bulkhead seals itself,\" Grath says over the comm, very fast. \"Maybe forty. After that, they're on the wrong side of it.\"", oppose: { name: "the spreading disaster", skill: "Severity", target: 12 }, skills: ["Engineering", "Medicine", "Leadership"], cost: "hurt", costText: "a rescuer is hurt getting them out", press: "Send the team in now", win: "They go in through the smoke on a single tether, Reyes leading, hand over hand. It's thirty-eight seconds. The bulkhead slams down behind the last of them with a sound like a bell, and on the right side of it, coughing, blackened, every one of them alive, the survivors start to laugh, the way people do when they shouldn't have lived.", lose: "They get everyone out. But the bulkhead comes down a second early, and one of the rescuers is caught by the edge of it. Vessik is already moving before the call for a medic finishes. \"Broken, not crushed,\" he says, working. \"They'll mend. They were lucky.\" Nobody in the corridor feels lucky." },
  Diplomatic: { title: "A walkout", text: "Mid-session, without warning, one delegation stands. Their leader gathers their papers with great deliberation, says something in their own language that the translator renders, after a pause, as \"We will not be spoken to like this,\" and walks out. Nobody else in the room heard an insult. Everybody in the room heard the door.\n\nsh'Vari is already on her feet. \"Their shuttle's on the landing pad, Captain. If they reach it, there are no more talks.\"", oppose: { name: "wounded pride", skill: "Grievance", target: 12 }, skills: ["Diplomacy", "Psychology", "Leadership"], cost: "accord", costText: "the talks sour: accord −1", press: "Go after them", win: "The captain catches them at the shuttle ramp, alone, without guards and without notes, and asks one question: what did they hear? It turns out to be a single word, mistranslated, that meant something very different in their tongue. The captain apologizes for it, simply, in front of their whole delegation. After a long moment, they walk back in.", lose: "The captain reaches them at the shuttle ramp, but the words don't land; whatever was heard in that room, an apology now sounds like an admission. They go home. They come back two days later, at a lower table, with lower expectations, and the talks are poorer for it." },
  Exploration: { title: "The readings spike", text: "Without warning the sensor readings spike off every scale at once. Something out there has noticed the Pelion's scans, and it doesn't like them: the harder the ship looks, the harder it pushes back. The deck lights flicker. A console on the science station sparks and dies.\n\n\"It is responding to us,\" Sevek says, quite calmly, with smoke curling past his shoulder. \"Each scan, a stronger response. I estimate the array can tolerate perhaps two more minutes.\"", oppose: { name: "the phenomenon", skill: "Strangeness", target: 12 }, skills: ["Sensors", "Physical Sciences", "Computers"], cost: "sensors", costText: "the sensor array burns out a box", press: "Hold position and keep scanning", win: "Sevek doesn't stop. He narrows the beam instead, lower power, longer pulse, and the thing out there settles, like an animal that's decided the light isn't going to hurt it. Two minutes become ten. Ten become an hour. When the array finally cools, the Pelion has more data than it came for, and the phenomenon is still there, still calm, as if it had chosen to be studied.", lose: "The third scan is one too many. The response comes back like a slap: every sensor on the forward array overloads at once, and the bridge goes briefly blind. When the screens come back, half the array is dark and Grath is already swearing at it from a Jefferies tube. \"It bit us,\" he says. \"It actually bit us.\"" },

// ---- sector.js ----
// The Corvan Sector: a hex map with the Federation's starbase and colonies to the southwest, two Klingon outposts on
// the eastern border, the Romulan Neutral Zone along the top, and between them independent worlds, pre-warp peoples,
// anomalies, ruins and empty systems (one of which hides an Orion pirate base).


const RADIUS = 8;
const px = (k) => toPixel(k, 1);
const inZone = (k) => parse(k).r <= -RADIUS + 1;                 // the top two rows
const nearZone = (k) => parse(k).r === -RADIUS + 2;

function makeSector(seed) {
  const R = makeRng(seed);
  const hexes = {};
  for (const k of hexagon(RADIUS)) hexes[k] = { terrain: inZone(k) ? "zone" : "space" };
  // Nebulae: three clouds, away from the zone.
  const open = Object.keys(hexes).filter((k) => !inZone(k));
  for (let n = 0; n < 3; n++) {
    let c = R.pick(open);
    for (let i = 0; i < 5; i++) {
      if (hexes[c] && !inZone(c)) hexes[c].terrain = "nebula";
      const { q, r } = parse(c), d = [[1, 0], [0, 1], [-1, 1], [-1, 0], [0, -1], [1, -1]][R.int(6)];
      c = key(q + d[0], r + d[1]);
    }
  }
  const systems = {}, sysAt = {};
  const used = [];
  const free = (k, gap = 2) => hexes[k] && !inZone(k) && !sysAt[k] && used.every((u) => distance(u, k) >= gap);
  let names = [...NAMES];
  const take = () => { const i = R.int(names.length); const n = names[i]; names.splice(i, 1); return n; };
  const place = (k, kind, extra = {}) => {
    const id = "s" + (Object.keys(systems).length + 1);
    systems[id] = { id, at: k, kind, name: extra.name || take(), surveyed: false, harm: 0, ...extra };
    sysAt[k] = id; used.push(k);
    return systems[id];
  };
  const pickWhere = (test, gap = 2) => {
    const c = open.filter((k) => free(k, gap) && test(k));
    return c.length ? R.pick(c) : open.find((k) => free(k, 1));
  };
  const P = (k) => px(k);
  // The starbase, southwest; colonies around it.
  const sb = pickWhere((k) => P(k).x < -6 && P(k).y > 4.5 && distance(k, "0,0") >= 6 && distance(k, "0,0") <= 7);
  place(sb, "starbase", { name: "Starbase 23", surveyed: true });
  for (let i = 0; i < 3; i++) place(pickWhere((k) => distance(k, sb) >= 2 && distance(k, sb) <= 5 && P(k).x < 0), "colony", { surveyed: true });
  // Klingon outposts on the eastern edge.
  for (let i = 0; i < 2; i++) place(pickWhere((k) => P(k).x > 8 && Math.abs(P(k).y) < 9, 4), "klingon", { surveyed: true });
  // Corvan II: the first mission, a few days out from the starbase.
  const cv = pickWhere((k) => distance(k, sb) >= 5 && distance(k, sb) <= 7 && P(k).x < 4 && P(k).y > -6);
  names = names.filter((n) => n !== "Corvan");
  place(cv, "prewarp", { name: "Corvan II", ruinsToo: true });
  // Independent worlds in the middle band, where the Federation and the Empire compete for them.
  for (let i = 0; i < 6; i++) place(pickWhere((k) => P(k).x > -6 && P(k).x < 10 && distance(k, sb) >= 5, 3), "independent", { surveyed: true, accord: i < 2 ? 1 : 0 });
  for (let i = 0; i < 3; i++) place(pickWhere(() => true), "prewarp");
  for (let i = 0; i < 5; i++) place(pickWhere(() => true), "anomaly", { clock: 0, need: 3 + R.int(3) });
  for (let i = 0; i < 3; i++) place(pickWhere(() => true), "ruins", { clock: 0, need: 4 + R.int(2) });
  // The Orion base: far from the starbase, in a nebula if one is free.
  const neb = open.filter((k) => hexes[k].terrain === "nebula" && free(k) && distance(k, sb) >= 7);
  place(neb.length ? R.pick(neb) : pickWhere((k) => distance(k, sb) >= 8), "orionBase", { baseHull: 0, baseShields: 0 });
  for (let i = 0; i < 9; i++) place(pickWhere(() => true), "empty");
  // Starfleet's charts: the core's worlds are known; the rest is "uncharted" until surveyed.
  return { hexes, systems, sysAt, starbase: systems[sysAt[sb]].id, corvan: systems[sysAt[cv]].id };
}

// ---- game.js ----
// The rules: one JSON state, changed only by these functions. Every roll is the tabletop game's: 3d6 at or under a
// skill target, 3 or 4 always succeeds, 17 or 18 always fails; the margin is how far under.




// ---------- dice ----------
function rand(S) { const r = makeRng(0); r.setState(S.rng); const v = r.next(); S.rng = r.state(); return v; }

const pick = (S, list) => list[Math.floor(rand(S) * list.length)];
/** A 3d6 check against a target. */
function check(S, target) {
  const dice = [d6(S), d6(S), d6(S)], total = dice[0] + dice[1] + dice[2];
  const success = total <= 4 || (total <= target && total < 17);
  return { dice, total, target, success, margin: target - total };
}

// ---------- a new game ----------
function newGame({ seed, difficulty = "normal", captain = "" } = {}) {

  const sb = sec.systems[sec.starbase];
  const S = {
    v: 1, seed: String(seed), difficulty, captain: captain.trim() || "Captain", turn: 1, rng: hashString("dice:" + seed),
    hexes: sec.hexes, systems: sec.systems, sysAt: sec.sysAt, starbase: sec.starbase, corvan: sec.corvan,
    pelion: { at: sb.at, warp: CRUISE_WARP, days: 7, mp: lyPerWeek(CRUISE_WARP), acted: false, shields: 0, hull: 0, sys: { weapons: 0, engines: 0, sensors: 0 }, torps: PELION.torps, refits: {}, zoneMarked: false, docked: true },
    stations: { helm: "shvari", tactical: "reyes", science: "sevek", engineering: "grath", comms: "rrinn" },
    crew: Object.fromEntries(CREW.map((c) => [c.id, { inj: 0, duty: 2, xp: 0, plus: {}, acted: false }])),
    backlog: [],   // orders waiting their turn
    campaign: { threads: [], beats: [], finale: false, over: null },   // Watchers of the Void
    tried: {},   // actions tried this turn: each can be attempted once a turn
    support: {}, enemies: {}, nextId: 1,
    supplies: 20, science: 0, command: 0, tension: 2, commendations: 0,
    records: [], orders: [], done: 0, failed: 0, lostColonies: 0, lostWorlds: 0, joined: 0, arc: { stage: "travel", countdown: 0, clock: 0, clues: {}, seen: false },
    visible: {}, seenSys: {}, log: [], over: null, pending: null, battle: null, event: null, tutorial: { on: true },
  };
  for (const s of Object.values(S.systems)) if (KINDS[s.kind].known) S.seenSys[s.id] = true;
  S.seenSys[S.corvan] = true; S.systems[S.corvan].surveyed = true;
  // The first orders: The Silence at Corvan II. An Orion raider is already in orbit there.
  const cv = S.systems[S.corvan];
  S.orders.push({ id: "o1", arc: true, title: "The Silence at Corvan II", at: cv.at, sys: cv.id, skills: [], segs: 0, have: 0, urgent: true,
    deadline: 1 + Math.ceil(distance(sb.at, cv.at) / lyPerWeek(8)) + 2,   // urgent: Starfleet expects maximum warp
    text: "The Federation research outpost on Corvan II, eight archaeologists studying the ruins of an extinct civilization, has missed three check-ins. Corvan II has a native people, the Ketari, at a bronze-age level: the outpost works under the Prime Directive. An Orion raider was reported in the sector last week.",
    twist: null, personal: "Rrinn's sister serves on the outpost's supply run.", issued: 1 });
  // The raider holds station on the far side of Corvan II's moon: passive sensors won't see it; an active sweep will.
  spawnEnemy(S, "orion", cv.at, { goal: "arc", hostile: true, home: cv.at, hidden: true, arcRaider: true });
  const ob = Object.values(S.systems).find((s) => s.kind === "orionBase");
  spawnEnemy(S, "orionBase", ob.at, { goal: "base", hostile: true, found: false });
  log(S, "Orders from Starfleet Command, urgent: the research outpost on Corvan II has gone silent. Proceed at maximum emergency warp and investigate.", "order");
  postsOf(S);   // the listening posts on the Neutral Zone
  // Starfleet's other orders for the Pelion are already waiting: in the backlog until Corvan II is done.
  for (let i = 0; i < 3; i++) newOrder(S);
  updateVisibility(S);
  return S;
}

// ---------- small helpers ----------
const stardate = (S) => (STARDATE0 + (S.turn - 1) * 7.3).toFixed(1);
const sysAt = (S, hex) => S.sysAt[hex] && S.systems[S.sysAt[hex]];
const officer = (id) => CREW.find((c) => c.id === id);
const hasRecord = (S, perk) => S.records.some((id) => RECORDS.find((r) => r.id === id)?.perk === perk);
/** The captain's log, oldest first. Discoveries are never trimmed: the log keeps the newest 300 other entries. */
function log(S, text, kind = "", extra = null) {
  S.logSeq = (S.logSeq || 0) + 1;   // each entry is numbered, so the page can show what one choice led to
  S.log.push({ id: S.logSeq, t: S.turn, text, kind, ...(extra || {}) });
  let n = S.log.length - 300;
  for (let i = 0; i < S.log.length && n > 0; ) { if (S.log[i].kind !== "discovery") { S.log.splice(i, 1); n--; } else i++; }
}
/** A story scene: shown as a dialog, and written in full into the log. */
function storyEvent(S, title, text, extra = null) {
  const ev = { kind: "story", title, text };
  if (S.event) (S.eventQueue = S.eventQueue || []).push(ev); else S.event = ev;   // a second scene waits for the first
  log(S, `${title}: ${text}`, "discovery", { ...(extra || {}), story: true });
}
const available = (S, id) => S.crew[id].inj < 3;
/** Fit for duty and hasn't acted this turn: every officer acts once a turn, on the bridge or with the away team. */
const free = (S, id) => available(S, id) && !S.crew[id].acted;
function skillOf(S, id, skill) {
  if (id === "captain") return CAPTAIN.skills[skill] || 10;
  const base = officer(id).skills[skill];
  return base ? base + (S.crew[id].plus[skill] || 0) : 0;
}
/** The best available officer for one of these skills (highest target), and the skill. */
function bestOfficer(S, skills, ctx = {}, ids = null, freeOnly = false) {
  let best = null;
  for (const c of CREW) {
    if (!(freeOnly ? free(S, c.id) : available(S, c.id)) || (ids && !ids.includes(c.id))) continue;
    for (const sk of skills) {
      const t = target(S, c.id, sk, ctx).total;
      if (skillOf(S, c.id, sk) && (!best || t > best.total)) best = { officer: c.id, skill: sk, total: t };
    }
  }
  return best;
}
/** Who stands a station in battle: the assigned officer, or the best available if they're in sickbay. */
function stationOfficer(S, station) {
  const SK = { helm: "Helm", tactical: "Phasers", science: "Sensors", engineering: "Engineering", comms: "Communications" }[station];
  const id = S.stations[station];
  if (id && available(S, id)) return id;
  const b = bestOfficer(S, [SK]); return b ? b.officer : null;
}
const sensorsRating = (S) => PELION.sensors + (S.pelion.refits.sensors ? 1 : 0);
const sysPenalty = (boxes) => boxes >= 3 ? -99 : -2 * boxes;
/** A roll's target, with each modifier named. ctx: { action, combat, listen, unit } */
function target(S, id, skill, ctx = {}) {
  const parts = [];
  const base = skillOf(S, id, skill); parts.push([id === "captain" ? "Captain" : officer(id).short + " · " + skill, base]);
  if (id !== "captain") {
    const o = officer(id);
    if (o.advWhen({ ...ctx, skill })) parts.push([o.adv, 2]);
    if (S.crew[id].inj === 2) parts.push(["Wounded", -2]);
  }
  const P = S.pelion;
  if (skill === "Sensors" && !ctx.unit) {
    const r = sensorsRating(S); if (r !== 2) parts.push(["Ship's sensors", r - 2]);
    if (P.sys.sensors) parts.push(["Sensors damaged", Math.max(-6, sysPenalty(P.sys.sensors))]);
  }
  if ((ctx.action === "survey" || ctx.action === "investigate") && hasRecord(S, "science1")) parts.push(["Graviton lensing", 1]);
  if (ctx.action === "envoy" && hasRecord(S, "envoy1")) parts.push(["A dead language", 1]);
  if (ctx.action === "sweep" && hasRecord(S, "sweep2")) parts.push(["Cloaked wake", 2]);
  if (ctx.action === "sweep" && S.pelion.refits.inverter) parts.push(["Cloak inverter", 2]);
  if (ctx.action === "sweep") parts.push(["Hunting the hidden", -2]);
  if (ctx.order && ctx.order.twist && ctx.order.twist.fx === "hard" && !ctx.order.oppose) parts.push([ctx.order.twist.text, -2]);
  if (ctx.order && enemiesAt(S, ctx.order.at).some((e) => e.power === "klingon" && !e.hostile)) parts.push(["Klingons in the way", -2]);
  if (ctx.extra) parts.push(...ctx.extra);
  return { parts, total: parts.reduce((t, p) => t + p[1], 0) };
}

// ---------- the map: movement and sight ----------
function moveCost(S, hex, who = "pelion") {
  const h = S.hexes[hex]; if (!h) return Infinity;
  if (h.terrain === "nebula") return who === "pelion" && hasRecord(S, "eddies") ? 1 : 2;
  return 1;
}
// ---------- warp ----------
// Speed the original-series way: v = W³ × c, W the warp factor. A hex is a light-year and a turn is a week, so a week at
// warp W covers 7·W³/365.25 light-years: warp 6 (the Pelion's maximum stable speed, 216c) about 4.1, warp 8 (its maximum
// emergency speed, 512c) about 9.8. Impulse is sublight: for moving within a system, not between them.
const CRUISE_WARP = 6;
const lightSpeeds = (w) => (w > 0 ? w ** 3 : 0);                          // v = W³ × c
const lyPerWeek = (w) => (7 * lightSpeeds(w)) / 365.25;
const daysPerLy = (w) => (w > 0 ? 365.25 / lightSpeeds(w) : Infinity);
/** The highest warp the engines allow: warp 8, the emergency maximum, less 2 for each box of engine damage. */
const EMERGENCY_WARP = 8;
function maxWarp(S) {
  const e = S.pelion.sys.engines;
  return e >= 3 ? 1 : EMERGENCY_WARP - 2 * e;
}
/** Light-years the Pelion has left this turn: the days left in the week at its warp factor. */
function syncMp(S) { const P = S.pelion; P.mp = P.days * lightSpeeds(P.warp) / 365.25; }
/** Change the warp factor: 0 is impulse. The days left in the week stay the same; the distance they cover changes. */
function setWarp(S, w) {

/** How a warp factor reads: "Warp 6: 216 × the speed of light, 4.1 ly a week, 1.7 days a light-year". */
function warpText(w) {

const closestOutpost = (S, at) => Object.values(S.systems).filter((s) => s.kind === "klingon").sort((a, b) => distance(a.at, at) - distance(b.at, at))[0];

// ---------- support ships ----------
function requisition(S, type) {
  const T = SUPPORT[type];
  if (!S.pelion.docked) return { error: "Requisitions are made at Starbase 23." };
  if (Object.keys(S.support).length >= 3) return { error: "Starfleet can spare three ships at most." };
  if (S.supplies < T.cost) return { error: `Needs ${T.cost} supplies.` };
  S.supplies -= T.cost;
  const used = Object.values(S.support).map((u) => u.name);
  const name = SUPPORT_NAMES.find((n) => !used.includes(n)) || "USS " + S.nextId;
  const id = "u" + S.nextId++;
  S.support[id] = { id, type, name, at: S.systems[S.starbase].at, mp: 0, acted: true, shields: 0, hull: 0 };
  log(S, `The ${name} (${T.name}) joins the Pelion's command. It's ready next turn.`, "good");

}

  const R = REFITS[id];
  if (!S.pelion.docked) return { error: "Refits are fitted at Starbase 23." };
  if (S.pelion.refits[id]) return { error: "Already fitted." };
  if (S.science < R.cost) return { error: `Needs ${R.cost} science.` };
  S.science -= R.cost; S.pelion.refits[id] = true;

function setStation(S, station, id) { if (!available(S, id)) return { error: "In sickbay." }; S.stations[station] = id; return { ok: true }; }

// ---------- scoring and the end ----------
function score(S) {
  const sys = Object.values(S.systems);
  const parts = [
    ["Worlds joined the Federation", S.joined * 10],
    ["Library records", S.records.length * 6],
    ["Orders carried out", S.done * 4],
    ["Commendations", S.commendations],
    ["Colonies safe", sys.filter((s) => s.kind === "colony").length * 5],
    ["Systems surveyed", sys.filter((s) => s.surveyed && !KINDS[s.kind]?.known && s.id !== S.corvan).length],
    ["Starfleet Command track", -S.command * 4],
    ["Worlds lost to the Klingon Empire", -S.lostWorlds * 8],
    ["Colonies lost", -S.lostColonies * 10],
    ["Listening posts lost", -Object.values(postsOf(S)).filter((p) => p.lost).length * 5],
    [`${CAMPAIGN.title}: threads found`, Math.min(CAMPAIGN.finaleAt, campaignOf(S).threads.length) * 2],
    [`${CAMPAIGN.title}: the Gate`, campaignOf(S).over === "close" || campaignOf(S).over === "guard" ? 25 : campaignOf(S).over === "lost" ? -10 : 0],
  ];
  return { parts, total: parts.reduce((t, p) => t + p[1], 0) };
}
function rating(total) {
  // Every officer acts each turn, so a good tour scores high: these thresholds assume it.
  return total >= 290 ? "Legendary: the Corvan Sector will tell stories about the Pelion" : total >= 210 ? "Commended: a fine tour, and a ship Starfleet is proud of"
    : total >= 140 ? "Satisfactory: the sector is no worse than you found it" : "Recalled: Starfleet Command has questions";
}
function checkEnd(S) {
  if (S.over) return;
  if (S.pelion.hull >= PELION.hull) S.over = { win: false, why: "The Pelion's hull gave way. The crew abandoned ship, and Starfleet lost a Heavy Cruiser." };
  else if (S.turn > TOUR) S.over = { win: true, why: "The Pelion's tour of the Corvan Sector is over." };
}

// ---------- hooks set by the other modules (they import game.js, so they register here) ----------
let startBattleHook = () => {}, arcActionsHook = () => [], arcStepHook = () => "", arcSweepHook = () => {}, arcArriveHook = () => {};
function registerHooks(h) { if (h.startBattle) startBattleHook = h.startBattle; if (h.arcActions) arcActionsHook = h.arcActions; if (h.arcStep) arcStepHook = h.arcStep; if (h.arcSweep) arcSweepHook = h.arcSweep; if (h.arcArrive) arcArriveHook = h.arcArrive; }

// ---- combat.js ----
// Ship combat, from the Players' Guide's "The USS Pelion": exchanges; Power to spend on shields, phasers and

const shieldsMax = (S) => PELION.shields + (S.pelion.refits.shields ? 1 : 0) + (hasRecord(S, "shield1") ? 1 : 0);

function battleStats(S) {
  const P = S.pelion, helmId = stationOfficer(S, "helm"), gunId = stationOfficer(S, "tactical"), engId = stationOfficer(S, "engineering");
  const helm = helmId ? target(S, helmId, "Helm", { combat: true }).total + Math.max(-6, sysPenalty(P.sys.engines)) : 8;
  const gun = gunId ? target(S, gunId, "Phasers", { combat: true }).total + (P.refits.phasers ? 1 : 0) + Math.max(-6, sysPenalty(P.sys.weapons)) : 8;
  const eng = engId ? target(S, engId, "Engineering", { combat: true }).total : 8;

}

function startBattle(S, enemyId, initiator) {

registerHooks({ startBattle });

const R = (r) => `${r.total} vs ${r.target}`;

  L.push(`${what} hits: their shields ${E.shields - e.shields}/${E.shields}, hull ${Math.max(0, E.hull - e.hull)}/${E.hull}.`);

/** Mark boxes on the Pelion; return whether any reached the hull. */

  else if (r === 6) { sys("sensors", 2); t = "computer offline"; }
  else if (r <= 8) { sys("engines", 1); t = r === 7 ? "deflector damaged" : "warp drive damaged"; }
  else if (r <= 10) { P.hull++; t = `hull breach: ${(check(S, 0).total) * 5} crew lost or hurt`; }
  else if (r <= 12) { P.shields = Math.min(shieldsMax(S), P.shields + 1); t = "shield emitter damaged"; }
  else if (r === 13) { P.powerLoss = Math.min(4, (P.powerLoss || 0) + 1); t = "power conduits damaged: Power −1"; }
  else if (r === 14) { sys("engines", 1); t = "impulse engine damaged"; }

/**

function exchange(S, choice = {}) {

  const torp = !!choice.torps && P.torps > 0 && !st.weaponsOut && power > 0 && !choice.breakOff; if (torp) power--;

      sendHome(S, e, 4); B.over = "hailed"; return finish(S, L);
    }
    L.push(`Hail (${R(r)} against their Will, ${R(them)}): ${e.power === "romulan" ? "silence on every channel" : E.relentless && e.hull < 3 ? "the Klingon captain laughs at you" : "they won't listen"}.`);

  { name: "Your makers", sevek: "\"Your makers were not Ketari. The star charts on your city's walls show where they came from. You are an influence from beyond this world.\" The caretaker's light dims; it does not deny it.",
    machine: "\"My makers are gone. I am the last of them, and I have become part of this world.\" Sevek can't show it otherwise, not yet." },
  { name: "Your remedy", sevek: "\"Eight off-worlders sleep beneath Ketari soil, and they will sleep there for as long as you hold them. Your presence drew the Orions; it set the Ketari digging for them. By your own law, what is not of this world must go: the eight, and every act of yours that is not watching.\"",

function contestOdds(T, them = CARETAKER.target) {

function argue(S, p) {

    const ms = mine.success ? mine.margin : Math.min(mine.margin, -1), mc = its.success ? its.margin : Math.min(its.margin, -1);
    const win = ms > mc; win ? sv++ : ct++;

      const r = attempt(S, unit, a.id, { order: a.order, enemy: a.enemy, arc: a.arc, officer: who, skill, assist });
      if (r.error) { toast(r.error, true); return; }
      lastResult = r.done ? r.result : null;
      if (r.done) reportSince(r.result.name, since, { ...r.result.roll, officer: r.result.officer, skill: r.result.skill, contest: !!r.result.opposed });
      else if (r.battle) reportSince(b.closest(".card")?.querySelector("h4")?.textContent || "Engage", since);
      after(); return;
    }
    if (b.dataset.resolve) { const since = mark(); const r = resolve(S, b.dataset.resolve === "reroll"); lastResult = r.done ? r.result : null; if (r.done) reportSince(r.result.name, since, { ...r.result.roll, officer: r.result.officer, skill: r.result.skill, contest: !!r.result.opposed }); after(); return; }
    if (b.dataset.refit) { const since = mark(); const r = fitRefit(S, b.dataset.refit); if (r.error) toast(r.error, true); else reportSince(REFITS[b.dataset.refit].name, since); after(); return; }
    if (b.dataset.req) { const since = mark(); const r = requisition(S, b.dataset.req); if (r.error) toast(r.error, true); else reportSince("Requisition: " + SUPPORT[b.dataset.req].name, since); after(); return; }
  });
  // Picking someone else for an action shows how their target is made.
  $("panel").addEventListener("change", (e) => { const sel = e.target.closest("[data-who]"); if (!sel) return; refreshCard(sel.closest(".card")); });
  $("panel").addEventListener("change", (e) => { if (e.target.closest("[data-assist]")) refreshCard(e.target.closest(".card")); });
  $("panel").addEventListener("change", (e) => { const w = e.target.closest("[data-warp]"); if (w) { setWarp(S, +w.value); after(); } });
  $("panel").addEventListener("change", (e) => { const s = e.target.closest("[data-station]"); if (s) { setStation(S, s.dataset.station, s.value); after(); } });
  $("panel").addEventListener("click", (e) => { const tr = e.target.closest("tr[data-hex]"); if (tr) { selHex = tr.dataset.hex; centerOn(selHex); tab = "here"; renderAll(); } });
  $("end-turn").onclick = doEndTurn;
  $("menu").onclick = showMenu;
  $("zoom-in").onclick = () => zoomBy(1.25); $("zoom-out").onclick = () => zoomBy(0.8);
  $("fit").onclick = () => { mapMode = "sector"; fitView(); draw(); };
  $("surface").onclick = () => { mapMode = mapMode === "surface" ? "sector" : "surface"; draw(); };
  $("find").onclick = () => { unit = "pelion"; centerOn(S.pelion.at); selHex = S.pelion.at; tab = "here"; renderAll(); };
  document.addEventListener("keydown", (e) => {
    if (!S || !$("modal").hidden || /input|select|textarea/i.test(e.target.tagName)) return;
    if (e.key === "Enter" && !e.repeat) { e.preventDefault(); doEndTurn(); }
  });
  $("modal").addEventListener("click", modalClick);
}
function doEndTurn() {
  if (!S || S.over) return;
  if (!canEndTurn(S)) { toast(S.pending ? "Accept the roll, or reroll it, first." : "Finish what's in front of you first.", true); return; }
  const before = S.log.length;
  const r = endTurn(S); if (r.error) { toast(r.error, true); return; }
  lastResult = null; unit = S.support[unit] ? unit : "pelion"; selHex = U().at;
  const news = S.log.slice(before).filter((l) => l.kind === "order" || l.kind === "war" || l.kind === "bad");
  if (news.length) toast(news[0].text, news[0].kind !== "order");
  after();
}

// ---------- dialogs ----------
function modal(html) { $("modal-body").innerHTML = html; $("modal").hidden = false; }
function closeModal() { $("modal").hidden = true; }
function showStarter(canContinue) {
  modal(`<h1>USS Pelion: Frontier<\/h1>
  <p class="lede">Stardate 5212.4. The Pelion, a Heavy Cruiser under your command, is assigned to the Corvan Sector for fifty weeks: a frontier between the Federation, the Klingon Empire and the Romulan Neutral Zone, full of worlds that haven't chosen a side and things no one has explained.<\/p>
  <div class="grid2">
    <div class="brief"><h3>The ship<\/h3><p>Double-click a hex to fly there. A hex is a light-year and a turn a week; speed is v = W³ × c, so warp 6, the Pelion's maximum stable speed, covers about 4 light-years a week, and warp 8, its emergency maximum, about 10, at a risk to the engines. Urgent orders call for emergency warp. Nebulae count double. Then the crew goes to work where you are: every officer acts once a turn (survey, investigate, negotiate, sweep, repair), each job once. Starbase 23 repairs, rearms and refits you.<\/p><\/div>
    <div class="brief"><h3>The crew<\/h3><p>The six officers from the Players' Guide do the work. Every action is the tabletop roll: 3d6 at or under their skill. Pick who does it, and whether a second officer assists (+1, using their turn); a Duty point rerolls a failure.<\/p><\/div>
    <div class="brief"><h3>The campaign<\/h3><p>The tour is one long story, and it begins with your first orders, The Silence at Corvan II. What you find there sets the course of everything after it: every order that follows will turn up a piece of it.<\/p><\/div>
    <div class="brief"><h3>Orders<\/h3><p>Starfleet sends missions, each with a deadline, a twist, its own story, and a reason tied to the campaign. Each ends with a decision that's yours to make.<\/p><\/div>
    <div class="brief"><h3>The worlds<\/h3><p>Diplomatic missions bring independent worlds toward the Federation: at accord +5 they join. The Klingons court them too, and at −5 they're lost.<\/p><\/div>
    <div class="brief"><h3>Battles<\/h3><p>Ship combat from the Players' Guide: spend Power on shields, phasers and torpedoes, give the captain's order, and break away if it goes wrong.<\/p><\/div>
    <div class="brief"><h3>Starfleet Command<\/h3><p>Five boxes and you're relieved of command: failed orders, the Prime Directive, incidents and lost colonies mark it. Three orders carried out in a row clear a box. Survive the tour and earn your rating.<\/p><\/div>
  <\/div>
  <div class="ng-row"><label>Captain's name<input type="text" id="ng-name" placeholder="Captain" maxlength="30"><\/label>
  <label>Difficulty<select id="ng-diff"><option value="easy">Easy<\/option><option value="normal" selected>Normal<\/option><option value="hard">Hard<\/option><\/select><\/label>
  <label>Sector seed (optional)<input type="text" id="ng-seed" placeholder="random" maxlength="30"><\/label><\/div>
  <div class="btn-row" style="margin-top:16px"><button class="btn primary" data-m="new">Take command<\/button>${canContinue ? `<button class="btn" data-m="continue">Continue your tour<\/button>` : ""}<\/div>
  <p class="small muted">An unofficial fan game for the USS Pelion campaign, inspired by Star Trek. Not affiliated with or endorsed by Paramount or CBS Studios, who own Star Trek.<\/p>`);
}
function showMenu() {
  modal(`<h2>Menu<\/h2><p class="muted">${esc(S.captain)}, turn ${S.turn} of ${TOUR}. This sector's seed: <span class="seed">${esc(S.seed)}<\/span><\/p>
    <div class="btn-row"><button class="btn primary" data-m="close">Back to the bridge<\/button><button class="btn" data-m="help">How to play<\/button><button class="btn" data-m="restart">New tour<\/button><button class="btn" data-m="replay">Replay this sector<\/button><\/div>
    <h3>Save code<\/h3><p class="small muted">The game saves in this browser after every move. To move it to another browser, copy this code, then paste it there under Load.<\/p>
    <textarea id="code" rows="3" readonly>${esc(btoa(unescape(encodeURIComponent(JSON.stringify(S)))))}<\/textarea>
    <div class="btn-row"><button class="btn small" data-m="copy">Copy<\/button><\/div>
    <h3>Load<\/h3><textarea id="load" rows="2" placeholder="Paste a save code"><\/textarea><div class="btn-row"><button class="btn small" data-m="load">Load it<\/button><\/div>`);
}
function showHelp() { showStarter(true); $("modal-body").querySelector("[data-m=new]").textContent = "Start a new tour"; }
function showReport() {
  const r = report, roll = r.roll;
  modal(`<h2>${esc(r.title)}<\/h2>
    ${roll ? `<div class="result ${roll.success ? "ok" : "no"}">${roll.officer ? `<span class="small muted">${esc(officer(roll.officer)?.short || "The captain")}, ${esc(roll.skill)}:<\/span> ` : ""}${diceHTML(roll)} ${roll.total} against ${roll.target}: <b class="${roll.success ? "good" : "bad"}">${roll.success ? `success by ${roll.margin}` : `fails by ${-roll.margin}`}<\/b><\/div>` : ""}
    ${r.lines.map((t) => `<p style="white-space:pre-line">${esc(t)}<\/p>`).join("")}
    <div class="btn-row"><button class="btn primary" data-m="report-ok">Continue<\/button><\/div>`);
}
function showEvent() {
  const ev = S.event;
  if (ev.kind === "arc-arrive") {
    const ch = arcEventChoices(S);
    modal(`<h2>Corvan II<\/h2><p>The active sweep finds what passive sensors couldn't: an Orion raider holding station on the far side of the moon. Caught, it hails: they're "legitimate salvagers", and this is unclaimed space.<\/p>
      ${eventResult ? `<div class="result ${eventResult.opposed ? (eventResult.won ? "ok" : "no") : eventResult.roll ? (eventResult.roll.success ? "ok" : "no") : ""}">${eventResult.opposed ? `${esc(eventResult.line)} ` : eventResult.roll ? `${diceHTML(eventResult.roll)} ${eventResult.roll.total} against ${eventResult.roll.target} (${esc(officer(eventResult.roll.officer)?.short || "Captain")}, ${esc(eventResult.roll.skill)}). ` : ""}${esc(eventResult.text)}<\/div>` : ""}
      <div class="grid2">${ch.map((c) => `<div class="brief"><h3>${esc(c.name)}<\/h3><p>${esc(c.blurb)}<\/p><div class="btn-row"><button class="btn ${c.id === "engage" ? "red" : "primary"} small" data-ev="${c.id}" ${c.disabled ? "disabled" : ""}>${esc(c.name)}<\/button><\/div><\/div>`).join("")}<\/div>`);
    return;
  }
  if (ev.kind === "success") { modal(successHTML(ev)); return; }
  if (ev.kind === "complication") {
    const c = complicationChoices(S, ev);
    if (!c) { S.event = null; after(); return; }
    modal(`<h2>${esc(c.order.title)}<\/h2><h3 style="margin-top:0" class="bad">${esc(c.title)}<\/h3><p style="white-space:pre-line">${esc(c.text)}<\/p>
      <div class="grid2">${c.options.map((x) => `<div class="brief"><h3>${esc(x.name)}<\/h3><p>${esc(x.blurb)}<\/p><div class="btn-row"><button class="btn ${x.id === "press" ? "red" : "primary"} small" data-complication="${x.id}">${esc(x.name)}<\/button><\/div><\/div>`).join("")}<\/div>`);
    return;
  }
  if (ev.kind === "cloak-contact") {
    const c = cloakChoices(S, ev);
    if (!c) { S.event = null; after(); return; }
    modal(`<h2>${esc(c.title)}<\/h2><p style="white-space:pre-line">${esc(c.text)}<\/p>
      <div class="grid2">${c.options.map((x) => `<div class="brief"><h3>${esc(x.name)}<\/h3><p>${esc(x.blurb)}<\/p><div class="btn-row"><button class="btn ${x.id === "pursue" ? "red" : "primary"} small" data-cloak="${x.id}">${esc(x.name)}<\/button><\/div><\/div>`).join("")}<\/div>`);
    return;
  }
  if (ev.kind === "mission-choice") {
    const c = missionChoices(S, ev);
    if (!c) { S.event = null; after(); return; }
    modal(`<h2>${esc(c.order.title)}<\/h2><h3 style="margin-top:0">${esc(c.title)}<\/h3><p style="white-space:pre-line">${esc(c.text)}<\/p>
      <div class="grid2">${c.options.map((x) => `<div class="brief"><h3>${esc(x.name)}<\/h3><p>${esc(x.blurb)}<\/p><div class="btn-row"><button class="btn primary small" data-mchoice="${x.id}" data-order="${c.order.id}">${esc(x.name)}<\/button><\/div><\/div>`).join("")}<\/div>`);
    return;
  }
  modal(`<h2>${esc(ev.title || "")}<\/h2><p style="white-space:pre-line">${esc(ev.text || "")}<\/p><div class="btn-row"><button class="btn primary" data-m="event-ok">Continue<\/button><\/div>`);
}
/** The Mission Success report. */
function successHTML(ev) {
  const part = ev.result === "partly";
  const tasks = ev.arc ? arcSteps().replace(/<p class="small muted"[^]*$/, "") : `<ol class="steps-list">${ev.tasks.map((t) => `<li class="done"><span>✓<\/span>${esc(t)}<\/li>`).join("")}<\/ol>`;
  return `<h2>${part ? "Mission partly successful" : "Mission success"}<\/h2><h3 style="margin-top:0">${esc(ev.title)}<\/h3>
    <p class="small muted">Turn ${ev.turn} · ${ev.weeks} week${ev.weeks === 1 ? "" : "s"} from orders to done<\/p>
    <h3>What was done<\/h3>${tasks}${ev.choice ? `<p><b>The decision:<\/b> ${esc(ev.choice)}<\/p>` : ""}<p>${esc(ev.how)}<\/p>${ev.thread ? `<p><b>${esc(CAMPAIGN.title)}, thread ${Math.min(campaignOf(S).threads.length, 99)}:<\/b> ${esc(ev.thread)}<\/p>` : ""}
    <h3>Starfleet Command<\/h3><ul class="small">${ev.rewards.map((r) => `<li>${esc(r)}<\/li>`).join("")}<\/ul>
    ${ev.next ? `<p class="small"><b>Up next, from the backlog:<\/b> ${esc(ev.next.join("; "))} (the Orders tab).<\/p>` : ""}
    <div class="btn-row"><button class="btn primary" data-m="event-ok">Continue<\/button><\/div>`;
}
function showBattle() {
  const B = S.battle, e = S.enemies[B.enemy], E = e ? ENEMIES[e.type] : null, P = S.pelion, st = battleStats(S), sm = shieldsMax(S);
  if (!bchoice) bchoice = { order: "command", shields: true, phasers: true, torps: P.torps > 0, repair: false, breakOff: false };
  const used = (bchoice.shields ? 1 : 0) + (bchoice.phasers && !bchoice.breakOff ? 1 : 0) + (bchoice.torps && !bchoice.breakOff ? 1 : 0), spare = Math.max(0, st.power - used);
  const chip = (k, label, dis) => `<label class="chip ${dis ? "off" : ""}"><input type="checkbox" data-b="${k}" ${bchoice[k] ? "checked" : ""} ${dis ? "disabled" : ""}>${label}<\/label>`;
  const ord = (k, label) => `<label class="chip"><input type="radio" name="ord" data-o="${k}" ${bchoice.order === k ? "checked" : ""}>${label}<\/label>`;
  const who = (id) => (id ? esc(officer(id).short) : "nobody");
  const over = B.over;
  modal(`<h2>Battle${E ? `: ${esc(E.base ? "the Orion base" : E.name)}` : ""}<\/h2>
  <div class="battle">
    <div class="ship-card"><h4 class="gold">${shipSVG("cruiser", "#f2c14e")} USS Pelion<\/h4>
      <div class="track"><span>Shields<\/span>${boxes(sm - P.shields, sm, "blue")}<\/div><div class="track"><span>Hull<\/span>${boxes(PELION.hull - P.hull, PELION.hull, "gold")}<\/div>
      <div class="track"><span>Systems<\/span>Weapons ${P.sys.weapons} · Engines ${P.sys.engines} · Sensors ${P.sys.sensors}<\/div>
      <div class="small muted">Helm ${who(st.helmId)} ${st.helm} · Tactical ${who(st.gunId)} ${st.gun} · Engineering ${who(st.engId)} ${st.eng} · Power ${st.power} · Torpedoes ${P.torps}<\/div><\/div>
    ${E ? `<div class="ship-card"><h4 style="color:${POWERS[e.power].color}">${shipSVG(E.base ? "orionBase" : e.type, POWERS[e.power].color)} ${esc(E.base ? "Orion pirate base" : E.name)}<\/h4>
      <div class="track"><span>Shields<\/span>${boxes(E.shields - e.shields, E.shields, "blue")}<\/div><div class="track"><span>Hull<\/span>${boxes(Math.max(0, E.hull - e.hull), E.hull, "gold")}<\/div>
      <div class="small muted">Helm ${E.helm} · Gunner ${E.gunner} · Maneuver ${E.maneuver} vs your ${st.maneuver}${E.plasma ? " · Plasma torpedo: +2 to evade it" : ""}${E.relentless ? " · Relentless" : ""}${E.fast ? " · Fast: runs when its shields fall" : ""}<\/div><\/div>` : `<div class="ship-card"><h4>Gone<\/h4><\/div>`}
  <\/div>
  ${over ? `<div class="result ${over === "destroyed" || over === "hailed" || over === "escaped" || over === "fled" ? "ok" : "no"}"><b>${{ destroyed: "Destroyed.", fled: "They broke off.", hailed: "They stood down.", escaped: "The Pelion broke away.", lost: "The Pelion is lost." }[over]}<\/b><\/div><div class="btn-row"><button class="btn primary" data-m="battle-done">Continue<\/button><\/div>`
  : `<h3>The captain's order<\/h3><div class="orders-choice">${ord("command", `Command (Leadership ${CAPTAIN.skills.Leadership}, ${pct(CAPTAIN.skills.Leadership)}): +2 to Tactical`)}${ord("read", `Read the enemy (Psychology ${CAPTAIN.skills.Psychology}): +2 evade, +1 to hit`)}${E && !E.base && e.power !== "romulan" ? ord("hail", `Hail (Diplomacy ${CAPTAIN.skills.Diplomacy} vs Will ${E.will}): they may stand down`) : ""}${ord("none", "No order")}<\/div>
  <h3>Power: ${st.power} · ${used} spent · ${spare ? `+${Math.min(2, spare)} to ${bchoice.phasers && !bchoice.breakOff ? "phasers" : "evade"}` : "nothing spare"}<\/h3>
  <div class="orders-choice">${chip("shields", "Shields up")}${chip("phasers", `Phasers (${st.gun}, ${pct(st.gun)})`, st.weaponsOut || bchoice.breakOff)}${chip("torps", `Torpedoes (${st.gun + 1}; can't be evaded)`, !P.torps || st.weaponsOut || bchoice.breakOff)}${chip("repair", `Damage control (${st.eng})`)}${chip("breakOff", `Break away (Helm ${st.helm}): instead of firing`)}<\/div>
  <div class="btn-row"><button class="btn primary" data-m="exchange">Next exchange<\/button><\/div>`}
  <div class="blog">${B.log.slice().reverse().map((l) => `<div>${esc(l)}<\/div>`).join("") || `<span class="muted">${B.ambush ? "They decloak, firing." : "Both ships close. Your orders, Captain?"}<\/span>`}<\/div>`);
}
function showEnd() {
  const sc = score(S);
  modal(`<h1>${S.over.win ? "The tour is over" : "Relieved"}<\/h1><p class="lede">${esc(S.over.why)}<\/p>
  <h3>${esc(rating(sc.total))}<\/h3><table class="tbl">${sc.parts.map(([n, v]) => `<tr><td>${esc(n)}<\/td><td style="text-align:right">${v}<\/td><\/tr>`).join("")}<tr><td><b>Total<\/b><\/td><td style="text-align:right"><b>${sc.total}<\/b><\/td><\/tr><\/table>
  <p class="small muted" style="margin-top:10px">This sector's seed: <span class="seed">${esc(S.seed)}<\/span><\/p>
  <div class="btn-row"><button class="btn primary" data-m="restart">New tour<\/button><button class="btn" data-m="replay">Replay this sector<\/button><button class="btn" data-m="close">Look at the map<\/button><\/div>`);
}
function modalClick(e) {
  const b = e.target.closest("button"); if (!b) return;
  const m = b.dataset.m;
  if (b.dataset.ev) {
    const since = mark(), title = b.textContent.trim();
    eventResult = chooseEvent(S, b.dataset.ev);
    // While the arrival is still open (a scan), its own dialog shows the result; once it ends, a pop-up says what happened.
    if (!S.event || S.event.kind !== "arc-arrive") {
      const out = eventResult || {}; eventResult = null; report = null;
      reportSince(title, since, out.opposed ? null : out.roll);
      if (out.text) { report = report || { title, roll: out.roll, lines: [] }; report.lines.unshift(out.text); }
    }
    after(); if (!report && !S.event && !S.battle && !S.over) closeModal(); return;
  }
  if (m === "report-ok") { report = null; closeModal(); after(); return; }
  if (m === "new") { const s = newGame({ seed: $("ng-seed").value.trim() || undefined, difficulty: $("ng-diff").value, captain: $("ng-name").value }); startGame(s); return; }
  if (m === "continue") { try { startGame(JSON.parse(store.get())); } catch { toast("That save couldn't be read.", true); } return; }
  if (m === "close") { closeModal(); return; }
  if (m === "help") { showHelp(); return; }
  if (m === "restart") { showStarter(false); return; }
  if (m === "replay") { startGame(newGame({ seed: S.seed, difficulty: S.difficulty, captain: S.captain })); return; }
  if (m === "copy") { const t = $("code"); t.select(); try { navigator.clipboard.writeText(t.value); toast("Copied."); } catch { document.execCommand("copy"); } return; }
  if (m === "load") { try { startGame(JSON.parse(decodeURIComponent(escape(atob($("load").value.trim()))))); } catch { toast("That code didn't load.", true); } return; }
  if (m === "event-ok") { dismissEvent(S); closeModal(); after(); return; }
  if (b.dataset.complication) { const since = mark(), title = b.textContent.trim(); chooseComplication(S, b.dataset.complication); closeModal(); report = null; reportSince(title, since); after(); return; }
  if (b.dataset.cloak) { const since = mark(), title = b.textContent.trim(); const out = chooseCloak(S, b.dataset.cloak); closeModal(); report = null; reportSince(title, since); if (out && out.text) { report = report || { title, lines: [] }; } after(); return; }
  if (b.dataset.mchoice) { const r = chooseMission(S, b.dataset.order, b.dataset.mchoice); if (r.error) toast(r.error, true); closeModal(); after(); return; }
  if (m === "exchange") { exchange(S, { ...bchoice, order: bchoice.order === "none" ? null : bchoice.order }); save(); renderAll(); showBattle(); return; }
  if (m === "battle-done") { closeBattle(S); bchoice = null; closeModal(); after(); return; }
}
document.addEventListener("change", (e) => {
  if (!S || !S.battle || !bchoice) return;
  const t = e.target;
  if (t.dataset.b) { bchoice[t.dataset.b] = t.checked; showBattle(); }
  if (t.dataset.o) { bchoice.order = t.dataset.o; showBattle(); }
});
let toastTimer = null;
function toast(msg, bad) { const t = $("toast"); t.textContent = msg; t.className = "toast show" + (bad ? " bad" : ""); clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.className = "toast"), 4200); }

boot();

})();
</script>
