<style>
/* A bridge console: the sector map fills the screen, a status bar runs across the top, and the side panel holds what's
   here, the ship, the crew, the orders, the sector and the log. One dark look, in the divisions' gold, blue and red. */
:root { color-scheme: dark;
  --bg: #07080d; --panel: #10121c; --panel-2: #181b29; --line: rgba(160, 170, 210, .2); --ink: #e6e8f2; --muted: #9aa0b8;

  --display: "Antonio", "Arial Narrow", system-ui, sans-serif; --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--body); margin: 0; overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
button { font: inherit; color: inherit; }
#app { position: fixed; inset: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px) 0; display: grid; grid-template-rows: auto 1fr; grid-template-columns: 1fr 400px; }
#app[hidden] { display: none; }
.bar { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 8px max(14px, env(safe-area-inset-right, 0px)) 8px max(14px, env(safe-area-inset-left, 0px)); background: var(--panel); border-bottom: 3px solid var(--gold); }
#bar-ship { font: 700 18px var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--gold); }
#bar-stats { display: flex; flex-wrap: wrap; gap: 4px 16px; flex: 1 1 auto; min-width: 0; font-variant-numeric: tabular-nums; align-items: center; }
#bar-stats b { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; margin-right: 5px; }
#bar-turn { font: 600 14px var(--display); color: var(--muted); letter-spacing: .04em; }
.boxes { display: inline-flex; gap: 3px; vertical-align: -2px; } .boxes i { width: 11px; height: 11px; border: 1.5px solid var(--muted); border-radius: 2px; display: inline-block; }
.boxes i.on { background: var(--red); border-color: var(--red); } .boxes.blue i.on { background: var(--blue); border-color: var(--blue); } .boxes.gold i.on { background: var(--gold); border-color: var(--gold); }
.map-wrap { position: relative; min-width: 0; min-height: 0; }

.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 6px 9px; cursor: pointer; color: var(--muted); font: 600 15px var(--display); letter-spacing: .06em; text-transform: uppercase; }

h1 { font-size: 30px; margin-bottom: 8px; text-transform: uppercase; } h2 { font-size: 21px; margin-bottom: 4px; text-transform: uppercase; }

.btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 18px; padding: 8px 14px; cursor: pointer; font-weight: 600; }
.btn:hover:not(:disabled) { border-color: var(--gold); }
.btn.primary { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); }
.btn.red { background: var(--red); border-color: var(--red); color: #fff; }
.btn.small { padding: 5px 11px; font-size: 12px; } .btn.wide { width: 100%; margin-top: 6px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
#end-turn { flex: 1; font: 700 17px var(--display); letter-spacing: .1em; text-transform: uppercase; padding: 10px; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.card { background: var(--panel-2); border-radius: 10px; padding: 10px 12px; margin: 8px 0; border-left: 4px solid var(--blue); }
.card.gold { border-left-color: var(--gold); color: var(--ink); } .card.red { border-left-color: var(--red); } .card.green { border-left-color: var(--green); } .card.violet { border-left-color: var(--violet); }

.kv span:nth-child(odd) { color: var(--muted); }
.roll-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; }
select, input[type=text], textarea { background: #0b0d16; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; font: inherit; max-width: 100%; }
textarea { width: 100%; box-sizing: border-box; font: 12px ui-monospace, monospace; }
.dice { display: inline-flex; gap: 4px; } .die { width: 26px; height: 26px; border-radius: 6px; background: #f3efe2; color: #111; display: inline-grid; place-items: center; font-weight: 700; }

.log .t { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 8px; } .log .war { color: #ffb0a6; } .log .bad { color: #ffb0a6; } .log .good { color: #b9e5bb; } .log .victory { color: var(--gold); } .log .order { color: #a8d4ff; } .log .turn, .log .move { color: var(--muted); } h3.log-turn { margin: 14px 0 6px; border-bottom: 1px solid var(--line); padding-bottom: 3px; } .log .discovery { color: #e2d1ff; border-left: 3px solid var(--violet); padding-left: 8px; }
#modal { position: fixed; inset: 0; background: rgba(3, 4, 8, .84); display: grid; place-items: center; z-index: 20; padding: 16px; overflow-y: auto; }
#modal[hidden] { display: none; }

.lede { color: var(--muted); font-size: 15px; max-width: 62ch; }
.ng-row { display: flex; flex-wrap: wrap; gap: 12px; margin: 14px 0 4px; }
.ng-row label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.seed { font: 700 22px var(--display); letter-spacing: .08em; color: var(--gold); user-select: all; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; margin: 14px 0; }
.brief { background: var(--panel-2); border-radius: 10px; padding: 12px; border-top: 3px solid var(--blue); } .brief h3 { margin-top: 0; } .brief p { font-size: 13px; color: #cfd3e3; margin: 0; }

.ship-card { background: var(--panel-2); border-radius: 10px; padding: 10px 12px; }
.ship-card h4 { margin: 0 0 6px; font: 700 16px var(--display); text-transform: uppercase; letter-spacing: .04em; }
.track { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin: 3px 0; } .track span:first-child { width: 72px; }
.orders-choice { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 16px; padding: 6px 11px; cursor: pointer; font-size: 13px; }
.chip:has(input:checked) { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; } .chip input { accent-color: var(--gold); margin: 0; }
.chip.off { opacity: .45; }
.blog { max-height: 220px; overflow-y: auto; font-size: 13px; background: #0b0d16; border-radius: 8px; padding: 8px 10px; margin-top: 10px; display: grid; gap: 3px; }
.toast { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); max-width: min(560px, calc(100vw - 32px)); background: #1c2033; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; opacity: 0; pointer-events: none; transition: .25s; z-index: 30; }
.toast.show { opacity: 1; transform: translate(-50%, 0); } .toast.bad { border-color: var(--red); }
@media (max-width: 820px) {

}

<script>
(() => {
"use strict";
// ---- hex.js ----
// Hex grid helpers (axial coordinates, pointy-top) and a seeded random generator.
// Every hex is "q,r"; the map is a hexagon of a given radius around 0,0.

/** A seeded generator (mulberry32): the same seed always builds the same galaxy and rolls the same dice. */
function makeRng(seed) {
  let a = (typeof seed === "number" ? seed : hashString(String(seed))) >>> 0;
  const next = () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  return {
    next,
    int: (n) => Math.floor(next() * n),
    pick: (list) => list[Math.floor(next() * list.length)],
    d6: () => 1 + Math.floor(next() * 6),
    state: () => a,
    setState: (s) => { a = s >>> 0; },
  };
}
function hashString(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

const key = (q, r) => q + "," + r;
const parse = (k) => { const [q, r] = k.split(",").map(Number); return { q, r }; };
const DIRS = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];
const neighbors = (k) => { const { q, r } = parse(k); return DIRS.map(([dq, dr]) => key(q + dq, r + dr)); };
const distance = (a, b) => {
  const A = parse(a), B = parse(b);
  return (Math.abs(A.q - B.q) + Math.abs(A.q + A.r - B.q - B.r) + Math.abs(A.r - B.r)) / 2;
};
/** All hexes of a hexagonal map of this radius. */
function hexagon(radius) {
  const out = [];
  for (let q = -radius; q <= radius; q++)
    for (let r = Math.max(-radius, -q - radius); r <= Math.min(radius, -q + radius); r++) out.push(key(q, r));
  return out;
}
const inMap = (k, radius) => distance(k, "0,0") <= radius;
/** Pixel center of a hex of this size (pointy-top). */
function toPixel(k, size) {
  const { q, r } = parse(k);
  return { x: size * Math.sqrt(3) * (q + r / 2), y: size * 1.5 * r };
}
/** The hex under a pixel. */
function fromPixel(x, y, size) {
  const q = ((Math.sqrt(3) / 3) * x - y / 3) / size, r = ((2 / 3) * y) / size;
  let rx = Math.round(q), rz = Math.round(r), ry = Math.round(-q - r);
  const dx = Math.abs(rx - q), dz = Math.abs(rz - r), dy = Math.abs(ry - (-q - r));
  if (dx > dy && dx > dz) rx = -ry - rz; else if (dz > dy) rz = -rx - ry;
  return key(rx, rz);
}
/** Hexes within n steps of k. */
function within(k, n) {
  const { q, r } = parse(k), out = [];
  for (let dq = -n; dq <= n; dq++)
    for (let dr = Math.max(-n, -dq - n); dr <= Math.min(n, -dq + n); dr++) out.push(key(q + dq, r + dr));
  return out;
}

// ---- data.js ----
// The numbers: the crew (from the Players' Guide's ready-made crew), the ships (from its ship registry and the GM's
// Guide's enemy ships), what the Pelion can do at a system, the mission tables (the GM's Guide's mission seeds),
// refits and library records.

const TOUR = 50;                      // turns in the tour; a turn is a week
const STARDATE0 = 5212.4;             // campaign year 2268

/** The six ready-made crew. Skills are the targets from their sheets. */
const CREW = [
  { id: "shvari", name: "Thelan sh'Vari", short: "sh'Vari", rank: "Lt. Commander", post: "First officer", species: "Andorian",
    skills: { Leadership: 16, Diplomacy: 14, Helm: 13, Phasers: 13, Navigation: 11, Psychology: 11, Sensors: 11, Communications: 11 },
    adv: "Crisis Leader", advText: "+2 to Leadership and Helm in ship combat.", advWhen: (ctx) => ctx.combat && ["Leadership", "Helm"].includes(ctx.skill) },
  { id: "sevek", name: "Sevek", short: "Sevek", rank: "Lieutenant", post: "Science officer", species: "Vulcan",
    skills: { "Physical Sciences": 16, Sensors: 14, Computers: 14, "Life Sciences": 14, Navigation: 14, Engineering: 14, Electronics: 14, Psychology: 14 },
    adv: "Eidetic Recall", advText: "+2 when investigating an anomaly or ruins.", advWhen: (ctx) => ctx.action === "investigate" },
  { id: "vessik", name: "Dr. Vessik", short: "Vessik", rank: "Lt. Commander", post: "Chief medical officer", species: "Denobulan",
    skills: { Medicine: 16, "Life Sciences": 14, Psychology: 14, Sensors: 14, Computers: 14, Electronics: 14, Survival: 14, Communications: 14, Diplomacy: 13, Leadership: 13 },
    adv: "Denobulan Pharmacopoeia", advText: "+2 to Medicine.", advWhen: (ctx) => ctx.skill === "Medicine" },
  { id: "grath", name: "Grath", short: "Grath", rank: "Lieutenant", post: "Chief engineer", species: "Tellarite",
    skills: { Engineering: 16, Electronics: 14, Computers: 14, "Physical Sciences": 14, Sensors: 14, Communications: 14, Survival: 14, Helm: 11 },
    adv: "Improvisational Engineer", advText: "+2 to Engineering for repairs.", advWhen: (ctx) => ctx.skill === "Engineering" && (ctx.action === "repair" || ctx.combat) },
  { id: "reyes", name: "Marisol Reyes", short: "Reyes", rank: "Lieutenant (j.g.)", post: "Security chief", species: "Human",
    skills: { Phasers: 16, "Unarmed Combat": 14, Stealth: 14, Helm: 14, Athletics: 13, Survival: 11, Sensors: 11, Medicine: 11, Leadership: 11, Communications: 11 },
    adv: "Careful Marksman", advText: "+2 to Phasers on an away team (stun).", advWhen: (ctx) => ctx.skill === "Phasers" && !ctx.combat },
  { id: "rrinn", name: "Rrinn", short: "Rrinn", rank: "Yeoman 2nd Class", post: "Captain's yeoman", species: "Caitian",
    skills: { Computers: 18, Communications: 14, Psychology: 14, Sensors: 14, Electronics: 14, Stealth: 13, Diplomacy: 12 },
    adv: "Keen Hearing", advText: "+2 when listening: hailing, and sweeps for cloaked ships and raiders.", advWhen: (ctx) => ctx.action === "sweep" || (ctx.skill === "Communications" && ctx.listen) },
];
/** You, the captain. */
const CAPTAIN = { id: "captain", short: "Captain", skills: { Leadership: 14, Psychology: 13, Diplomacy: 13, Will: 12 } };

// Ships. Systems take 3 boxes each: 1 Damaged (−2), 2 Crippled (−4), 3 Offline.
const PELION = { name: "USS Pelion", reg: "NCC-1750", cls: "Heavy Cruiser", shields: 5, hull: 5, power: 5, maneuver: 3, sensors: 3, phaser: 2, torps: 40, torpBonus: 1, speed: 3 };
const SUPPORT = {
  escort: { name: "Escort", cls: "Escort", cost: 30, shields: 2, hull: 3, maneuver: 5, helm: 12, gunner: 12, phaser: 1, speed: 3, blurb: "Guards a world: fights raiders that come to it, and joins the Pelion's battles." },
  science: { name: "Science vessel", cls: "Science vessel", cost: 25, shields: 2, hull: 3, maneuver: 5, helm: 11, gunner: 10, phaser: 1, speed: 3, skill: 12, blurb: "Surveys and investigates on its own (skill 12, sensors +2)." },
};
const SUPPORT_NAMES = ["USS Kestrel", "USS Calder", "USS Ishikawa", "USS Tamsin", "USS Meridian Rose", "USS Okonkwo", "USS Halvard", "USS Sabre"];
const ENEMIES = {
  kbc: { name: "Klingon battle cruiser", power: "klingon", shields: 5, hull: 5, maneuver: 3, helm: 12, gunner: 12, dmg: 2, torp: true, will: 12, cloak: true, relentless: true, speed: 3 },
  kbop: { name: "Klingon bird-of-prey", power: "klingon", shields: 2, hull: 3, maneuver: 5, helm: 13, gunner: 12, dmg: 1, will: 11, cloak: true, ambush: true, speed: 3 },
  rbop: { name: "Romulan bird-of-prey", power: "romulan", shields: 3, hull: 3, maneuver: 5, helm: 11, gunner: 12, dmg: 2, plasma: true, will: 13, cloak: true, ambush: true, speed: 3 },
  orion: { name: "Orion raider", power: "orion", shields: 2, hull: 3, maneuver: 6, helm: 13, gunner: 11, dmg: 1, will: 10, fast: true, speed: 4 },
  orionBase: { name: "Orion pirate base", power: "orion", shields: 4, hull: 4, maneuver: 0, helm: 0, gunner: 11, dmg: 2, will: 11, base: true, speed: 0 },
};
const POWERS = {
  federation: { name: "Federation", color: "#6fb4ff" },
  klingon: { name: "Klingon Empire", color: "#e0564a" },
  romulan: { name: "Romulan Star Empire", color: "#59c48a" },
  orion: { name: "Orion Syndicate", color: "#e6a640" },
  independent: { name: "Independent", color: "#c9c3e8" },
};

/** What a system can be. `known`: on Starfleet's charts from the start. */
const KINDS = {
  starbase: { name: "Starbase", known: true, color: "#9fd0ff" },
  colony: { name: "Federation colony", known: true, color: "#6fb4ff" },
  independent: { name: "Independent world", known: true, color: "#c9c3e8" },

// ---- sector.js ----
// The Corvan Sector: a hex map with the Federation's starbase and colonies to the southwest, two Klingon outposts on
// the eastern border, the Romulan Neutral Zone along the top, and between them independent worlds, pre-warp peoples,
// anomalies, ruins and empty systems (one of which hides an Orion pirate base).


const RADIUS = 8;
const px = (k) => toPixel(k, 1);
const inZone = (k) => parse(k).r <= -RADIUS + 1;                 // the top two rows
const nearZone = (k) => parse(k).r === -RADIUS + 2;

function makeSector(seed) {
  const R = makeRng(seed);
  const hexes = {};
  for (const k of hexagon(RADIUS)) hexes[k] = { terrain: inZone(k) ? "zone" : "space" };
  // Nebulae: three clouds, away from the zone.
  const open = Object.keys(hexes).filter((k) => !inZone(k));
  for (let n = 0; n < 3; n++) {
    let c = R.pick(open);
    for (let i = 0; i < 5; i++) {
      if (hexes[c] && !inZone(c)) hexes[c].terrain = "nebula";
      const { q, r } = parse(c), d = [[1, 0], [0, 1], [-1, 1], [-1, 0], [0, -1], [1, -1]][R.int(6)];
      c = key(q + d[0], r + d[1]);
    }
  }
  const systems = {}, sysAt = {};
  const used = [];
  const free = (k, gap = 2) => hexes[k] && !inZone(k) && !sysAt[k] && used.every((u) => distance(u, k) >= gap);
  let names = [...NAMES];
  const take = () => { const i = R.int(names.length); const n = names[i]; names.splice(i, 1); return n; };
  const place = (k, kind, extra = {}) => {
    const id = "s" + (Object.keys(systems).length + 1);
    systems[id] = { id, at: k, kind, name: extra.name || take(), surveyed: false, harm: 0, ...extra };
    sysAt[k] = id; used.push(k);
    return systems[id];
  };
  const pickWhere = (test, gap = 2) => {
    const c = open.filter((k) => free(k, gap) && test(k));
    return c.length ? R.pick(c) : open.find((k) => free(k, 1));
  };
  const P = (k) => px(k);
  // The starbase, southwest; colonies around it.
  const sb = pickWhere((k) => P(k).x < -6 && P(k).y > 4.5 && distance(k, "0,0") >= 6 && distance(k, "0,0") <= 7);
  place(sb, "starbase", { name: "Starbase 23", surveyed: true });
  for (let i = 0; i < 3; i++) place(pickWhere((k) => distance(k, sb) >= 2 && distance(k, sb) <= 5 && P(k).x < 0), "colony", { surveyed: true });
  // Klingon outposts on the eastern edge.
  for (let i = 0; i < 2; i++) place(pickWhere((k) => P(k).x > 8 && Math.abs(P(k).y) < 9, 4), "klingon", { surveyed: true });
  // Corvan II: the first mission, a few days out from the starbase.
  const cv = pickWhere((k) => distance(k, sb) >= 5 && distance(k, sb) <= 7 && P(k).x < 4 && P(k).y > -6);
  names = names.filter((n) => n !== "Corvan");
  place(cv, "prewarp", { name: "Corvan II", ruinsToo: true });
  // Independent worlds in the middle band, where the Federation and the Empire compete for them.
  for (let i = 0; i < 6; i++) place(pickWhere((k) => P(k).x > -6 && P(k).x < 10 && distance(k, sb) >= 5, 3), "independent", { surveyed: true, accord: i < 2 ? 1 : 0 });
  for (let i = 0; i < 3; i++) place(pickWhere(() => true), "prewarp");
  for (let i = 0; i < 5; i++) place(pickWhere(() => true), "anomaly", { clock: 0, need: 3 + R.int(3) });
  for (let i = 0; i < 3; i++) place(pickWhere(() => true), "ruins", { clock: 0, need: 4 + R.int(2) });
  // The Orion base: far from the starbase, in a nebula if one is free.
  const neb = open.filter((k) => hexes[k].terrain === "nebula" && free(k) && distance(k, sb) >= 7);
  place(neb.length ? R.pick(neb) : pickWhere((k) => distance(k, sb) >= 8), "orionBase", { baseHull: 0, baseShields: 0 });
  for (let i = 0; i < 9; i++) place(pickWhere(() => true), "empty");
  // Starfleet's charts: the core's worlds are known; the rest is "uncharted" until surveyed.
  return { hexes, systems, sysAt, starbase: systems[sysAt[sb]].id, corvan: systems[sysAt[cv]].id };
}

    pelion: { at: sb.at, mp: PELION.speed, acted: false, shields: 0, hull: 0, sys: { weapons: 0, engines: 0, sensors: 0 }, torps: PELION.torps, refits: {}, zoneMarked: false, docked: true },

    visible: {}, seenSys: {}, log: [], over: null, pending: null, battle: null, event: null, tutorial: { on: true },

  s.harm = Math.min(3, s.harm + n);
  log(S, `${s.name} (${s.kind === "colony" ? "Federation colony" : s.kind === "member" ? "Federation member" : "independent world"}) is harmed: ${why}. Harm ${s.harm}/3${s.harm >= 3 ? "" : s.kind === "colony" ? " (at 3 it must be evacuated)" : s.kind === "member" ? " (at 3 it leaves the Federation)" : " (at 3 it loses faith in the Federation)"}.`, "bad");
  if (s.harm < 3) return;
  if (s.kind === "colony") { s.kind = "lost"; S.lostColonies++; markCommand(S, 2, `the colony on ${s.name} had to be evacuated.`); }
  else if (s.kind === "member") { s.kind = "independent"; s.accord = 1; s.harm = 1; S.joined--; markCommand(S, 1, `${s.name} leaves the Federation, which couldn't protect it.`); }
  else { s.accord = Math.max(-5, s.accord - 1); s.harm = 2; }
  if (!Object.values(S.systems).some((x) => x.kind === "colony") && !S.over) S.over = { win: false, why: "Every Federation colony in the sector has been lost. Starfleet withdraws from the Corvan Sector." };
}
function sendHome(S, e, turns = 3) {
  e.goal = "home"; e.target = e.home; e.stay = turns; e.hostile = e.power !== "klingon" ? e.hostile : false;
}

// ---------- support ships ----------
function requisition(S, type) {
  const T = SUPPORT[type];
  if (!S.pelion.docked) return { error: "Requisitions are made at Starbase 23." };
  if (Object.keys(S.support).length >= 3) return { error: "Starfleet can spare three ships at most." };
  if (S.supplies < T.cost) return { error: `Needs ${T.cost} supplies.` };
  S.supplies -= T.cost;
  const used = Object.values(S.support).map((u) => u.name);
  const name = SUPPORT_NAMES.find((n) => !used.includes(n)) || "USS " + S.nextId;
  const id = "u" + S.nextId++;
  S.support[id] = { id, type, name, at: S.systems[S.starbase].at, mp: 0, acted: true, shields: 0, hull: 0 };
  log(S, `The ${name} (${T.name}) joins the Pelion's command. It's ready next turn.`, "good");
  updateVisibility(S);
  return { ok: true, id };
}
function fitRefit(S, id) {
  const R = REFITS[id];
  if (!S.pelion.docked) return { error: "Refits are fitted at Starbase 23." };
  if (S.pelion.refits[id]) return { error: "Already fitted." };
  if (S.science < R.cost) return { error: `Needs ${R.cost} science.` };
  S.science -= R.cost; S.pelion.refits[id] = true;
  log(S, `Refit at Starbase 23: ${R.name}.`, "good");
  updateVisibility(S);
  return { ok: true };
}
function setStation(S, station, id) { if (!available(S, id)) return { error: "In sickbay." }; S.stations[station] = id; return { ok: true }; }

// ---------- scoring and the end ----------
function score(S) {
  const sys = Object.values(S.systems);
  const parts = [
    ["Worlds joined the Federation", S.joined * 10],
    ["Library records", S.records.length * 6],
    ["Orders carried out", S.done * 4],
    ["Commendations", S.commendations],
    ["Colonies safe", sys.filter((s) => s.kind === "colony").length * 5],
    ["Systems surveyed", sys.filter((s) => s.surveyed && !KINDS[s.kind]?.known && s.id !== S.corvan).length],
    ["Starfleet Command track", -S.command * 4],
    ["Worlds lost to the Klingon Empire", -S.lostWorlds * 8],
    ["Colonies lost", -S.lostColonies * 10],
  ];
  return { parts, total: parts.reduce((t, p) => t + p[1], 0) };
}
function rating(total) {
  return total >= 110 ? "Legendary: the Corvan Sector will tell stories about the Pelion" : total >= 75 ? "Commended: a fine tour, and a ship Starfleet is proud of"
    : total >= 40 ? "Satisfactory: the sector is no worse than you found it" : "Recalled: Starfleet Command has questions";
}
function checkEnd(S) {
  if (S.over) return;
  if (S.pelion.hull >= PELION.hull) S.over = { win: false, why: "The Pelion's hull gave way. The crew abandoned ship, and Starfleet lost a Heavy Cruiser." };
  else if (S.turn > TOUR) S.over = { win: true, why: "The Pelion's tour of the Corvan Sector is over." };
}

// ---------- hooks set by the other modules (they import game.js, so they register here) ----------
let startBattleHook = () => {}, arcActionsHook = () => [], arcStepHook = () => "", arcSweepHook = () => {};
function registerHooks(h) { if (h.startBattle) startBattleHook = h.startBattle; if (h.arcActions) arcActionsHook = h.arcActions; if (h.arcStep) arcStepHook = h.arcStep; if (h.arcSweep) arcSweepHook = h.arcSweep; }

// ---- combat.js ----
// Ship combat, from the Players' Guide's "The USS Pelion": exchanges; Power to spend on shields, phasers and
// torpedoes (and what's left over as a bonus); the captain's order; Helm to evade; Shields before Hull; a concussive
// roll for every hit that reaches the Hull; Engineering to repair mid-fight; a Helm contest to break away.


const shieldsMax = (S) => PELION.shields + (S.pelion.refits.shields ? 1 : 0) + (hasRecord(S, "shield1") ? 1 : 0);
const powerOf = (S) => Math.max(1, PELION.power + (S.pelion.refits.power ? 1 : 0) + (hasRecord(S, "power1") ? 1 : 0) - (S.pelion.powerLoss || 0));
/** The Pelion's numbers for this exchange, with who stands each station. */
function battleStats(S) {
  const P = S.pelion, helmId = stationOfficer(S, "helm"), gunId = stationOfficer(S, "tactical"), engId = stationOfficer(S, "engineering");
  const helm = helmId ? target(S, helmId, "Helm", { combat: true }).total + Math.max(-6, sysPenalty(P.sys.engines)) : 8;
  const gun = gunId ? target(S, gunId, "Phasers", { combat: true }).total + (P.refits.phasers ? 1 : 0) + Math.max(-6, sysPenalty(P.sys.weapons)) : 8;
  const eng = engId ? target(S, engId, "Engineering", { combat: true }).total : 8;
  return { helmId, gunId, engId, helm, gun, eng, power: powerOf(S), shieldsMax: shieldsMax(S), maneuver: PELION.maneuver - (P.sys.engines ? 1 : 0), weaponsOut: P.sys.weapons >= 3 };
}

function startBattle(S, enemyId, initiator) {
  const e = S.enemies[enemyId], E = ENEMIES[e.type];
  if (initiator === "pelion" && e.power === "klingon" && !e.hostile) {
    markCommand(S, 1, "the Pelion fired first on a Klingon ship. A diplomatic incident.");
    S.tension = Math.min(10, S.tension + 2); e.hostile = true;
  }
  const ambush = initiator === "enemy" && E.ambush && e.cloaked;
  e.cloaked = false; e.revealed = false; e.seen = true;
  const P = S.pelion;
  S.battle = { enemy: enemyId, ex: 0, log: [], ambush, over: null, initiator, start: { hull: P.hull, torps: P.torps, sys: P.sys.weapons + P.sys.engines + P.sys.sensors } };
  log(S, `Battle: the Pelion against ${E.base ? "the Orion base" : (/^[AEIOU]/.test(E.name) ? "an " : "a ") + E.name}${ambush ? ", which decloaks firing" : ""}.`, "war");
}
registerHooks({ startBattle });

const R = (r) => `${r.total} vs ${r.target}`;
function hitEnemy(S, e, n, L, what) {
  const E = ENEMIES[e.type];
  for (let i = 0; i < n; i++) { if (e.shields < E.shields) e.shields++; else e.hull++; }
  L.push(`${what} hits: their shields ${E.shields - e.shields}/${E.shields}, hull ${Math.max(0, E.hull - e.hull)}/${E.hull}.`);
}
/** Mark boxes on the Pelion; return whether any reached the hull. */
function hitPelion(S, n, shieldsUp, L, what) {
  const P = S.pelion, max = shieldsMax(S);
  let hull = 0;
  for (let i = 0; i < n; i++) { if (shieldsUp && P.shields < max) P.shields++; else { P.hull++; hull++; } }
  L.push(`${what}: shields ${max - P.shields}/${max}, hull ${Math.max(0, PELION.hull - P.hull)}/${PELION.hull}.`);
  if (hull) concussive(S, L);
  return hull > 0;
}
/** The Players' Guide's concussive system damage table, for a hit that reaches the hull. */
function concussive(S, L) {
  const P = S.pelion, r = check(S, 0).total;
  const hurt = (n) => { const ids = ["helm", "tactical", "science", "engineering", "comms"].map((s) => stationOfficer(S, s)).filter(Boolean); const id = pick(S, ids); S.crew[id].inj = Math.min(3, S.crew[id].inj + n); return `${officer(id).short} is hurt (${S.crew[id].inj}/3)`; };
  const sys = (k, n) => { P.sys[k] = Math.min(3, P.sys[k] + n); };
  let t;
  if (r === 3) { P.powerLoss = Math.min(4, (P.powerLoss || 0) + 2); t = "warp core offline: emergency power"; }
  else if (r === 4) t = "a bridge station explodes: " + hurt(2);
  else if (r === 5) { sys("engines", 3); t = "impulse engines offline"; }
  else if (r === 6) { sys("sensors", 2); t = "computer offline"; }
  else if (r <= 8) { sys("engines", 1); t = r === 7 ? "deflector damaged" : "warp drive damaged"; }
  else if (r <= 10) { P.hull++; t = `hull breach: ${(check(S, 0).total) * 5} crew lost or hurt`; }
  else if (r <= 12) { P.shields = Math.min(shieldsMax(S), P.shields + 1); t = "shield emitter damaged"; }
  else if (r === 13) { P.powerLoss = Math.min(4, (P.powerLoss || 0) + 1); t = "power conduits damaged: Power −1"; }
  else if (r === 14) { sys("engines", 1); t = "impulse engine damaged"; }
  else if (r <= 16) t = "a bridge station sparks: " + hurt(1);
  else { sys("weapons", 1); t = "fire control damaged"; }
  L.push(`Concussive damage (${r}): ${t}.`);
}

/**
 * One exchange. choice: { order: "command"|"read"|"hail"|null, shields, phasers, torps, repair, breakOff }.
 * Returns the exchange's lines; S.battle.over is set when the battle ends.
 */
function exchange(S, choice = {}) {
  const B = S.battle; if (!B || B.over) return [];
  const e = S.enemies[B.enemy], E = ENEMIES[e.type], P = S.pelion, st = battleStats(S), L = [];
  B.ex++;
  // Power: shields, phasers, torpedoes; what's left is a bonus to one roll (+2 at most).
  let power = st.power;
  const up = !!choice.shields && power > 0; if (up) power--;
  const phas = !!choice.phasers && !st.weaponsOut && power > 0 && !choice.breakOff; if (phas) power--;
  const torp = !!choice.torps && P.torps > 0 && !st.weaponsOut && power > 0 && !choice.breakOff; if (torp) power--;
  const spare = Math.min(2, power);
  let hit = 0, evade = 0;
  // The captain's order.
  if (choice.order === "command") {
    const r = check(S, CAPTAIN.skills.Leadership);
    if (r.success) { hit += 2; if (r.margin >= 5) evade += 2; L.push(`Captain's order, Command (${R(r)}): +2 to Tactical${r.margin >= 5 ? " and Helm" : ""}.`); } else L.push(`Captain's order, Command (${R(r)}): the bridge is rattled.`);
  } else if (choice.order === "read") {
    const r = check(S, CAPTAIN.skills.Psychology);
    if (r.success) { evade += 2; hit += 1; L.push(`Captain's order, Read the enemy (${R(r)}): you see their next move coming. +2 to evade, +1 to hit.`); } else L.push(`Captain's order, Read the enemy (${R(r)}): they're hard to read.`);
  } else if (choice.order === "hail") {
    const r = check(S, CAPTAIN.skills.Diplomacy), them = check(S, E.will);
    const wins = r.success && (!them.success || r.margin > them.margin);
    if (wins && !(E.relentless && e.hull < 3) && e.power !== "romulan" && !E.base) {
      L.push(`Hail (${R(r)} against their Will, ${R(them)}): they stand down and withdraw.`);
      sendHome(S, e, 4); B.over = "hailed"; return finish(S, L);
    }
    L.push(`Hail (${R(r)} against their Will, ${R(them)}): ${e.power === "romulan" ? "silence on every channel" : E.relentless && e.hull < 3 ? "the Klingon captain laughs at you" : "they won't listen"}.`);
  }
  const md = st.maneuver - (E.maneuver || 0);
  // Breaking away: a Helm contest instead of firing.
  if (choice.breakOff) {
    const r = check(S, st.helm + spare + evade + Math.max(0, md)), them = E.base ? { success: false, margin: -99, total: "-", target: "-" } : check(S, E.helm + Math.max(0, -md));
    if (r.success && (!them.success || r.margin > them.margin)) { L.push(`Break away (Helm ${R(r)} against theirs, ${R(them)}): the Pelion goes to warp.`); e.cooldown = 2; B.over = "escaped"; return finish(S, L); }
    L.push(`Break away (Helm ${R(r)} against theirs, ${R(them)}): they stay on you.`);
  }
  // The Pelion fires.
  if (phas) {
    const r = check(S, st.gun + hit + spare);
    if (!r.success) L.push(`Phasers (${R(r)}): miss.`);
    else {
      const ev = E.base ? null : check(S, E.helm + Math.max(0, -md));
      if (ev && ev.success) L.push(`Phasers (${R(r)}): on target, but they evade (${R(ev)}).`);
      else hitEnemy(S, e, PELION.phaser, L, `Phasers (${R(r)})`);
    }
  }
  if (torp) {
    P.torps--;
    const r = check(S, st.gun + hit + PELION.torpBonus);
    if (r.success) hitEnemy(S, e, 2, L, `Photon torpedoes (${R(r)})`); else L.push(`Photon torpedoes (${R(r)}): wide.`);
  }
  for (const u of Object.values(S.support)) {
    if (u.at !== P.at || e.hull >= E.hull) continue;
    const T = SUPPORT[u.type], r = check(S, T.gunner);
    if (r.success && !(E.base ? false : check(S, E.helm).success)) hitEnemy(S, e, T.phaser, L, `The ${u.name}'s phasers (${R(r)})`);
  }
  if (e.hull >= E.hull) { B.over = "destroyed"; return finish(S, L); }
  // Do they run?
  const runs = (e.type === "orion" && e.shields >= E.shields) || (e.type === "kbop" && e.hull >= 2) || (e.type === "kbc" && e.hull >= 3);
  if (runs) {
    const r = check(S, E.helm + Math.max(0, -md) + (E.fast ? 2 : 0)), us = check(S, st.helm + Math.max(0, md));
    if (r.success && (!us.success || r.margin > us.margin)) { L.push(`The ${E.name} breaks off and runs (${R(r)} against your Helm, ${R(us)}).`); sendHome(S, e, 5); e.cooldown = 2; B.over = "fled"; return finish(S, L); }
    L.push(`The ${E.name} tries to break away, but the Pelion holds it (${R(us)}).`);
  }
  if (e.type === "rbop" && e.hull >= 2) { L.push("The Romulan commander overloads the warp core rather than be taken."); e.hull = E.hull; B.over = "destroyed"; return finish(S, L); }
  // They fire: at the Pelion, or at an escort beside it.
  const escorts = Object.values(S.support).filter((u) => u.at === P.at);
  const tgt = escorts.length && rand(S) < 0.3 ? pick(S, escorts) : null;
  const gun = E.gunner + (B.ambush && B.ex === 1 ? 2 : 0);
  const volley = (label, dmg, evadable) => {
    const r = check(S, gun + (label === "torpedo" ? 1 : 0));
    const name = { kbc: "Disruptors", kbop: "Disruptors", rbop: "Plasma torpedo", orion: "Disruptors", orionBase: "The base's guns" }[e.type];
    const what = label === "torpedo" ? "Photon torpedo" : name;
    if (!r.success) { L.push(`Their ${what.toLowerCase()} (${R(r)}): miss.`); return; }
    if (tgt) {
      const T = SUPPORT[tgt.type];
      if (evadable && check(S, T.helm).success) { L.push(`Their ${what.toLowerCase()} (${R(r)}): the ${tgt.name} evades.`); return; }
      for (let i = 0; i < dmg; i++) { if (tgt.shields < T.shields) tgt.shields++; else tgt.hull++; }
      if (tgt.hull >= T.hull) { L.push(`Their ${what.toLowerCase()} (${R(r)}): the ${tgt.name} is destroyed.`); delete S.support[tgt.id]; markCommand(S, 1, `the ${tgt.name} was lost.`); }
      else L.push(`Their ${what.toLowerCase()} (${R(r)}): the ${tgt.name} is hit.`);
      return;
    }
    if (evadable) {
      const ev = check(S, st.helm + evade + (phas ? 0 : spare) + Math.max(0, md) + (E.plasma ? 2 : 0));
      if (ev.success) { L.push(`Their ${what.toLowerCase()} (${R(r)}): Helm evades (${R(ev)}).`); return; }
    }
    hitPelion(S, dmg, up, L, `Their ${what.toLowerCase()} (${R(r)}) hits`);
  };
  volley("main", E.dmg, true);
  if (e.type === "kbc" && B.ex % 2 === 0) volley("torpedo", 2, false);
  // Damage control.
  if (choice.repair && st.engId) {
    const r = check(S, st.eng);
    if (r.success) {
      let n = r.margin >= 5 ? 2 : 1; const fixed = [];
      if (P.powerLoss && n) { P.powerLoss--; n--; fixed.push("power"); }
      for (const k of ["weapons", "engines", "sensors"]) while (n && P.sys[k]) { P.sys[k]--; n--; fixed.push(k); }
      while (n && P.shields) { P.shields--; n--; fixed.push("shields"); }
      L.push(`Damage control, ${officer(st.engId).short} (${R(r)}): ${fixed.join(", ") || "nothing left to fix"}.`);
    } else L.push(`Damage control (${R(r)}): no luck.`);
  }
  if (P.hull >= PELION.hull) { B.over = "lost"; return finish(S, L); }
  if (B.ex >= 12) { L.push("Both ships pull back to lick their wounds."); sendHome(S, e, 3); e.cooldown = 2; B.over = "fled"; }
  return finish(S, L);
}

function finish(S, L) {
  const B = S.battle; B.log.push(...L.map((t) => `${B.ex}. ${t}`));
  if (!B.over) return L;
  const e = S.enemies[B.enemy], E = ENEMIES[e.type];
  if (B.over === "destroyed") {
    delete S.enemies[e.id];
    if (e.type === "orionBase") { S.commendations += 6; S.supplies += 15; S.orionBaseDown = true; log(S, "The Orion pirate base is destroyed. The raids on the sector will stop.", "victory"); }
    else if (e.power === "orion") { S.commendations += 2; S.supplies += 6; log(S, `The Pelion destroys an Orion raider. Salvage: +6 supplies.`, "good"); }
    else if (e.power === "romulan") { S.commendations += 3; log(S, "The Romulan bird-of-prey is destroyed.", "good"); }
    else { S.tension = Math.min(10, S.tension + 2); if (e.hostile && B.initiator !== "pelion") S.commendations += 2; log(S, `The ${E.name} is destroyed. The Empire will remember.`, "war"); }
  } else if (B.over === "lost") log(S, "The Pelion's hull is breaking up.", "bad");
  else log(S, { fled: `The ${E.name} breaks off.`, hailed: `The ${E.name} stands down.`, escaped: "The Pelion breaks away." }[B.over] || "The battle ends.");
  // What the battle cost: one line for the log.
  const P = S.pelion, st = B.start || { hull: P.hull, torps: P.torps, sys: 0 };
  const hullLost = P.hull - st.hull, sysHit = P.sys.weapons + P.sys.engines + P.sys.sensors - st.sys, torps = st.torps - P.torps;
  log(S, `The battle took ${B.ex} exchange${B.ex === 1 ? "" : "s"}${B.initiator === "enemy" ? ", and they fired first" : ""}. The Pelion ${hullLost > 0 ? `lost ${hullLost} hull box${hullLost === 1 ? "" : "es"} (hull ${Math.max(0, PELION.hull - P.hull)}/${PELION.hull})` : "kept its hull intact"}${sysHit > 0 ? `, took ${sysHit} system damage` : ""}${torps > 0 ? `, and fired ${torps} torpedo${torps === 1 ? "" : "es"} (${P.torps} left)` : ""}.`, B.over === "lost" ? "bad" : "");
  checkEnd(S);
  return L;
}
function endBattle(S) { const B = S.battle; S.battle = null; return B; }

/** A fight the Pelion isn't in: an escort guarding a world against a raider. Rolled out in full. */
function skirmish(S, u, e) {
  const T = SUPPORT[u.type], E = ENEMIES[e.type];
  e.cloaked = false;
  for (let ex = 1; ex <= 4; ex++) {
    if (check(S, T.gunner).success && !check(S, E.helm).success) { if (e.shields < E.shields) e.shields++; else e.hull++; }
    if (e.hull >= E.hull) { delete S.enemies[e.id]; S.commendations += 1; log(S, `The ${u.name} destroys the ${E.name}.`, "good"); return "won"; }
    if (e.type === "orion" && e.shields >= E.shields) { sendHome(S, e, 5); log(S, `The ${u.name} drives off the ${E.name}.`, "good"); return "drove"; }
    if (check(S, E.gunner).success && !check(S, T.helm).success) { for (let i = 0; i < E.dmg; i++) { if (u.shields < T.shields) u.shields++; else u.hull++; } }
    if (u.hull >= T.hull) { delete S.support[u.id]; markCommand(S, 1, `the ${u.name} was lost defending ${sysAt(S, u.at)?.name || "its post"}.`); return "lost"; }
  }
  sendHome(S, e, 3); log(S, `The ${u.name} holds off the ${E.name}.`, "good"); return "held";
}

// ---- arc.js ----
// The first mission, from the GM's Guide: The Silence at Corvan II. An Orion raider in orbit; the pull on the ship's
// power and a Countdown of 6; the away team's investigation (a discovery clock of 4); Orion diggers in the ruins; and
// the caretaker machine, with a choice about what to do with it.



const CLUES = {
  logs: { name: "The outpost logs", skills: ["Computers"], found: "Dr. Haskel's dampener test, then a power spike, then nothing." },
  bunks: { name: "The empty bunks", skills: ["Medicine", "Sensors"], found: "No blood, no struggle, personal effects untouched. The scientists walked out." },
  energy: { name: "The ruins' energy", skills: ["Physical Sciences", "Sensors"], found: "A field that reads the away team's biology and records it. It knows them now." },
  village: { name: "The Ketari village", skills: ["Psychology", "Stealth"], found: "Ketari carrying Orion phasers. The chieftain's people dig at the ruins by night." },
};
const COUNTDOWN = 6, CLOCK = 4;
const arcOrder = (S) => S.orders.find((o) => o.arc);
const raider = (S) => enemiesAt(S, S.systems[S.corvan].at).find((e) => e.goal === "arc");

function arcActions(S) {
  const A = S.arc, out = [];
  const add = (arc, name, skills, blurb, extra) => out.push({ id: "arc", arc, name, skills, blurb, extra });
  if (A.stage === "orbit") add("scan", "Sweep the ruins with the ship's sensors", ["Sensors", "Physical Sciences"], "Find out what's down there before anyone beams down. Whatever the roll, something in the ruins will notice.");
  if (A.stage === "pull") {
    for (const [k, c] of Object.entries(CLUES)) if (!A.clues[k]) add("clue-" + k, `Away team: ${c.name.toLowerCase()}`, c.skills, `A clue for the record (${A.clock}/${CLOCK}). A failure costs time: the Countdown fills.${k === "village" ? " Fail by 3 or more and the Ketari see you." : ""}`, [["Something here is wrong", -2]]);
    if (!A.boughtTime && A.countdown > 0) add("time", "Buy time: reroute power", ["Engineering"], "Clear a segment of the Countdown. Once.");
  }
  if (A.stage === "orions") {

function arcStep(S, p) {
  const A = S.arc, r = p.roll, k = p.arc, who = officer(p.officer)?.short || "The away team";
  if (k === "scan") {

    }

  }
  if (k === "time") {
    if (r.success) { A.countdown = Math.max(0, A.countdown - 1); A.boughtTime = true; log(S, `${who} reroutes power around the drain: the Countdown ${A.countdown}/${COUNTDOWN}.`, "good"); }
    else { A.boughtTime = true; log(S, `${who} can't find a way around the drain.`, "bad"); }
    return "";
  }
  if (k === "stun" || k === "kill") {
    if (!r.success) {
      A.countdown++; const id = p.officer; S.crew[id].inj = Math.min(3, S.crew[id].inj + 1);

      return checkCountdown(S);
    }

    A.stage = "caretaker";

  }

}
function checkCountdown(S) {

}
function finishArc(S, how) {

      ? "Sevek lays out the paradox, and the machine considers it for a long time. Then it releases the eight scientists and goes back to its watch: the Ketari keep their guardian, and the Federation has a library record no one else has. Rrinn's sister is the first one out, and finally finishes that sentence."
      : "The caretaker goes dark. The eight scientists wake, cold and confused and alive, and the Ketari will never know what watched over them, or that it's gone. Rrinn's sister is among the sleepers, and finally finishes that sentence.");

/** After anything happens: move the story on. */
function arcTick(S) {
  const A = S.arc, cv = S.systems[S.corvan];

    // In orbit and unopposed. Nothing happens below until the Pelion's sensors sweep the ruins.
    A.stage = "orbit";
    const o = arcOrder(S); if (o) o.deadline = 999;
    log(S, "In orbit over Corvan II, the raider gone. The outpost doesn't answer hails. The ruins are two kilometers from the Ketari village. Sweep them with the ship's sensors (the Here tab) to learn what happened.", "order");
  }
}
/** The sweep that wakes what's in the ruins: the arc's own scan, or an ordinary sensor sweep over Corvan II. */
function startPull(S) {
  const A = S.arc; if (A.stage !== "orbit") return;
  A.stage = "pull";
  storyEvent(S, "The pull", "The moment the Pelion's sensors sweep the ruins, the lights flicker: something below is drawing on the ship's power, and the orbit begins to decay. The Countdown has started (6): it fills a segment each turn the Pelion stays in orbit, and with each failure on the surface. When it fills, the Pelion has to break orbit. The away team beams down to an empty outpost.");
}
function arcSweep(S) { if (S.arc.stage === "orbit" && S.pelion.at === S.systems[S.corvan].at) startPull(S); }
/** End of turn: the drain on the ship while it stays in orbit. */
function arcTurn(S) {
  const A = S.arc;
  if (["pull", "orions", "caretaker"].includes(A.stage) && S.pelion.at === S.systems[S.corvan].at) { A.countdown++; log(S, `Corvan II drains the Pelion: the Countdown ${A.countdown}/${COUNTDOWN}.`); checkCountdown(S); }
}

/** The arrival at Corvan II: the raider hails first. */
function arcEventChoices(S) {
  if (!S.event || S.event.kind !== "arc-arrive") return [];
  return [
    { id: "warn", name: "Warn them off", blurb: "Communications or Diplomacy against their captain's Will. Fail, and they open fire." + (S.arc.scanned ? " +2: you know what they've been selling." : "") },
    { id: "scan", name: "Scan them first", blurb: "Sensors: what is an Orion raider doing over a pre-warp world?", disabled: S.arc.scanned },
    { id: "engage", name: "Engage", blurb: "Raise shields and fire. They're pirates: no incident." },
  ];
}
function arcEventChoose(S, id, roll) {
  const e = raider(S);
  if (!e) { S.event = null; arcTick(S); return { text: "The raider is gone." }; }
  if (id === "scan") {
    const r = roll("Sensors", "scan"); S.arc.scanned = true;
    if (r.success) log(S, "Scan of the Orion raider at Corvan II: its hold is full of digging gear, and its manifest lists Starfleet-pattern phasers \"traded\" planetside. They're arming the natives.", "discovery");
    return { roll: r, text: r.success ? "Their hold is full of digging gear, and their manifest lists Starfleet-pattern phasers \"traded\" planetside. They're arming the natives." : "Their hull scatters the scan." };
  }
  if (id === "warn") {
    const r = roll("Communications", "hail", [["Their captain's Will 10", 0]].concat(S.arc.scanned ? [["You know what they've done", 2]] : []));
    S.event = null;
    if (r.success) { sendHome(S, e, 6); e.goal = "home"; delete S.enemies[e.id]; log(S, "The Orion raider runs for the sector's edge.", "good"); arcTick(S); return { roll: r, text: "\"Legitimate salvagers\" don't argue with a Heavy Cruiser. The raider runs." }; }
    startBattle(S, e.id, "enemy"); return { roll: r, text: "The Orion captain cuts the channel, and the raider opens fire." };
  }
  if (id === "engage") { S.event = null; startBattle(S, e.id, "pelion"); return { text: "Shields up." }; }

}

// ---- ai.js ----
// The other powers in the Corvan Sector, each turn.
//  - The Klingon Empire: a cold war. Most of its ships court the independent worlds (lowering their accord); some
//    raid, more as tension rises. Firing first on one that hasn't fired is an incident.
//  - The Orion Syndicate: raiders from a hidden base strike colonies and member worlds, steal supplies and run.
//  - The Romulan Star Empire: now and then a cloaked bird-of-prey crosses the Neutral Zone to strike, and goes home.





const EVERY = { easy: { k: 9, o: 8, r: 15 }, normal: { k: 7, o: 6, r: 11 }, hard: { k: 5, o: 5, r: 8 } };
const count = (S, power, type) => Object.values(S.enemies).filter((e) => e.power === power && (!type || e.type === type) && !ENEMIES[e.type].base).length;
const worlds = (S, kinds) => Object.values(S.systems).filter((s) => kinds.includes(s.kind));

function aiTurn(S) {
  const ev = EVERY[S.difficulty] || EVERY.normal;
  // Klingons.
  const outposts = worlds(S, ["klingon", "claimed"]);
  if (outposts.length && S.turn % ev.k === 2 && count(S, "klingon") < 2 + Math.floor(S.turn / 15)) {
    const from = pick(S, outposts);
    const raid = rand(S) < 0.15 + S.tension * 0.06;
    const ind = worlds(S, ["independent"]).filter((s) => !Object.values(S.enemies).some((e) => e.target === s.at)).sort((a, b) => a.accord - b.accord || distance(a.at, from.at) - distance(b.at, from.at));
    const tgt = raid ? pick(S, worlds(S, ["colony", "member"]).length ? worlds(S, ["colony", "member"]) : ind) : ind[0];
    if (tgt) {
      const e = spawnEnemy(S, rand(S) < 0.45 ? "kbc" : "kbop", from.at, { goal: raid ? "raid" : "influence", target: tgt.at, hostile: raid, home: from.at });
      if (raid) log(S, `Intelligence: Klingon raiders are moving on ${tgt.name}.`, "war");
      else if (S.visible[from.at]) log(S, `A ${ENEMIES[e.type].name} leaves ${from.name}.`);
    }
  }
  if (S.tension >= 10) {
    S.tension = 6;
    for (const c of worlds(S, ["colony", "member"]).slice(0, 2)) { const o = closestOutpost(S, c.at); if (o) spawnEnemy(S, "kbc", o.at, { goal: "raid", target: c.at, hostile: true, home: o.at }); }
    log(S, "The Klingon Empire answers the incidents: battle cruisers cross the border.", "war");
  }
  // Orions.
  const base = Object.values(S.enemies).find((e) => e.type === "orionBase");
  if (base && S.turn % ev.o === 3 && count(S, "orion") < 2) {
    const targets = worlds(S, ["colony", "member", "member", "independent"]).filter((s) => distance(s.at, S.pelion.at) >= 3);
    const tgt = targets.length ? pick(S, targets) : null;
    if (tgt) spawnEnemy(S, "orion", base.at, { goal: "raid", target: tgt.at, hostile: true, home: base.at });
  }
  // Romulans.
  if (S.turn >= 9 && S.turn % ev.r === 9 && count(S, "romulan") < 1) {
    const targets = worlds(S, ["colony", "member"]);
    if (targets.length) {
      const tgt = pick(S, targets);
      const zone = Object.keys(S.hexes).filter(inZone).sort((a, b) => distance(a, tgt.at) - distance(b, tgt.at));
      spawnEnemy(S, "rbop", zone[0], { goal: "strike", target: tgt.at, hostile: true, cloaked: true, home: zone[0] });
    }
  }
  // Every ship moves and does its job.
  for (const e of Object.values(S.enemies)) {
    if (!S.enemies[e.id]) continue;
    const E = ENEMIES[e.type];
    if (e.cooldown) e.cooldown--;
    if (E.base || e.goal === "arc") continue;
    if (e.target && e.at !== e.target) step(S, e);
    if (e.at !== e.target) continue;
    const s = sysAt(S, e.at);
    if (e.goal === "home") {
      if (e.stay > 0) { e.stay--; continue; }
      delete S.enemies[e.id]; continue;
    }
    if (e.goal === "influence" && s && s.kind === "independent") {
      // A week of gifts and promises every other turn: accord −1.
      if (e.stay % 2 === 0) {
        s.accord = Math.max(-5, s.accord - 1);
        if (S.visible[s.at]) log(S, `A ${E.name} is courting ${s.name} with gifts and promises: its accord falls to ${s.accord}${s.accord <= -3 ? ". It's close to joining the Empire" : ""}.`, "war");
        if (s.accord <= -5) claim(S, s);
      }
      if (++e.stay >= 6 || s.kind !== "independent") sendHome(S, e, 0);
    } else if (e.goal === "raid" || e.goal === "strike") {
      const guard = Object.values(S.support).find((u) => u.at === e.at && u.type === "escort");
      if (S.pelion.at === e.at) continue;  // the Pelion is here: the fight comes at the end of the turn
      if (guard) { const r = skirmish(S, guard, e); if (r === "won" || r === "drove") continue; }
      if (!S.enemies[e.id]) continue;
      // One strike, then away: a raid harms a world once (a Romulan strike, twice) and the raider makes for home.
      if (e.power === "orion") S.supplies = Math.max(0, S.supplies - 3);
      if (s) harmWorld(S, s, e.goal === "strike" ? 2 : 1, e.goal === "strike" ? `a Romulan bird-of-prey decloaked over it, fired, and turned for the Neutral Zone`
        : e.power === "orion" ? `an Orion raider struck it, stole 3 supplies from the Federation's convoys, and ran for home` : `a ${E.name} raided it and turned for the border`);
      if (e.goal === "strike") { e.cloaked = false; e.seen = true; }
      sendHome(S, e, 0);
    } else if (e.goal === "claim" || e.goal === "watch") {
      if (!S.orders.some((o) => o.at === e.at) || ++e.stay >= 8) { if (e.goal === "watch") e.cloaked = true; sendHome(S, e, 0); }
    }
  }
}

function step(S, e) {
  const p = findPath(S, e.at, e.target, e.power === "romulan" ? "romulan" : e.power);
  if (!p) { delete S.enemies[e.id]; return; }
  let mp = ENEMIES[e.type].speed;
  for (const k of p.path) {
    const c = S.hexes[k].terrain === "nebula" ? 2 : 1;
    if (c > mp) break;
    mp -= c; e.at = k;
    if (k === S.pelion.at && e.hostile && !e.cloaked && e.goal !== "home") break;   // raiders stop to fight the Pelion
  }
}

function claim(S, s) {
  s.kind = "claimed"; s.accord = -5; S.lostWorlds++;
  log(S, `${s.name} joins the Klingon Empire.`, "war");
  markCommand(S, 1, `${s.name} went over to the Klingon Empire.`);
}

const kindName = (s) => (s.kind === "claimed" ? "Klingon world" : s.kind === "member" ? "Federation member" : s.kind === "lost" ? "Evacuated colony" : KINDS[s.kind]?.name);

// ---- turn.js ----
// The end of a turn: the other powers move, the crew heals, supplies come in, orders fall due, new orders arrive.
// Also the one place that ties the modules together, so the page imports this.






function canEndTurn(S) { return !(S.over || S.battle || S.event || S.pending); }

function endTurn(S) {
  if (!canEndTurn(S)) return { error: "Finish what's in front of you first." };
  aiTurn(S);
  // Income.
  const sys = Object.values(S.systems);
  const income = 3 + sys.filter((s) => s.kind === "colony").length + 2 * sys.filter((s) => s.kind === "member").length;
  S.supplies += income;
  const cols = sys.filter((s) => s.kind === "colony").length, mems = sys.filter((s) => s.kind === "member").length;
  log(S, `Supplies this week: +${income} (Starbase 23 +3${cols ? `, ${cols} colon${cols === 1 ? "y" : "ies"} +${cols}` : ""}${mems ? `, ${mems} member world${mems === 1 ? "" : "s"} +${2 * mems}` : ""}). Now ${S.supplies}; science ${S.science}.`, "turn");
  // Healing: the doctor works on the worst hurt; a sickbay upgrade or biostasis heals everyone a little more.
  const hurt = CREW.filter((c) => S.crew[c.id].inj > 0).sort((a, b) => S.crew[b.id].inj - S.crew[a.id].inj);
  if (hurt.length) {
    const doc = available(S, "vessik") ? "vessik" : bestOfficer(S, ["Medicine"])?.officer;
    if (doc) {
      const r = check(S, target(S, doc, "Medicine").total), pt = hurt[0];
      if (r.success) { S.crew[pt.id].inj--; log(S, `Sickbay: ${officer(doc).short} treats ${pt.name} (Medicine, ${r.total} against ${r.target}): ${S.crew[pt.id].inj === 0 ? "back on duty" : `hurt ${S.crew[pt.id].inj}/3`}.`, "good"); }
      else log(S, `Sickbay: ${officer(doc).short}'s treatment of ${pt.name} doesn't take this week (${r.total} against ${r.target}); still hurt ${S.crew[pt.id].inj}/3.`);
    }
    if (S.pelion.refits.sickbay || hasRecord(S, "heal")) for (const c of hurt) if (S.crew[c.id].inj > 0 && c !== hurt[0]) S.crew[c.id].inj--;
  }
  // Out of battle, the shields come back.
  S.pelion.shields = 0;
  for (const u of Object.values(S.support)) u.shields = 0;
  // Duty points: every 8 turns, as if a new session.
  if (S.turn % 8 === 0) { for (const id in S.crew) S.crew[id].duty = 2; log(S, "Duty points restored.", "good"); }
  arcTurn(S);
  // Orders fall due.
  for (const o of [...S.orders]) if (S.turn >= o.deadline) { log(S, `Orders failed: ${o.title}.`, "bad"); completeOrder(S, o, false); if (o.arc) { S.arc.stage = "done"; storyEvent(S, "Too late", "Another ship reached Corvan II first. Whatever happened to the eight scientists, the Pelion wasn't there for it, and Starfleet Command has noted it."); } }
  // The Klingon border pulls on nearby worlds.
  if (S.turn % 8 === 0) {
    const k = sys.filter((s) => s.kind === "klingon" || s.kind === "claimed");
    for (const s of sys.filter((x) => x.kind === "independent")) if (k.some((o) => distance(o.at, s.at) <= 3) && s.accord > -5) { s.accord--; if (s.accord <= -5) claim(S, s); }
  }
  // Worlds rebuild: with no raider overhead, a harm box clears every 5 turns.
  if (S.turn % 5 === 0) for (const s of sys) if (s.harm > 0 && !Object.values(S.enemies).some((e) => e.at === s.at && e.hostile)) s.harm--;
  if (S.turn % 6 === 0 && S.tension > 0) S.tension--;
  // New orders.
  const active = S.orders.filter((o) => !o.arc).length;
  if (S.turn >= 3 && active < 2 && (S.turn % 4 === 0 || active === 0 && S.turn % 2 === 0)) newOrder(S);
  // Next turn.
  S.turn++;
  S.pelion.mp = speedOf(S); S.pelion.acted = false; S.pelion.zoneMarked = false;
  for (const u of Object.values(S.support)) { u.mp = SUPPORT[u.type].speed; u.acted = false; }
  updateVisibility(S);
  // A hostile ship sharing the Pelion's hex attacks.
  const foe = Object.values(S.enemies).find((e) => e.at === S.pelion.at && e.hostile && !e.cooldown && !ENEMIES[e.type].base && e.goal !== "home" && e.goal !== "arc");
  if (foe && !S.event) startBattle(S, foe.id, "enemy");
  arcTick(S);
  checkEnd(S);
  return { ok: true, income };
}

/** The arrival event at Corvan II, rolled with the best officer. */
function chooseEvent(S, id) {
  const roll = (skill, action, extra = []) => {
    const b = bestOfficer(S, [skill], { action, listen: action === "hail" }) || { officer: "captain", skill };
    const t = target(S, b.officer, skill, { action, listen: action === "hail", extra });
    const r = check(S, t.total);
    return { ...r, officer: b.officer, skill, parts: t.parts };
  };
  const out = arcEventChoose(S, id, roll);
  updateVisibility(S);
  return out;
}
function dismissEvent(S) { S.event = null; arcTick(S); checkEnd(S); }
function closeBattle(S) { endBattle(S); arcTick(S); updateVisibility(S); checkEnd(S); }

  h += `<h3>Your ships<\/h3>`;
  for (const u of Object.values(S.support)) { const T = SUPPORT[u.type]; h += `<div class="card"><h4>${esc(u.name)}<\/h4><div class="small muted">${T.name}: ${T.blurb} Hull ${T.hull - u.hull}/${T.hull}.<\/div><div class="roll-row"><button class="btn small" data-unit="${u.id}">Command it<\/button><button class="btn small" data-center="${u.at}">Find it<\/button><\/div><\/div>`; }
  if (!Object.keys(S.support).length) h += `<p class="small muted">Only the Pelion, for now.<\/p>`;
  for (const [id, T] of Object.entries(SUPPORT)) h += `<div class="card violet"><h4>Requisition: ${esc(T.name)}<\/h4><div class="small muted">${esc(T.blurb)}<\/div><div class="roll-row"><button class="btn small" data-req="${id}" ${!P.docked || S.supplies < T.cost || Object.keys(S.support).length >= 3 ? "disabled" : ""}>${T.cost} supplies<\/button>${P.docked ? "" : `<span class="small muted">At Starbase 23<\/span>`}<\/div><\/div>`;

  return h;
}

// ---------- Orders ----------

  }
  if (!S.orders.length && (A.stage === "done" || A.stage === "travel")) h += `<p class="muted">No orders. Starfleet will send more; meanwhile, the sector is yours to patrol.<\/p>`;

// ---------- Sector ----------
function sectorHTML() {
  const sc = score(S);
  let h = `<h2>The Corvan Sector<\/h2><p class="small muted">Turn ${Math.min(S.turn, TOUR)} of ${TOUR}. Score so far: <b class="gold">${sc.total}<\/b>.<\/p>`;
  h += `<table class="tbl"><tr><th>World<\/th><th>What<\/th><th>Status<\/th><\/tr>`;
  const order = { member: 0, colony: 1, starbase: 2, independent: 3, claimed: 4, klingon: 5, lost: 6 };
  for (const s of Object.values(S.systems).filter((x) => shownKind(x) && order[shownKind(x)] !== undefined).sort((a, b) => order[a.kind] - order[b.kind])) {
    const st = s.kind === "independent" ? `accord ${s.accord > 0 ? "+" : ""}${s.accord}` : s.harm ? `<span class="bad">harm ${s.harm}/3<\/span>` : "";
    h += `<tr data-hex="${s.at}"><td>${esc(s.name)}<\/td><td>${esc(kindName(s))}<\/td><td>${st}${s.harm && s.kind === "independent" ? `, <span class="bad">harm ${s.harm}<\/span>` : ""}<\/td><\/tr>`;
  }
  h += `<\/table><h3>Score<\/h3><table class="tbl">${sc.parts.filter((p) => p[1]).map(([n, v]) => `<tr><td>${esc(n)}<\/td><td style="text-align:right">${v}<\/td><\/tr>`).join("")}<\/table>`;
  h += `<h3>The powers<\/h3><p class="small muted"><b style="color:${POWERS.klingon.color}">Klingon Empire:<\/b> a cold war. Its ships court independent worlds; raiders strike when tension runs high. Firing first on a Klingon ship that hasn't fired is an incident. <b style="color:${POWERS.orion.color}">Orion Syndicate:<\/b> raiders from a hidden base; a sensor sweep near it hears where. <b style="color:${POWERS.romulan.color}">Romulans:<\/b> cloaked ships cross the Neutral Zone to strike; sweeps reveal them.<\/p>`;
  return h;
}
let logFilter = "all";
function logHTML() {
  const rows = logFilter === "discovery" ? S.log.filter((l) => l.kind === "discovery") : S.log;
  const n = S.log.filter((l) => l.kind === "discovery").length;
  // In order: oldest first, under a heading for each turn.
  let body = "", turn = null;
  for (const l of rows) {
    if (l.t !== turn) { if (turn !== null) body += "<\/ul>"; turn = l.t; body += `<h3 class="log-turn">Turn ${l.t} · Stardate ${(STARDATE0 + (l.t - 1) * 7.3).toFixed(1)}<\/h3><ul class="log">`; }
    body += `<li class="${l.kind}">${esc(l.text)}<\/li>`;
  }
  if (turn !== null) body += "<\/ul>";
  return `<h2>Captain's log<\/h2><div class="btn-row"><button class="btn small ${logFilter === "all" ? "primary" : ""}" data-logf="all">Everything<\/button><button class="btn small ${logFilter === "discovery" ? "primary" : ""}" data-logf="discovery">Discoveries (${n})<\/button><\/div>`
    + (rows.length ? body : `<p class="muted small">Nothing discovered yet: survey, investigate, observe and sweep.<\/p>`);
}

// ---------- the side panel's buttons ----------
function bindChrome() {
  document.querySelector(".tabs").addEventListener("click", (e) => { const b = e.target.closest("[data-tab]"); if (!b) return; tab = b.dataset.tab; renderTabs(); renderPanel(); });
  $("panel").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b || !S) return;
    if (b.dataset.logf) { logFilter = b.dataset.logf; renderPanel(); return; }
    if (b.dataset.unit) { unit = b.dataset.unit; selHex = U().at; tab = "here"; lastResult = null; centerOn(U().at); renderAll(); return; }
    if (b.dataset.go) { selHex = b.dataset.go; goTo(b.dataset.go); return; }
    if (b.dataset.center) { centerOn(b.dataset.center); selHex = b.dataset.center; tab = "here"; renderAll(); return; }
    if (b.dataset.act) {
      const a = JSON.parse(b.dataset.act), sel = b.parentElement.querySelector("[data-who]");
      const [who, skill] = sel ? sel.value.split("|") : [];
      const r = attempt(S, unit, a.id, { order: a.order, enemy: a.enemy, arc: a.arc, officer: who, skill });
      if (r.error) { toast(r.error, true); return; }
      lastResult = r.done ? r.result : null; after(); return;
    }
    if (b.dataset.resolve) { const r = resolve(S, b.dataset.resolve === "reroll"); lastResult = r.done ? r.result : null; after(); return; }
    if (b.dataset.refit) { const r = fitRefit(S, b.dataset.refit); if (r.error) toast(r.error, true); after(); return; }
    if (b.dataset.req) { const r = requisition(S, b.dataset.req); if (r.error) toast(r.error, true); after(); return; }
  });
  $("panel").addEventListener("change", (e) => { const s = e.target.closest("[data-station]"); if (s) { setStation(S, s.dataset.station, s.value); after(); } });
  $("panel").addEventListener("click", (e) => { const tr = e.target.closest("tr[data-hex]"); if (tr) { selHex = tr.dataset.hex; centerOn(selHex); tab = "here"; renderAll(); } });
  $("end-turn").onclick = doEndTurn;
  $("menu").onclick = showMenu;
  $("zoom-in").onclick = () => zoomBy(1.25); $("zoom-out").onclick = () => zoomBy(0.8);
  $("fit").onclick = () => { fitView(); draw(); };
  $("find").onclick = () => { unit = "pelion"; centerOn(S.pelion.at); selHex = S.pelion.at; tab = "here"; renderAll(); };
  document.addEventListener("keydown", (e) => {
    if (!S || !$("modal").hidden || /input|select|textarea/i.test(e.target.tagName)) return;
    if (e.key === "Enter" && !e.repeat) { e.preventDefault(); doEndTurn(); }
  });
  $("modal").addEventListener("click", modalClick);
}
function doEndTurn() {
  if (!S || S.over) return;
  if (!canEndTurn(S)) { toast(S.pending ? "Accept the roll, or reroll it, first." : "Finish what's in front of you first.", true); return; }
  const before = S.log.length;
  const r = endTurn(S); if (r.error) { toast(r.error, true); return; }
  lastResult = null; unit = S.support[unit] ? unit : "pelion"; selHex = U().at;
  const news = S.log.slice(before).filter((l) => l.kind === "order" || l.kind === "war" || l.kind === "bad");
  if (news.length) toast(news[0].text, news[0].kind !== "order");
  after();
}

  const sc = score(S);
  modal(`<h1>${S.over.win ? "The tour is over" : "Relieved"}<\/h1><p class="lede">${esc(S.over.why)}<\/p>
  <h3>${esc(rating(sc.total))}<\/h3><table class="tbl">${sc.parts.map(([n, v]) => `<tr><td>${esc(n)}<\/td><td style="text-align:right">${v}<\/td><\/tr>`).join("")}<tr><td><b>Total<\/b><\/td><td style="text-align:right"><b>${sc.total}<\/b><\/td><\/tr><\/table>
  <p class="small muted" style="margin-top:10px">This sector's seed: <span class="seed">${esc(S.seed)}<\/span><\/p>
  <div class="btn-row"><button class="btn primary" data-m="restart">New tour<\/button><button class="btn" data-m="replay">Replay this sector<\/button><button class="btn" data-m="close">Look at the map<\/button><\/div>`);
}
function modalClick(e) {
  const b = e.target.closest("button"); if (!b) return;
  const m = b.dataset.m;
  if (b.dataset.ev) { eventResult = chooseEvent(S, b.dataset.ev); if (!S.event) eventResult = null; after(); if (!S.event && !S.battle && !S.over) closeModal(); return; }
  if (m === "new") { const s = newGame({ seed: $("ng-seed").value.trim() || undefined, difficulty: $("ng-diff").value, captain: $("ng-name").value }); startGame(s); return; }
  if (m === "continue") { try { startGame(JSON.parse(store.get())); } catch { toast("That save couldn't be read.", true); } return; }
  if (m === "close") { closeModal(); return; }
  if (m === "help") { showHelp(); return; }
  if (m === "restart") { showStarter(false); return; }
  if (m === "replay") { startGame(newGame({ seed: S.seed, difficulty: S.difficulty, captain: S.captain })); return; }
  if (m === "copy") { const t = $("code"); t.select(); try { navigator.clipboard.writeText(t.value); toast("Copied."); } catch { document.execCommand("copy"); } return; }
  if (m === "load") { try { startGame(JSON.parse(decodeURIComponent(escape(atob($("load").value.trim()))))); } catch { toast("That code didn't load.", true); } return; }
  if (m === "event-ok") { dismissEvent(S); closeModal(); after(); return; }
  if (m === "exchange") { exchange(S, { ...bchoice, order: bchoice.order === "none" ? null : bchoice.order }); save(); renderAll(); showBattle(); return; }
  if (m === "battle-done") { closeBattle(S); bchoice = null; closeModal(); after(); return; }
}
document.addEventListener("change", (e) => {
  if (!S || !S.battle || !bchoice) return;
  const t = e.target;
  if (t.dataset.b) { bchoice[t.dataset.b] = t.checked; showBattle(); }
  if (t.dataset.o) { bchoice.order = t.dataset.o; showBattle(); }
});
let toastTimer = null;
function toast(msg, bad) { const t = $("toast"); t.textContent = msg; t.className = "toast show" + (bad ? " bad" : ""); clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.className = "toast"), 4200); }

boot();

})();
</script>
