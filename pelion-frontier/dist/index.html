<script>
(() => {
"use strict";
// ---- hex.js ----
// Hex grid helpers (axial coordinates, pointy-top) and a seeded random generator.
// Every hex is "q,r"; the map is a hexagon of a given radius around 0,0.

/** A seeded generator (mulberry32): the same seed always builds the same galaxy and rolls the same dice. */
function makeRng(seed) {
  let a = (typeof seed === "number" ? seed : hashString(String(seed))) >>> 0;
  const next = () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  return {
    next,
    int: (n) => Math.floor(next() * n),
    pick: (list) => list[Math.floor(next() * list.length)],
    d6: () => 1 + Math.floor(next() * 6),
    state: () => a,
    setState: (s) => { a = s >>> 0; },
  };
}
function hashString(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

const key = (q, r) => q + "," + r;
const parse = (k) => { const [q, r] = k.split(",").map(Number); return { q, r }; };
const DIRS = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];
const neighbors = (k) => { const { q, r } = parse(k); return DIRS.map(([dq, dr]) => key(q + dq, r + dr)); };
const distance = (a, b) => {
  const A = parse(a), B = parse(b);
  return (Math.abs(A.q - B.q) + Math.abs(A.q + A.r - B.q - B.r) + Math.abs(A.r - B.r)) / 2;
};
/** All hexes of a hexagonal map of this radius. */
function hexagon(radius) {
  const out = [];
  for (let q = -radius; q <= radius; q++)
    for (let r = Math.max(-radius, -q - radius); r <= Math.min(radius, -q + radius); r++) out.push(key(q, r));
  return out;
}
const inMap = (k, radius) => distance(k, "0,0") <= radius;
/** Pixel center of a hex of this size (pointy-top). */
function toPixel(k, size) {
  const { q, r } = parse(k);
  return { x: size * Math.sqrt(3) * (q + r / 2), y: size * 1.5 * r };
}
/** The hex under a pixel. */
function fromPixel(x, y, size) {
  const q = ((Math.sqrt(3) / 3) * x - y / 3) / size, r = ((2 / 3) * y) / size;
  let rx = Math.round(q), rz = Math.round(r), ry = Math.round(-q - r);
  const dx = Math.abs(rx - q), dz = Math.abs(rz - r), dy = Math.abs(ry - (-q - r));
  if (dx > dy && dx > dz) rx = -ry - rz; else if (dz > dy) rz = -rx - ry;
  return key(rx, rz);
}
/** Hexes within n steps of k. */
function within(k, n) {
  const { q, r } = parse(k), out = [];
  for (let dq = -n; dq <= n; dq++)
    for (let dr = Math.max(-n, -dq - n); dr <= Math.min(n, -dq + n); dr++) out.push(key(q + dq, r + dr));
  return out;
}

// ---- data.js ----
// The numbers: the crew (from the Players' Guide's ready-made crew), the ships (from its ship registry and the GM's
// Guide's enemy ships), what the Pelion can do at a system, the mission tables (the GM's Guide's mission seeds),
// refits and library records.

const TOUR = 50;                      // turns in the tour; a turn is a week
const STARDATE0 = 5212.4;             // campaign year 2268

/** The six ready-made crew. Skills are the targets from their sheets. */
const CREW = [
  { id: "shvari", name: "Thelan sh'Vari", short: "sh'Vari", rank: "Lt. Commander", role: "Command", post: "First Officer", species: "Andorian",
    skills: { Leadership: 16, Diplomacy: 14, Helm: 13, Phasers: 13, Navigation: 11, Psychology: 11, Sensors: 11, Communications: 11 },
    adv: "Crisis Leader", advText: "+2 to Leadership and Helm in ship combat.", advWhen: (ctx) => ctx.combat && ["Leadership", "Helm"].includes(ctx.skill) },
  { id: "sevek", name: "Sevek", short: "Sevek", rank: "Lieutenant", role: "Science", post: "Science Officer", species: "Vulcan",
    skills: { "Physical Sciences": 16, Sensors: 14, Computers: 14, "Life Sciences": 14, Navigation: 14, Engineering: 14, Electronics: 14, Psychology: 14 },
    adv: "Eidetic Recall", advText: "+2 when investigating an anomaly or ruins.", advWhen: (ctx) => ctx.action === "investigate" },
  { id: "vessik", name: "Dr. Vessik", short: "Vessik", rank: "Lt. Commander", role: "Medical", post: "Chief Medical Officer", species: "Denobulan",
    skills: { Medicine: 16, "Life Sciences": 14, Psychology: 14, Sensors: 14, Computers: 14, Electronics: 14, Survival: 14, Communications: 14, Diplomacy: 13, Leadership: 13 },
    adv: "Denobulan Pharmacopoeia", advText: "+2 to Medicine.", advWhen: (ctx) => ctx.skill === "Medicine" },
  { id: "grath", name: "Grath", short: "Grath", rank: "Lieutenant", role: "Engineering", post: "Chief Engineer", species: "Tellarite",
    skills: { Engineering: 16, Electronics: 14, Computers: 14, "Physical Sciences": 14, Sensors: 14, Communications: 14, Survival: 14, Helm: 11 },
    adv: "Improvisational Engineer", advText: "+2 to Engineering for repairs.", advWhen: (ctx) => ctx.skill === "Engineering" && (ctx.action === "repair" || ctx.combat) },
  { id: "reyes", name: "Marisol Reyes", short: "Reyes", rank: "Lieutenant (j.g.)", role: "Security", post: "Chief of Security", species: "Human",
    skills: { Phasers: 16, "Unarmed Combat": 14, Stealth: 14, Helm: 14, Athletics: 13, Survival: 11, Sensors: 11, Medicine: 11, Leadership: 11, Communications: 11 },
    adv: "Careful Marksman", advText: "+2 to Phasers on an away team (stun).", advWhen: (ctx) => ctx.skill === "Phasers" && !ctx.combat },
  { id: "rrinn", name: "Rrinn", short: "Rrinn", rank: "Yeoman 2nd Class", role: "General Services", post: "Captain's Yeoman", species: "Caitian",
    skills: { Computers: 18, Communications: 14, Psychology: 14, Sensors: 14, Electronics: 14, Stealth: 13, Diplomacy: 12 },
    adv: "Keen Hearing", advText: "+2 when listening: hailing, and sweeps for cloaked ships and raiders.", advWhen: (ctx) => ctx.action === "sweep" || (ctx.skill === "Communications" && ctx.listen) },
];
/** You, the captain. */
const CAPTAIN = { id: "captain", short: "Captain", skills: { Leadership: 14, Psychology: 13, Diplomacy: 13, Will: 12 } };

// Ships. Systems take 3 boxes each: 1 Damaged (−2), 2 Crippled (−4), 3 Offline.
const PELION = { name: "USS Pelion", reg: "NCC-1750", cls: "Heavy Cruiser", shields: 5, hull: 5, power: 5, maneuver: 3, sensors: 3, phaser: 2, torps: 40, torpBonus: 1, speed: 3 };
const SUPPORT = {
  escort: { name: "Escort", cls: "Escort", cost: 30, shields: 2, hull: 3, maneuver: 5, helm: 12, gunner: 12, phaser: 1, speed: 3, blurb: "Guards a world: fights raiders that come to it, and joins the Pelion's battles." },
  science: { name: "Science vessel", cls: "Science vessel", cost: 25, shields: 2, hull: 3, maneuver: 5, helm: 11, gunner: 10, phaser: 1, speed: 3, skill: 12, blurb: "Surveys and investigates on its own (skill 12, sensors +2)." },
};
const SUPPORT_NAMES = ["USS Kestrel", "USS Calder", "USS Ishikawa", "USS Tamsin", "USS Meridian Rose", "USS Okonkwo", "USS Halvard", "USS Sabre"];
const ENEMIES = {
  kbc: { name: "Klingon battle cruiser", power: "klingon", shields: 5, hull: 5, maneuver: 3, helm: 12, gunner: 12, dmg: 2, torp: true, will: 12, cloak: true, relentless: true, speed: 3 },

// ---- sector.js ----
// The Corvan Sector: a hex map with the Federation's starbase and colonies to the southwest, two Klingon outposts on
// the eastern border, the Romulan Neutral Zone along the top, and between them independent worlds, pre-warp peoples,
// anomalies, ruins and empty systems (one of which hides an Orion pirate base).


const RADIUS = 8;
const px = (k) => toPixel(k, 1);
const inZone = (k) => parse(k).r <= -RADIUS + 1;                 // the top two rows
const nearZone = (k) => parse(k).r === -RADIUS + 2;

function makeSector(seed) {
  const R = makeRng(seed);
  const hexes = {};
  for (const k of hexagon(RADIUS)) hexes[k] = { terrain: inZone(k) ? "zone" : "space" };
  // Nebulae: three clouds, away from the zone.
  const open = Object.keys(hexes).filter((k) => !inZone(k));
  for (let n = 0; n < 3; n++) {
    let c = R.pick(open);
    for (let i = 0; i < 5; i++) {
      if (hexes[c] && !inZone(c)) hexes[c].terrain = "nebula";
      const { q, r } = parse(c), d = [[1, 0], [0, 1], [-1, 1], [-1, 0], [0, -1], [1, -1]][R.int(6)];
      c = key(q + d[0], r + d[1]);
    }
  }
  const systems = {}, sysAt = {};
  const used = [];
  const free = (k, gap = 2) => hexes[k] && !inZone(k) && !sysAt[k] && used.every((u) => distance(u, k) >= gap);
  let names = [...NAMES];
  const take = () => { const i = R.int(names.length); const n = names[i]; names.splice(i, 1); return n; };
  const place = (k, kind, extra = {}) => {
    const id = "s" + (Object.keys(systems).length + 1);
    systems[id] = { id, at: k, kind, name: extra.name || take(), surveyed: false, harm: 0, ...extra };
    sysAt[k] = id; used.push(k);
    return systems[id];
  };
  const pickWhere = (test, gap = 2) => {
    const c = open.filter((k) => free(k, gap) && test(k));
    return c.length ? R.pick(c) : open.find((k) => free(k, 1));
  };
  const P = (k) => px(k);
  // The starbase, southwest; colonies around it.
  const sb = pickWhere((k) => P(k).x < -6 && P(k).y > 4.5 && distance(k, "0,0") >= 6 && distance(k, "0,0") <= 7);
  place(sb, "starbase", { name: "Starbase 23", surveyed: true });
  for (let i = 0; i < 3; i++) place(pickWhere((k) => distance(k, sb) >= 2 && distance(k, sb) <= 5 && P(k).x < 0), "colony", { surveyed: true });
  // Klingon outposts on the eastern edge.
  for (let i = 0; i < 2; i++) place(pickWhere((k) => P(k).x > 8 && Math.abs(P(k).y) < 9, 4), "klingon", { surveyed: true });
  // Corvan II: the first mission, a few days out from the starbase.
  const cv = pickWhere((k) => distance(k, sb) >= 5 && distance(k, sb) <= 7 && P(k).x < 4 && P(k).y > -6);
  names = names.filter((n) => n !== "Corvan");
  place(cv, "prewarp", { name: "Corvan II", ruinsToo: true });
  // Independent worlds in the middle band, where the Federation and the Empire compete for them.
  for (let i = 0; i < 6; i++) place(pickWhere((k) => P(k).x > -6 && P(k).x < 10 && distance(k, sb) >= 5, 3), "independent", { surveyed: true, accord: i < 2 ? 1 : 0 });
  for (let i = 0; i < 3; i++) place(pickWhere(() => true), "prewarp");
  for (let i = 0; i < 5; i++) place(pickWhere(() => true), "anomaly", { clock: 0, need: 3 + R.int(3) });
  for (let i = 0; i < 3; i++) place(pickWhere(() => true), "ruins", { clock: 0, need: 4 + R.int(2) });
  // The Orion base: far from the starbase, in a nebula if one is free.
  const neb = open.filter((k) => hexes[k].terrain === "nebula" && free(k) && distance(k, sb) >= 7);
  place(neb.length ? R.pick(neb) : pickWhere((k) => distance(k, sb) >= 8), "orionBase", { baseHull: 0, baseShields: 0 });
  for (let i = 0; i < 9; i++) place(pickWhere(() => true), "empty");
  // Starfleet's charts: the core's worlds are known; the rest is "uncharted" until surveyed.
  return { hexes, systems, sysAt, starbase: systems[sysAt[sb]].id, corvan: systems[sysAt[cv]].id };
}

// ---------- dice ----------
function rand(S) { const r = makeRng(0); r.setState(S.rng); const v = r.next(); S.rng = r.state(); return v; }

const pick = (S, list) => list[Math.floor(rand(S) * list.length)];
/** A 3d6 check against a target. */
function check(S, target) {
  const dice = [d6(S), d6(S), d6(S)], total = dice[0] + dice[1] + dice[2];
  const success = total <= 4 || (total <= target && total < 17);
  return { dice, total, target, success, margin: target - total };
}

    pelion: { at: sb.at, mp: PELION.speed, acted: false, shields: 0, hull: 0, sys: { weapons: 0, engines: 0, sensors: 0 }, torps: PELION.torps, refits: {}, zoneMarked: false, docked: true },

// ---------- orders ----------

function newOrder(S) {

const closestOutpost = (S, at) => Object.values(S.systems).filter((s) => s.kind === "klingon").sort((a, b) => distance(a.at, at) - distance(b.at, at))[0];

// ---------- support ships ----------
function requisition(S, type) {
  const T = SUPPORT[type];

  if (Object.keys(S.support).length >= 3) return { error: "Starfleet can spare three ships at most." };
  if (S.supplies < T.cost) return { error: `Needs ${T.cost} supplies.` };
  S.supplies -= T.cost;
  const used = Object.values(S.support).map((u) => u.name);
  const name = SUPPORT_NAMES.find((n) => !used.includes(n)) || "USS " + S.nextId;
  const id = "u" + S.nextId++;
  S.support[id] = { id, type, name, at: S.systems[S.starbase].at, mp: 0, acted: true, shields: 0, hull: 0 };
  log(S, `The ${name} (${T.name}) joins the Pelion's command. It's ready next turn.`, "good");
  updateVisibility(S);
  return { ok: true, id };
}

  const R = REFITS[id];
  if (!S.pelion.docked) return { error: "Refits are fitted at Starbase 23." };
  if (S.pelion.refits[id]) return { error: "Already fitted." };
  if (S.science < R.cost) return { error: `Needs ${R.cost} science.` };
  S.science -= R.cost; S.pelion.refits[id] = true;

// ---------- scoring and the end ----------
function score(S) {
  const sys = Object.values(S.systems);
  const parts = [
    ["Worlds joined the Federation", S.joined * 10],
    ["Library records", S.records.length * 6],
    ["Orders carried out", S.done * 4],
    ["Commendations", S.commendations],
    ["Colonies safe", sys.filter((s) => s.kind === "colony").length * 5],
    ["Systems surveyed", sys.filter((s) => s.surveyed && !KINDS[s.kind]?.known && s.id !== S.corvan).length],
    ["Starfleet Command track", -S.command * 4],
    ["Worlds lost to the Klingon Empire", -S.lostWorlds * 8],
    ["Colonies lost", -S.lostColonies * 10],

function rating(total) {

}
function checkEnd(S) {

  else if (S.turn > TOUR) S.over = { win: true, why: "The Pelion's tour of the Corvan Sector is over." };

// ---------- hooks set by the other modules (they import game.js, so they register here) ----------
let startBattleHook = () => {}, arcActionsHook = () => [], arcStepHook = () => "", arcSweepHook = () => {}, arcArriveHook = () => {};

// ---- combat.js ----
// Ship combat, from the Players' Guide's "The USS Pelion": exchanges; Power to spend on shields, phasers and
// torpedoes (and what's left over as a bonus); the captain's order; Helm to evade; Shields before Hull; a concussive
// roll for every hit that reaches the Hull; Engineering to repair mid-fight; a Helm contest to break away.


const shieldsMax = (S) => PELION.shields + (S.pelion.refits.shields ? 1 : 0) + (hasRecord(S, "shield1") ? 1 : 0);

  const gun = gunId ? target(S, gunId, "Phasers", { combat: true }).total + (P.refits.phasers ? 1 : 0) + Math.max(-6, sysPenalty(P.sys.weapons)) : 8;
  const eng = engId ? target(S, engId, "Engineering", { combat: true }).total : 8;

}

function startBattle(S, enemyId, initiator) {

}
registerHooks({ startBattle });

const R = (r) => `${r.total} vs ${r.target}`;

  L.push(`${what} hits: their shields ${E.shields - e.shields}/${E.shields}, hull ${Math.max(0, E.hull - e.hull)}/${E.hull}.`);
}
/** Mark boxes on the Pelion; return whether any reached the hull. */

  L.push(`${what}: shields ${max - P.shields}/${max}, hull ${Math.max(0, PELION.hull - P.hull)}/${PELION.hull}.`);

/** The Players' Guide's concussive system damage table, for a hit that reaches the hull. */

  else if (r <= 10) { P.hull++; t = `hull breach: ${(check(S, 0).total) * 5} crew lost or hurt`; }

/**
 * One exchange. choice: { order: "command"|"read"|"hail"|null, shields, phasers, torps, repair, breakOff }.
 * Returns the exchange's lines; S.battle.over is set when the battle ends.

  } else if (choice.order === "read") {

  }

    if (!r.success) L.push(`Phasers (${R(r)}): miss.`);
    else {
      const ev = E.base ? null : check(S, E.helm + Math.max(0, -md));
      if (ev && ev.success) L.push(`Phasers (${R(r)}): on target, but they evade (${R(ev)}).`);
      else hitEnemy(S, e, PELION.phaser, L, `Phasers (${R(r)})`);
    }
  }
  if (torp) {
    P.torps--;
    const r = check(S, st.gun + hit + PELION.torpBonus);
    if (r.success) hitEnemy(S, e, 2, L, `Photon torpedoes (${R(r)})`); else L.push(`Photon torpedoes (${R(r)}): wide.`);
  }
  for (const u of Object.values(S.support)) {

    const T = SUPPORT[u.type], r = check(S, T.gunner);
    if (r.success && !(E.base ? false : check(S, E.helm).success)) hitEnemy(S, e, T.phaser, L, `The ${u.name}'s phasers (${R(r)})`);

    const r = check(S, E.helm + Math.max(0, -md) + (E.fast ? 2 : 0)), us = check(S, st.helm + Math.max(0, md));

  const volley = (label, dmg, evadable) => {

      const T = SUPPORT[tgt.type];

function step(S, e) {

const kindName = (s) => (s.kind === "claimed" ? "Klingon world" : s.kind === "member" ? "Federation member" : s.kind === "lost" ? "Evacuated colony" : KINDS[s.kind]?.name);

/** The Silence at Corvan II, step by step: done, now, or to come. */
function arcSteps() {
  const A = S.arc, st = A.stage, after = (x) => ["travel", "orbit", "pull", "orions", "caretaker", "done"].indexOf(st) > ["travel", "orbit", "pull", "orions", "caretaker", "done"].indexOf(x);
  const raider = Object.values(S.enemies).find((e) => e.arcRaider), n = cluesFound(A);
  const steps = [
    ["Reach Corvan II", st !== "travel"],
    [raider && raider.hidden ? "Check the space around Corvan II: a Sensor sweep (an unseen ship would strike within a day)" : "Deal with the Orion raider (warn it off, or fight)", !raider, true],
    ["Sweep the ruins with the ship's sensors", after("orbit")],
    ["Beam down an away team", !!A.team || after("caretaker") || !!A.podsSeen],
    [`Find clues: ${n} of ${CLOCK} (Sevek needs ${THEORY_AT})`, n >= THEORY_AT || !!A.theory],
    ["Sevek's theory: what's in the ruins", !!A.theory],
    ["Stop the Orion diggers in the ruins", !!A.podsSeen],
    ["Decide the caretaker's fate", st === "done"],
  ];
  // Only what's been done and what's next: later steps stay hidden until the one before is achieved. The raider (optional)
  // shows once the Pelion is at Corvan II.
  const current = steps.findIndex(([, done, optional]) => !done && !optional);
  const shown = steps.map(([t, done, optional], i) => [t, done, !!optional, i]).filter(([, done, optional, i]) => done || i === current || (optional && st !== "travel"));
  return `<ol class="steps-list">${shown.map(([t, done, optional, i]) => `<li class="${done ? "done" : i === current ? "now" : ""}"><span>${done ? "✓" : i === current ? "▶" : "·"}<\/span>${esc(t)}<\/li>`).join("")}<\/ol>`
    + (current >= 0 && current < steps.length - 1 ? `<p class="small muted" style="margin:4px 0 0">Further steps are revealed as you go.<\/p>` : "");
}

  const chip = (k, label, dis) => `<label class="chip ${dis ? "off" : ""}"><input type="checkbox" data-b="${k}" ${bchoice[k] ? "checked" : ""} ${dis ? "disabled" : ""}>${label}<\/label>`;
  const ord = (k, label) => `<label class="chip"><input type="radio" name="ord" data-o="${k}" ${bchoice.order === k ? "checked" : ""}>${label}<\/label>`;
  const who = (id) => (id ? esc(officer(id).short) : "nobody");
  const over = B.over;
  modal(`<h2>Battle${E ? `: ${esc(E.base ? "the Orion base" : E.name)}` : ""}<\/h2>
  <div class="battle">
    <div class="ship-card"><h4 class="gold">USS Pelion<\/h4>
      <div class="track"><span>Shields<\/span>${boxes(sm - P.shields, sm, "blue")}<\/div><div class="track"><span>Hull<\/span>${boxes(PELION.hull - P.hull, PELION.hull, "gold")}<\/div>
      <div class="track"><span>Systems<\/span>Weapons ${P.sys.weapons} · Engines ${P.sys.engines} · Sensors ${P.sys.sensors}<\/div>
      <div class="small muted">Helm ${who(st.helmId)} ${st.helm} · Tactical ${who(st.gunId)} ${st.gun} · Engineering ${who(st.engId)} ${st.eng} · Power ${st.power} · Torpedoes ${P.torps}<\/div><\/div>
    ${E ? `<div class="ship-card"><h4 style="color:${POWERS[e.power].color}">${esc(E.base ? "Orion pirate base" : E.name)}<\/h4>
      <div class="track"><span>Shields<\/span>${boxes(E.shields - e.shields, E.shields, "blue")}<\/div><div class="track"><span>Hull<\/span>${boxes(Math.max(0, E.hull - e.hull), E.hull, "gold")}<\/div>
      <div class="small muted">Helm ${E.helm} · Gunner ${E.gunner} · Maneuver ${E.maneuver} vs your ${st.maneuver}${E.plasma ? " · Plasma torpedo: +2 to evade it" : ""}${E.relentless ? " · Relentless" : ""}${E.fast ? " · Fast: runs when its shields fall" : ""}<\/div><\/div>` : `<div class="ship-card"><h4>Gone<\/h4><\/div>`}
  <\/div>
  ${over ? `<div class="result ${over === "destroyed" || over === "hailed" || over === "escaped" || over === "fled" ? "ok" : "no"}"><b>${{ destroyed: "Destroyed.", fled: "They broke off.", hailed: "They stood down.", escaped: "The Pelion broke away.", lost: "The Pelion is lost." }[over]}<\/b><\/div><div class="btn-row"><button class="btn primary" data-m="battle-done">Continue<\/button><\/div>`
  : `<h3>The captain's order<\/h3><div class="orders-choice">${ord("command", `Command (Leadership ${CAPTAIN.skills.Leadership}, ${pct(CAPTAIN.skills.Leadership)}): +2 to Tactical`)}${ord("read", `Read the enemy (Psychology ${CAPTAIN.skills.Psychology}): +2 evade, +1 to hit`)}${E && !E.base && e.power !== "romulan" ? ord("hail", `Hail (Diplomacy ${CAPTAIN.skills.Diplomacy} vs Will ${E.will}): they may stand down`) : ""}${ord("none", "No order")}<\/div>
  <h3>Power: ${st.power} · ${used} spent · ${spare ? `+${Math.min(2, spare)} to ${bchoice.phasers && !bchoice.breakOff ? "phasers" : "evade"}` : "nothing spare"}<\/h3>
  <div class="orders-choice">${chip("shields", "Shields up")}${chip("phasers", `Phasers (${st.gun}, ${pct(st.gun)})`, st.weaponsOut || bchoice.breakOff)}${chip("torps", `Torpedoes (${st.gun + 1}; can't be evaded)`, !P.torps || st.weaponsOut || bchoice.breakOff)}${chip("repair", `Damage control (${st.eng})`)}${chip("breakOff", `Break away (Helm ${st.helm}): instead of firing`)}<\/div>
  <div class="btn-row"><button class="btn primary" data-m="exchange">Next exchange<\/button><\/div>`}
  <div class="blog">${B.log.slice().reverse().map((l) => `<div>${esc(l)}<\/div>`).join("") || `<span class="muted">${B.ambush ? "They decloak, firing." : "Both ships close. Your orders, Captain?"}<\/span>`}<\/div>`);
}
function showEnd() {
  const sc = score(S);
  modal(`<h1>${S.over.win ? "The tour is over" : "Relieved"}<\/h1><p class="lede">${esc(S.over.why)}<\/p>
  <h3>${esc(rating(sc.total))}<\/h3><table class="tbl">${sc.parts.map(([n, v]) => `<tr><td>${esc(n)}<\/td><td style="text-align:right">${v}<\/td><\/tr>`).join("")}<tr><td><b>Total<\/b><\/td><td style="text-align:right"><b>${sc.total}<\/b><\/td><\/tr><\/table>
  <p class="small muted" style="margin-top:10px">This sector's seed: <span class="seed">${esc(S.seed)}<\/span><\/p>
  <div class="btn-row"><button class="btn primary" data-m="restart">New tour<\/button><button class="btn" data-m="replay">Replay this sector<\/button><button class="btn" data-m="close">Look at the map<\/button><\/div>`);
}
function modalClick(e) {
  const b = e.target.closest("button"); if (!b) return;
  const m = b.dataset.m;
  if (b.dataset.ev) {
    const since = mark(), title = b.textContent.trim();
    eventResult = chooseEvent(S, b.dataset.ev);
    // While the arrival is still open (a scan), its own dialog shows the result; once it ends, a pop-up says what happened.
    if (!S.event || S.event.kind !== "arc-arrive") {
      const out = eventResult || {}; eventResult = null; report = null;
      reportSince(title, since, out.roll);
      if (out.text) { report = report || { title, roll: out.roll, lines: [] }; report.lines.unshift(out.text); }
    }
    after(); if (!report && !S.event && !S.battle && !S.over) closeModal(); return;
  }
  if (m === "report-ok") { report = null; closeModal(); after(); return; }
  if (m === "new") { const s = newGame({ seed: $("ng-seed").value.trim() || undefined, difficulty: $("ng-diff").value, captain: $("ng-name").value }); startGame(s); return; }
  if (m === "continue") { try { startGame(JSON.parse(store.get())); } catch { toast("That save couldn't be read.", true); } return; }
  if (m === "close") { closeModal(); return; }
  if (m === "help") { showHelp(); return; }
  if (m === "restart") { showStarter(false); return; }
  if (m === "replay") { startGame(newGame({ seed: S.seed, difficulty: S.difficulty, captain: S.captain })); return; }
  if (m === "copy") { const t = $("code"); t.select(); try { navigator.clipboard.writeText(t.value); toast("Copied."); } catch { document.execCommand("copy"); } return; }
  if (m === "load") { try { startGame(JSON.parse(decodeURIComponent(escape(atob($("load").value.trim()))))); } catch { toast("That code didn't load.", true); } return; }
  if (m === "event-ok") { dismissEvent(S); closeModal(); after(); return; }
  if (m === "exchange") { exchange(S, { ...bchoice, order: bchoice.order === "none" ? null : bchoice.order }); save(); renderAll(); showBattle(); return; }
  if (m === "battle-done") { closeBattle(S); bchoice = null; closeModal(); after(); return; }
}
document.addEventListener("change", (e) => {
  if (!S || !S.battle || !bchoice) return;
  const t = e.target;
  if (t.dataset.b) { bchoice[t.dataset.b] = t.checked; showBattle(); }
  if (t.dataset.o) { bchoice.order = t.dataset.o; showBattle(); }
});
let toastTimer = null;
function toast(msg, bad) { const t = $("toast"); t.textContent = msg; t.className = "toast show" + (bad ? " bad" : ""); clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.className = "toast"), 4200); }

boot();

})();
</script>
