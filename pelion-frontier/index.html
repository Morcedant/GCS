<title>USS Pelion: Frontier</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A turn-based hex strategy game for the USS Pelion fan game: command the Pelion on a tour of a frontier sector.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@500;700&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* A bridge console: the sector map fills the screen, a status bar runs across the top, and the side panel holds what's
   here, the ship, the crew, the orders, the sector and the log. One dark look, in the divisions' gold, blue and red. */
:root { color-scheme: dark;
  --bg: #07080d; --panel: #10121c; --panel-2: #181b29; --line: rgba(160, 170, 210, .2); --ink: #e6e8f2; --muted: #9aa0b8;
  --gold: #f2c14e; --gold-ink: #1a1405; --blue: #6fb4ff; --red: #e0564a; --green: #7bc47f; --violet: #c9a8ff;
  --display: "Antonio", "Arial Narrow", system-ui, sans-serif; --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--body); margin: 0; overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
button { font: inherit; color: inherit; }
#app { position: fixed; inset: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px) 0; display: grid; grid-template-rows: auto 1fr; grid-template-columns: 1fr 400px; }
#app[hidden] { display: none; }
.bar { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 8px max(14px, env(safe-area-inset-right, 0px)) 8px max(14px, env(safe-area-inset-left, 0px)); background: var(--panel); border-bottom: 3px solid var(--gold); }
#bar-ship { font: 700 18px var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--gold); }
#bar-stats { display: flex; flex-wrap: wrap; gap: 4px 16px; flex: 1 1 auto; min-width: 0; font-variant-numeric: tabular-nums; align-items: center; }
#bar-stats b { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; margin-right: 5px; }
#bar-turn { font: 600 14px var(--display); color: var(--muted); letter-spacing: .04em; }
.boxes { display: inline-flex; gap: 3px; vertical-align: -2px; } .boxes i { width: 11px; height: 11px; border: 1.5px solid var(--muted); border-radius: 2px; display: inline-block; }
.boxes i.on { background: var(--red); border-color: var(--red); } .boxes.blue i.on { background: var(--blue); border-color: var(--blue); } .boxes.gold i.on { background: var(--gold); border-color: var(--gold); }
.map-wrap { position: relative; min-width: 0; min-height: 0; }
#map { width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
.map-tools { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 12px; display: flex; gap: 6px; }
.map-tools button[hidden], .map-hint[hidden] { display: none; }
.map-tools button { min-width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--line); background: rgba(16, 18, 28, .92); cursor: pointer; font-size: 16px; padding: 0 10px; }
.map-hint { position: absolute; right: 12px; bottom: 12px; font-size: 12px; color: var(--muted); background: rgba(16, 18, 28, .85); padding: 5px 9px; border-radius: 6px; pointer-events: none; }
.side { background: var(--panel); border-left: 1px solid var(--line); display: grid; grid-template-rows: auto 1fr auto; min-height: 0; }
.tabs { display: flex; flex-wrap: wrap; gap: 2px; padding: 8px 10px 0; border-bottom: 1px solid var(--line); }
.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 6px 6px; cursor: pointer; color: var(--muted); font: 600 14px var(--display); letter-spacing: .04em; text-transform: uppercase; }
.tabs button[hidden] { display: none; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--gold); }
.tabs button .badge { background: var(--red); color: #fff; border-radius: 8px; font: 700 10px var(--body); padding: 1px 5px; margin-left: 4px; vertical-align: 2px; }
#panel { overflow-y: auto; padding: 12px 14px 20px; min-height: 0; }
.side-foot { padding: 10px 14px; border-top: 1px solid var(--line); display: flex; gap: 8px; }
h1, h2, h3 { font-family: var(--display); letter-spacing: .04em; margin: 0; text-wrap: balance; }
h1 { font-size: 30px; margin-bottom: 8px; text-transform: uppercase; } h2 { font-size: 21px; margin-bottom: 4px; text-transform: uppercase; }
h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .14em; color: var(--gold); margin: 16px 0 6px; }
p { margin: 0 0 8px; } .muted { color: var(--muted); } .small { font-size: 12px; } .bad { color: #ff9a8f; } .good { color: var(--green); } .gold { color: var(--gold); }
.btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 18px; padding: 8px 14px; cursor: pointer; font-weight: 600; }
.btn:hover:not(:disabled) { border-color: var(--gold); }
.btn.primary { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); }
.btn.red { background: var(--red); border-color: var(--red); color: #fff; }
.btn.small { padding: 5px 11px; font-size: 12px; } .btn.wide { width: 100%; margin-top: 6px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
#end-turn { flex: 1; font: 700 17px var(--display); letter-spacing: .1em; text-transform: uppercase; padding: 10px; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.card { background: var(--panel-2); border-radius: 10px; padding: 10px 12px; margin: 8px 0; border-left: 4px solid var(--blue); }
.card.gold { border-left-color: var(--gold); color: var(--ink); } .card.red { border-left-color: var(--red); } .card.green { border-left-color: var(--green); } .card.violet { border-left-color: var(--violet); }
.card h4 { margin: 0 0 4px; font: 700 16px var(--display); letter-spacing: .04em; text-transform: uppercase; }
.card .why { color: #ffb0a6; font-size: 12px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; align-items: center; font-variant-numeric: tabular-nums; }
.kv span:nth-child(odd) { color: var(--muted); }
.roll-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; }
select, input[type=text], textarea { background: #0b0d16; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; font: inherit; max-width: 100%; }
textarea { width: 100%; box-sizing: border-box; font: 12px ui-monospace, monospace; }
.dice { display: inline-flex; gap: 4px; } .die { width: 26px; height: 26px; border-radius: 6px; background: #f3efe2; color: #111; display: inline-grid; place-items: center; font-weight: 700; }
.result { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 8px 0; background: #0c0e17; }
.result.ok { border-color: rgba(123, 196, 127, .6); } .result.no { border-color: rgba(224, 86, 74, .6); }
.parts { font-size: 12px; color: var(--muted); margin: 4px 0; }
.tbl { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; }
.tbl th { text-align: left; color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; padding: 4px; border-bottom: 1px solid var(--line); }
.tbl td { padding: 5px 4px; border-bottom: 1px solid rgba(160,170,210,.08); vertical-align: top; } .tbl tr[data-hex] { cursor: pointer; } .tbl tr[data-hex]:hover td { background: var(--panel-2); }
.meter { display: block; height: 6px; background: rgba(255,255,255,.08); border-radius: 3px; overflow: hidden; margin: 4px 0; } .meter > span { display: block; height: 100%; }
.crew { display: grid; gap: 8px; }
.officer { background: var(--panel-2); border-radius: 10px; padding: 10px 12px; border-left: 4px solid var(--gold); }
.officer.sci { border-left-color: var(--blue); } .officer.ops { border-left-color: var(--red); }
.officer h4 { margin: 0; font: 700 16px var(--display); letter-spacing: .04em; text-transform: uppercase; }
.skills { display: flex; flex-wrap: wrap; gap: 3px 10px; font-size: 12px; color: var(--muted); margin-top: 4px; } .skills b { color: var(--ink); font-weight: 600; }
.log { list-style: none; padding: 0; margin: 0; display: grid; gap: 5px; font-size: 13px; }
.log li { white-space: pre-line; } .log .t { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 8px; } .log .war { color: #ffb0a6; } .log .bad { color: #ffb0a6; } .log .good { color: #b9e5bb; } .log .victory { color: var(--gold); } .log .order { color: #a8d4ff; } .log .turn, .log .move { color: var(--muted); } h3.log-turn { margin: 14px 0 6px; border-bottom: 1px solid var(--line); padding-bottom: 3px; } .log .discovery { color: #e2d1ff; border-left: 3px solid var(--violet); padding-left: 8px; }
#modal { position: fixed; inset: 0; background: rgba(3, 4, 8, .84); display: grid; place-items: center; z-index: 20; padding: 16px; overflow-y: auto; }
#modal[hidden] { display: none; }
.modal-box { background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--gold); border-radius: 14px; max-width: 760px; width: 100%; box-sizing: border-box; padding: 22px max(16px, env(safe-area-inset-right, 0px)) 22px max(16px, env(safe-area-inset-left, 0px)); box-shadow: 0 30px 80px rgba(0,0,0,.6); }
.modal-box h1 { font-size: clamp(26px, 5vw, 40px); color: var(--gold); }
.lede { color: var(--muted); font-size: 15px; max-width: 62ch; }
.ng-row { display: flex; flex-wrap: wrap; gap: 12px; margin: 14px 0 4px; }
.ng-row label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.seed { font: 700 22px var(--display); letter-spacing: .08em; color: var(--gold); user-select: all; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; margin: 14px 0; }
.brief { background: var(--panel-2); border-radius: 10px; padding: 12px; border-top: 3px solid var(--blue); } .brief h3 { margin-top: 0; } .brief p { font-size: 13px; color: #cfd3e3; margin: 0; }
.brief:nth-child(3n+1) { border-top-color: var(--gold); } .brief:nth-child(3n+3) { border-top-color: var(--red); }
/* The battle */
.battle { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 640px) { .battle { grid-template-columns: 1fr; } }
.ship-card { background: var(--panel-2); border-radius: 10px; padding: 10px 12px; }
.ship-card h4 { margin: 0 0 6px; font: 700 16px var(--display); text-transform: uppercase; letter-spacing: .04em; }
.track { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin: 3px 0; } .track span:first-child { width: 72px; }
.orders-choice { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 16px; padding: 6px 11px; cursor: pointer; font-size: 13px; }
.chip:has(input:checked) { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; } .chip input { accent-color: var(--gold); margin: 0; }
.chip.off { opacity: .45; }
.blog { max-height: 220px; overflow-y: auto; font-size: 13px; background: #0b0d16; border-radius: 8px; padding: 8px 10px; margin-top: 10px; display: grid; gap: 3px; }
.toast { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); max-width: min(560px, calc(100vw - 32px)); background: #1c2033; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; opacity: 0; pointer-events: none; transition: .25s; z-index: 30; }
.toast.show { opacity: 1; transform: translate(-50%, 0); } .toast.bad { border-color: var(--red); }
@media (max-width: 820px) {
  #app { grid-template-columns: 1fr; grid-template-rows: auto minmax(260px, 52vh) 1fr; }
  .side { border-left: 0; border-top: 1px solid var(--line); }
  body { overflow: auto; } .map-hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

<div id="app" hidden>
  <header class="bar">
    <span id="bar-ship">USS Pelion</span>
    <span id="bar-stats"></span>
    <span id="bar-turn"></span>
    <button class="btn small" id="menu">Menu</button>
  </header>
  <div class="map-wrap">
    <canvas id="map" aria-label="The Corvan Sector"></canvas>
    <div class="map-tools"><button id="zoom-in" aria-label="Zoom in">+</button><button id="zoom-out" aria-label="Zoom out">−</button><button id="find" aria-label="Center on the Pelion">Pelion</button><button id="fit" aria-label="Show the whole sector">Sector</button><button id="surface" hidden>Corvan II surface</button></div>
    <div class="map-hint">Click a hex to look · double-click (or right-click) to move there</div>
  </div>
  <aside class="side">
    <nav class="tabs" role="tablist"><button data-tab="orders" role="tab">Orders</button><button data-tab="away" role="tab" hidden>Away team</button><button data-tab="here" role="tab">Here</button><button data-tab="ship" role="tab">Ship</button><button data-tab="crew" role="tab">Crew</button><button data-tab="sector" role="tab">Sector</button><button data-tab="log" role="tab">Log</button></nav>
    <div id="panel"></div>
    <div class="side-foot"><button class="btn primary" id="end-turn">End turn</button></div>
  </aside>
</div>
<div id="modal" hidden><div class="modal-box" id="modal-body"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* APP */
</script>
