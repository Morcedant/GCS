<title>Fracture Lines: Dominion</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A turn-based 4X strategy game in the Fracture Lines setting: explore a hex galaxy, settle worlds, research, trade and fight.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* Layout: a command console. The star map fills the screen; a turn bar runs across the top; the side panel holds the
   selected world or fleet, the empire, research, diplomacy and the log. Deliberately one dark look: a starfield. */
:root { color-scheme: dark;
  --bg: #070a12; --panel: #0e1424; --panel-2: #141c31; --line: rgba(130, 160, 220, .2); --ink: #dfe7f7; --muted: #8e9ab4;
  --accent: #5ec8e0; --accent-ink: #04141a; --gold: #f0c85a; --exo: #d9a8ff; --bad: #ff7a6b; --good: #7bc47f;
  --display: "Chakra Petch", "Segoe UI", system-ui, sans-serif; --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--body); margin: 0; overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
button { font: inherit; color: inherit; }
#app { position: fixed; inset: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px) 0; display: grid; grid-template-rows: auto 1fr; grid-template-columns: 1fr 380px; }
#app[hidden] { display: none; }
.bar { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 8px max(14px, env(safe-area-inset-right, 0px)) 8px max(14px, env(safe-area-inset-left, 0px)); background: var(--panel); border-bottom: 1px solid var(--line); }
#bar-faction { font: 700 15px var(--display); letter-spacing: .04em; display: flex; align-items: center; gap: 8px; }
#bar-stats { display: flex; flex-wrap: wrap; gap: 4px 16px; flex: 1 1 auto; min-width: 0; font-variant-numeric: tabular-nums; }
#bar-stats b { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; margin-right: 4px; }
#bar-stats i { font-style: normal; color: var(--good); } #bar-stats i.neg { color: var(--bad); }
#bar-turn { font: 600 13px var(--display); color: var(--muted); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; box-shadow: 0 0 0 1px rgba(0,0,0,.6); }
.map-wrap { position: relative; min-width: 0; min-height: 0; }
#map { width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
.map-tools { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 12px; display: flex; gap: 6px; }
.map-tools button { width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--line); background: rgba(14, 20, 36, .9); cursor: pointer; font-size: 18px; }
.side { background: var(--panel); border-left: 1px solid var(--line); display: grid; grid-template-rows: auto auto 1fr auto; min-height: 0; }
.tabs { display: flex; flex-wrap: wrap; gap: 2px; padding: 8px 10px 0; border-bottom: 1px solid var(--line); }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 8px; cursor: pointer; color: var(--muted); font: 600 13px var(--display); letter-spacing: .03em; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
#panel { overflow-y: auto; padding: 12px 14px 20px; min-height: 0; }
.side-foot { padding: 10px 14px; border-top: 1px solid var(--line); display: flex; gap: 8px; }
h1, h2, h3 { font-family: var(--display); letter-spacing: .03em; margin: 0; text-wrap: balance; }
h1 { font-size: 28px; margin-bottom: 8px; } h2 { font-size: 18px; margin-bottom: 6px; display: flex; align-items: center; }
h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 16px 0 6px; }
p { margin: 0 0 8px; } .muted { color: var(--muted); } .small { font-size: 12px; } .bad { color: var(--bad); } .exo { color: var(--exo); } .gold { color: var(--gold); }
.btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 600; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { border-color: rgba(255, 122, 107, .6); color: var(--bad); }
.btn.small { padding: 5px 10px; font-size: 12px; } .btn.wide { width: 100%; margin-top: 6px; }
.btn:disabled { opacity: .5; cursor: default; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; } .btn-row.col { flex-direction: column; align-items: stretch; }
#end-turn { flex: 1; font: 700 15px var(--display); letter-spacing: .06em; padding: 11px; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.meter { display: block; height: 6px; background: rgba(255,255,255,.08); border-radius: 3px; overflow: hidden; margin: 4px 0; }
.meter > span { display: block; height: 100%; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 0 10px; align-items: center; } .kv .meter { grid-column: 1 / -1; }
.yields { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 6px 0 8px; font-variant-numeric: tabular-nums; } .yields span { color: var(--muted); } .yields b { color: var(--ink); }
.queue { list-style: none; padding: 0; margin: 0 0 8px; display: grid; gap: 6px; }
.queue li { display: grid; grid-template-columns: 1fr auto auto; gap: 0 8px; align-items: center; background: var(--panel-2); border-radius: 6px; padding: 6px 8px; }
.queue li .meter { grid-column: 1 / -1; order: 3; }
.x { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 16px; }
.opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.opt { display: flex; justify-content: space-between; gap: 6px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; cursor: pointer; text-align: left; }
.opt:hover { border-color: var(--accent); } .opt span { color: var(--muted); font-variant-numeric: tabular-nums; }
.row { display: flex; align-items: center; gap: 4px; width: 100%; text-align: left; background: var(--panel-2); border: 1px solid transparent; border-radius: 6px; padding: 6px 8px; margin: 4px 0; cursor: pointer; }
.row:hover { border-color: var(--accent); }
.ships { list-style: none; padding: 0; margin: 6px 0; display: grid; gap: 6px; }
.ships li { display: grid; grid-template-columns: 1fr auto auto; gap: 0 8px; align-items: center; } .ships li .meter { grid-column: 1 / -1; }
.tbl { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; }
.tbl th { text-align: left; color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; padding: 4px; border-bottom: 1px solid var(--line); }
.tbl td { padding: 5px 4px; border-bottom: 1px solid rgba(130,160,220,.08); } .tbl tr[data-selsys] { cursor: pointer; } .tbl tr[data-selsys]:hover td { background: var(--panel-2); }
.techs { display: grid; gap: 6px; }
.tech { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; text-align: left; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; cursor: pointer; }
.tech small { grid-column: 1 / -1; color: var(--muted); } .tech span { color: var(--muted); font-variant-numeric: tabular-nums; }
.tech.done { opacity: .55; cursor: default; } .tech.locked { opacity: .45; cursor: default; } .tech.can:hover { border-color: var(--accent); }
.tech.cur { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; }
.dip, .offer { background: var(--panel-2); border-radius: 8px; padding: 10px 12px; margin: 8px 0; } .dip h3 { margin: 0 0 4px; color: var(--ink); text-transform: none; letter-spacing: .02em; font-size: 15px; }
.offer { border: 1px solid var(--gold); }
.log { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; font-size: 13px; }
.log .t { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 8px; } .log .war { color: #ffb0a6; } .log .victory { color: var(--gold); } .log .research { color: #a8e0ff; }
#modal { position: fixed; inset: 0; background: rgba(3, 5, 10, .82); display: grid; place-items: center; z-index: 20; padding: 16px; overflow-y: auto; }
#modal[hidden] { display: none; }
.modal-box { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; max-width: 760px; width: 100%; padding: 22px max(16px, env(safe-area-inset-right, 0px)) 22px max(16px, env(safe-area-inset-left, 0px)); box-shadow: 0 30px 80px rgba(0,0,0,.6); }
.modal-box h1 { font-size: clamp(24px, 5vw, 36px); background: linear-gradient(90deg, #a8e8ff, #f0c85a); -webkit-background-clip: text; background-clip: text; color: transparent; }
.lede { color: var(--muted); font-size: 15px; max-width: 60ch; }
.factions { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 8px; }
.fac { display: flex; gap: 8px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; cursor: pointer; }
.fac:has(input:checked) { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.fac small { display: block; color: var(--muted); margin-top: 4px; }
.ng-row { display: flex; flex-wrap: wrap; gap: 12px; margin: 14px 0 4px; }
.ng-row label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
select, input[type=text], textarea { background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; font: inherit; }
textarea { width: 100%; box-sizing: border-box; font: 12px ui-monospace, monospace; }
.seedbox { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); } .seedbox h3 { margin-top: 0; }
.seed { font: 700 22px var(--display); letter-spacing: .06em; color: var(--gold); user-select: all; font-variant-numeric: tabular-nums; }
/* First steps and the starter guide */
#steps { margin: 10px 12px 0; padding: 10px 12px; border: 1px solid rgba(123, 196, 127, .45); border-radius: 10px; background: rgba(123, 196, 127, .07); }
.steps-head { display: flex; align-items: center; gap: 8px; } .steps-head b { font-family: var(--display); letter-spacing: .04em; flex: 1; }
.steps { list-style: none; padding: 0; margin: 6px 0 0; display: grid; gap: 4px; font-size: 13px; }
.steps li { display: flex; align-items: center; gap: 8px; color: var(--muted); } .steps li > span { width: 16px; color: var(--good); font-weight: 700; }
.steps li.now { color: var(--ink); font-weight: 600; } .steps li.done { text-decoration: line-through; text-decoration-color: rgba(142,154,180,.5); }
.steps .btn { margin-left: auto; text-decoration: none; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(240, 200, 90, 0); } 50% { box-shadow: 0 0 0 6px rgba(240, 200, 90, .55); } }
.pulse { animation: pulse .8s ease-in-out 3; }
.starter .sg-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; margin: 16px 0; }
.sg-card { display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: start; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-width: 0; }
.sg-card h3 { margin: 0 0 4px; color: var(--ink); text-transform: none; letter-spacing: .02em; font-size: 15px; } .sg-card p { margin: 0; font-size: 13px; color: #c6d0e6; }
.sg-icon svg { width: 52px; height: 52px; display: block; }
.sg-keys { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin: 0 0 6px; }
kbd { font: 600 11px var(--body); background: var(--panel-2); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 1px 6px; color: var(--ink); margin-right: 4px; }
.btn.big { font: 700 16px var(--display); letter-spacing: .04em; padding: 12px 20px; }
.check-line { display: flex; align-items: center; gap: 8px; margin-top: 10px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; outline: 2px solid var(--gold); } }
.help { padding-left: 18px; display: grid; gap: 6px; color: #c6d0e6; }
.toast { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); max-width: min(560px, calc(100vw - 32px)); background: #1b2440; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; opacity: 0; pointer-events: none; transition: .25s; z-index: 30; }
.toast.show { opacity: 1; transform: translate(-50%, 0); } .toast.bad { border-color: var(--bad); }
@media (max-width: 820px) {
  #app { grid-template-columns: 1fr; grid-template-rows: auto minmax(260px, 55vh) 1fr; }
  .side { border-left: 0; border-top: 1px solid var(--line); }
  body { overflow: auto; }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

<div id="app" hidden>
  <header class="bar">
    <span id="bar-faction"></span>
    <span id="bar-stats"></span>
    <span id="bar-turn"></span>
    <button class="btn small" id="menu">Menu</button>
  </header>
  <div class="map-wrap">
    <canvas id="map" aria-label="The galaxy map"></canvas>
    <div class="map-tools"><button id="zoom-in" aria-label="Zoom in">+</button><button id="zoom-out" aria-label="Zoom out">−</button><button id="home" aria-label="Center on your capital">⌂</button></div>
  </div>
  <aside class="side">
    <nav class="tabs" role="tablist"><button data-tab="selected" role="tab">Selected</button><button data-tab="empire" role="tab">Empire</button><button data-tab="research" role="tab">Research</button><button data-tab="diplomacy" role="tab">Diplomacy</button><button data-tab="log" role="tab">Log</button></nav>
    <div id="steps" hidden></div>
    <div id="panel"></div>
    <div class="side-foot"><button class="btn" id="next">Next</button><button class="btn primary" id="end-turn">End turn</button></div>
  </aside>
</div>
<div id="modal" hidden><div class="modal-box" id="modal-body"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* APP */
</script>
