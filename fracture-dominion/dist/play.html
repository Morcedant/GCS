// Hex grid helpers (axial coordinates, pointy-top) and a seeded random generator.
// Every hex is "q,r"; the map is a hexagon of a given radius around 0,0.

/** A seeded generator (mulberry32): the same seed always builds the same galaxy and rolls the same dice. */
function makeRng(seed) {
  let a = (typeof seed === "number" ? seed : hashString(String(seed))) >>> 0;
  const next = () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  return {
    next,
    int: (n) => Math.floor(next() * n),
    pick: (list) => list[Math.floor(next() * list.length)],
    d6: () => 1 + Math.floor(next() * 6),
    state: () => a,
    setState: (s) => { a = s >>> 0; },
  };
}
function hashString(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

const key = (q, r) => q + "," + r;
const parse = (k) => { const [q, r] = k.split(",").map(Number); return { q, r }; };
const DIRS = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];
const neighbors = (k) => { const { q, r } = parse(k); return DIRS.map(([dq, dr]) => key(q + dq, r + dr)); };
// Distances are asked for constantly: each hex key's coordinates are read once and kept.
const HEX_QR = new Map();
const qrOf = (k) => { let v = HEX_QR.get(k); if (!v) { const i = k.indexOf(","); v = [+k.slice(0, i), +k.slice(i + 1)]; if (HEX_QR.size < 200000) HEX_QR.set(k, v); } return v; };
const distance = (a, b) => {
  const A = qrOf(a), B = qrOf(b);
  return (Math.abs(A[0] - B[0]) + Math.abs(A[0] + A[1] - B[0] - B[1]) + Math.abs(A[1] - B[1])) / 2;
};
/** All hexes of a hexagonal map of this radius. */
function hexagon(radius) {
  const out = [];
  for (let q = -radius; q <= radius; q++)
    for (let r = Math.max(-radius, -q - radius); r <= Math.min(radius, -q + radius); r++) out.push(key(q, r));
  return out;
}
const inMap = (k, radius) => distance(k, "0,0") <= radius;
/** Pixel center of a hex of this size (pointy-top). */
function toPixel(k, size) {
  const { q, r } = parse(k);
  return { x: size * Math.sqrt(3) * (q + r / 2), y: size * 1.5 * r };
}
/** The hex under a pixel. */
function fromPixel(x, y, size) {
  const q = ((Math.sqrt(3) / 3) * x - y / 3) / size, r = ((2 / 3) * y) / size;
  let rx = Math.round(q), rz = Math.round(r), ry = Math.round(-q - r);
  const dx = Math.abs(rx - q), dz = Math.abs(rz - r), dy = Math.abs(ry - (-q - r));
  if (dx > dy && dx > dz) rx = -ry - rz; else if (dz > dy) rz = -rx - ry;
  return key(rx, rz);
}
/** Hexes within n steps of k. */
function within(k, n) {
  const { q, r } = parse(k), out = [];
  for (let dq = -n; dq <= n; dq++)
    for (let dr = Math.max(-n, -dq - n); dr <= Math.min(n, -dq + n); dr++) out.push(key(q + dq, r + dr));
  return out;
}
/** The hexes on a straight line from a to b, both ends included. */
function hexLine(a, b) {
  const A = parse(a), B = parse(b), n = distance(a, b), out = [];
  for (let i = 0; i <= n; i++) {
    const t = n ? i / n : 0, q = A.q + (B.q - A.q) * t + 1e-6, r = A.r + (B.r - A.r) * t + 1e-6, sv = -q - r;
    let rq = Math.round(q), rr = Math.round(r); const rs = Math.round(sv);
    const dq = Math.abs(rq - q), dr = Math.abs(rr - r), ds = Math.abs(rs - sv);
    if (dq > dr && dq > ds) rq = -rr - rs; else if (dr > ds) rr = -rq - rs;
    out.push(key(rq, rr));
  }
  return out;
}

/** A people's portrait as an <svg> (size in px), or "" if there's none. */
function portraitSVG(id, color, size = 64) {
  const p = PORTRAIT[id]; if (!p) return "";
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true">${p(color)}<\/svg>`;
}
const HEX = "50,2 92,26 92,74 50,98 8,74 8,26";
/** A people's hex token: the portrait inside a hex in the empire's colour, its rim and (optionally) its name below. */
function peopleToken(id, color, size = 96, label = "") {
  const p = PORTRAIT[id]; if (!p) return "";
  const uid = "pt-" + id + "-" + size;
  return `<svg width="${size}" height="${Math.round(size * (label ? 1.18 : 1))}" viewBox="0 0 100 ${label ? 118 : 100}" role="img" aria-label="${label || id}">
    <defs><clipPath id="${uid}"><polygon points="${HEX}"/><\/clipPath><radialGradient id="${uid}-g" cx="50%" cy="38%" r="70%"><stop offset="0" stop-color="${color}" stop-opacity=".55"/><stop offset="1" stop-color="#0b1020"/><\/radialGradient><\/defs>
    <polygon points="${HEX}" fill="url(#${uid}-g)"/>
    <g clip-path="url(#${uid})"><g transform="translate(6 8) scale(.88)">${p(color)}<\/g><\/g>
    <polygon points="${HEX}" fill="none" stroke="${color}" stroke-width="4"/><polygon points="${HEX}" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="1" transform="translate(50 50) scale(.9) translate(-50 -50)"/>
    ${label ? `<text x="50" y="114" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="currentColor">${label}<\/text>` : ""}
  <\/svg>`;
}
// Painted portraits, if any: square images in the music bucket's peoples/ folder (R2, served cached from the public
// music address), named after the empire: peoples/mirrun.webp, .png or .jpg. A token shows its drawing, and the
// painting over it once it loads; with no painting it stays a drawing (each empire is tried once per page).
const ART_BASE = "https://music.legenddynamicsrpg.com/peoples";
const ART_EXT = ["webp", "png", "jpg"];
const HEX_CLIP = "polygon(50% 6%, 88% 28%, 88% 72%, 50% 94%, 12% 72%, 12% 28%)";
/** A token with the painted portrait layered on (in a page's HTML): the drawing until a painting loads. */
function peopleArt(id, color, size = 96) {
  const tok = peopleToken(id, color, size);
  if (!tok) return "";
  const missing = typeof window !== "undefined" && window.__ldArtMissing && window.__ldArtMissing[id];
  if (missing) return tok;
  const onerr = "var x=this.dataset.ext.split(',');if(x.length&&x[0]){this.dataset.ext=x.slice(1).join(',');this.src=this.dataset.base+'.'+x[0];}else{(window.__ldArtMissing=window.__ldArtMissing||{})[this.dataset.id]=1;this.remove();}";
  return `<span class="ld-art" style="position:relative;display:inline-block;line-height:0;width:${size}px;height:${size}px">${tok}<img alt="" loading="lazy" decoding="async" data-id="${id}" data-base="${ART_BASE}/${id}" data-ext="${ART_EXT.slice(1).join(",")}" src="${ART_BASE}/${id}.${ART_EXT[0]}" onerror="${onerr}" style="position:absolute;inset:0;width:${size}px;height:${size}px;object-fit:cover;clip-path:${HEX_CLIP}"><\/span>`;
}

// ---- galaxy.js ----
// Building a galaxy: a hexagon of space with nebulae and rifts, star systems scattered across it, and the corridors
// that link them. The same seed always builds the same galaxy.


const SIZES = { small: { radius: 9, systems: 34 }, medium: { radius: 12, systems: 58 }, large: { radius: 15, systems: 88 }, vast: { radius: 19, systems: 136 } };

/** @returns {{ radius, hexes, systems, sysAt, corridors, adj, homes }} */
function makeGalaxy(seed, sizeName, factionCount) {
  const rng = makeRng("galaxy:" + seed), size = SIZES[sizeName] || SIZES.medium, R = size.radius;
  const all = hexagon(R);
  const hexes = Object.fromEntries(all.map((k) => [k, { terrain: "space" }]));
  // Nebulae: soft clouds (slow, and they hide ships). Rifts: short broken lines nothing can cross.
  const blob = (terrain, count, len) => {
    for (let i = 0; i < count; i++) {
      let k = rng.pick(all);
      for (let j = 0; j < len; j++) {
        if (hexes[k] && distance(k, "0,0") < R) hexes[k].terrain = terrain;
        const n = neighbors(k).filter((x) => hexes[x]);
        k = rng.pick(n);
      }
    }
  };
  blob("nebula", Math.round(R * 0.9), 7);
  blob("rift", Math.round(R * 0.45), 4);

  // Systems: spread out, never on a rift, at least 2 hexes apart.
  const systems = {}, sysAt = {};
  const names = [...STAR_NAMES];
  let tries = 0;
  while (Object.keys(systems).length < size.systems && tries++ < 20000) {
    const k = rng.pick(all);
    if (hexes[k].terrain === "rift" || distance(k, "0,0") > R - 1) continue;
    if (Object.keys(sysAt).some((h) => distance(h, k) < 3)) continue;
    const id = "s" + Object.keys(systems).length;
    const nm = names.length ? names.splice(rng.int(names.length), 1)[0] : "System " + id;
    const roll = rng.next();
    const world = roll < 0.16 ? "terran" : roll < 0.3 ? "ocean" : roll < 0.46 ? "desert" : roll < 0.6 ? "arctic" : roll < 0.8 ? "barren" : "gas";
    systems[id] = { id, name: nm, at: k, world, size: 1 + rng.int(4), rich: [0.6, 1, 1, 1.4][rng.int(4)], exotics: rng.next() < 0.22,
      ruins: rng.next() < 0.12, colony: null };
    hexes[k].terrain = "space";
    sysAt[k] = id;
  }

  // Corridors: each system to its two nearest neighbours within 6 hexes, then joined into one network.
  const ids = Object.keys(systems), corridors = [], adj = Object.fromEntries(ids.map((i) => [i, []]));
  const link = (a, b) => { if (a === b || adj[a].includes(b)) return; adj[a].push(b); adj[b].push(a); corridors.push([a, b]); };
  for (const a of ids) {
    const near = ids.filter((b) => b !== a).map((b) => [b, distance(systems[a].at, systems[b].at)]).sort((x, y) => x[1] - y[1]);
    near.filter(([, d]) => d <= 6).slice(0, 2).forEach(([b]) => link(a, b));
  }
  // Join the islands: repeatedly link the closest pair of systems in different components.
  const comp = () => { const c = {}; let n = 0; for (const s of ids) if (c[s] === undefined) { const st = [s]; c[s] = n; while (st.length) { const x = st.pop(); for (const y of adj[x]) if (c[y] === undefined) { c[y] = n; st.push(y); } } n++; } return [c, n]; };
  for (let [c, n] = comp(); n > 1; [c, n] = comp()) {
    let best = null;
    for (const a of ids) for (const b of ids) if (c[a] === 0 && c[b] !== 0) { const d = distance(systems[a].at, systems[b].at); if (!best || d < best[2]) best = [a, b, d]; }
    link(best[0], best[1]);
  }

  // Homeworlds: as far apart as the map allows, each a large terran world with a habitable neighbour or two.
  const homes = [];
  const candidates = ids.filter((i) => distance(systems[i].at, "0,0") >= R * 0.45);
  homes.push(rng.pick(candidates));
  while (homes.length < factionCount) {
    let best = null;
    for (const c of candidates) { if (homes.includes(c)) continue; const d = Math.min(...homes.map((h) => distance(systems[h].at, systems[c].at))); if (!best || d > best[1]) best = [c, d]; }
    homes.push(best[0]);
  }
  for (const h of homes) {
    Object.assign(systems[h], { world: "terran", size: 4, rich: 1, exotics: false, ruins: false });
    const near = ids.filter((i) => !homes.includes(i) && distance(systems[i].at, systems[h].at) <= 5).sort((a, b) => distance(systems[a].at, systems[h].at) - distance(systems[b].at, systems[h].at));
    if (near[0]) Object.assign(systems[near[0]], { world: rng.pick(["terran", "ocean"]), size: 2 + rng.int(2) });
    if (near[1]) Object.assign(systems[near[1]], { exotics: true });
    for (const k of within(systems[h].at, 1)) if (hexes[k] && hexes[k].terrain === "rift") hexes[k].terrain = "space";

  // They come for the strongest, too: one in three waves goes after the leading power's nearest world.
  const lead = crAlive(s).sort((a, b) => score(s, b.id) - score(s, a.id))[0];
  const theirs = lead && coloniesOf(s, lead.id).sort((a, b) => distance(a.at, f.at) - distance(b.at, f.at))[0];
  if (theirs && R.next() < 1 / 3 && distance(theirs.at, f.at) <= 16 && setDestination(s, f.id, theirs.at).ok) return;
  for (const pick of [near[R.int(Math.max(1, near.length))], ...near]) if (pick && setDestination(s, f.id, pick.x.at).ok) return;
}

/** A world whose orbit the Wardens hold, unguarded: an outpost is gone at once; a colony loses a million people a turn
 * (and, every other turn, a building) until nothing is left. */
function burn(s, sys, R) {
  const c = sys.colony, owner = faction(s, c.owner), me = crMe(s), seen = me.visible[sys.at];
  const tell = (text) => { log(s, owner.id, text, "war"); if (owner.id !== me.id && seen) log(s, me.id, text, "war"); };
  if (c.kind === "outpost") { tell(`The Wardens burned ${owner.id === me.id ? "your" : `${owner.name}'s`} outpost at ${sys.name}.`); razeWorld(s, sys); newNode(s, sys.at); return; }
  c.pop -= 1;
  if (c.pop % 2 === 0) { const b = Object.keys(c.buildings).filter((k) => c.buildings[k] && k !== "engine"); if (b.length) c.buildings[b[R.int(b.length)]] = false; }
  if (c.pop <= 0) { tell(`The Wardens burned ${sys.name} to bare rock. ${owner.id === me.id ? "Your" : `${owner.name}'s`} colony there is gone.`); razeWorld(s, sys); newNode(s, sys.at); return; }
  tell(`The Wardens are burning ${owner.id === me.id ? "your world " : `${owner.name}'s world `}${sys.name}: population down to ${c.pop}. Drive them off, or put guns or warships in its orbit.`);
}

function breakHeart(s) {
  const C = s.crisis, by = C.heartBy && faction(s, C.heartBy), me = crMe(s), with_ = C.heartWith || [];
  // Its hunters go dark; the Nodes don't. While one stands, the Heart will grow again.
  const left = wardenFleets(s).filter((f) => !stationary(f)).reduce((t, f) => t + f.ships.length, 0);
  for (const f of wardenFleets(s)) if (!stationary(f)) delete s.fleets[f.id];
  for (const f of stationOf(s, "watcher")) delete s.fleets[f.id];
  const nodes = stationOf(s, "node").length;
  if (nodes) { C.stage = "dormant"; C.regrowAt = s.turn + CRISIS.regrow; } else { C.stage = "over"; C.over = s.turn; }
  if (by) { by.stats.heart = true; by.exotics += 6; if (by.ai) crResearch(s, by, 150); }
  log(s, null, `The Heart of the Wardens is broken${by ? `, by ${by.name}` : ""}. ${left ? `The ${left} hunter${left === 1 ? "" : "s"} it sent out went dark at once.` : "Its hunters went dark."}${nodes ? ` But ${nodes} Node${nodes === 1 ? "" : "s"} still burn${nodes === 1 ? "s" : ""}: destroy ${nodes === 1 ? "it" : "them"} within ${CRISIS.regrow} turns, or a new Heart will grow.` : " Nothing of theirs is left: the Wardens are silent."}`, "victory");
  const ev = { id: with_.includes(me.id) ? "broken" : "brokenBy", ctx: { by: C.heartBy || null, nodes }, turn: s.turn };
  if (s.galEvent) C.queued = ev; else s.galEvent = ev;
}

    options: [{ id: "ok", label: "Back to the work of empire", does: "The Heart's waves are over, but any Node left can grow a new one.", apply: (s) => (s.crisis.stage === "dormant" ? "The Heart is gone, but its Nodes still burn." : "The Wardens are gone.") }],
  },
};

/** The Heart is broken but Nodes stand: they keep sending hunters, and after CRISIS.regrow turns a new, stronger Heart
 * grows at the oldest. With no Node left, it's over. */
function dormantTurn(s) {
  const C = s.crisis, R = rng(s);
  if (C.queued && !s.galEvent) { s.galEvent = C.queued; C.queued = null; }
  const nodes = stationOf(s, "node");
  if (!nodes.length) { C.stage = "over"; C.over = s.turn; log(s, null, "The last Warden Node is gone. The signal from the rifts has stopped: the Wardens are silent at last.", "victory"); R.save(); return; }
  nodesTurn(s, R);
  for (const f of wardenFleets(s)) { if (stationary(f) || f.path.length) continue; const sys = s.sysAt[f.at] && s.systems[s.sysAt[f.at]]; if (sys && sys.colony) { if (!guarded(s, sys, WARDENS)) burn(s, sys, R); continue; } hunt(s, f, R); }
  if (s.turn === C.regrowAt - 10) log(s, null, `The Warden Nodes are building something. In 10 turns, a new Heart.`, "war");
  if (s.turn >= C.regrowAt) {
    const seed = nodes.sort((a, b) => (a.born || 0) - (b.born || 0))[0];
    C.returns = (C.returns || 0) + 1; C.heart = seed.at; C.heartMax = Math.round((C.heartMax || SHIPS.heart.hull) * CRISIS.regrowGain);
    seed.ships = [{ type: "heart", hull: C.heartMax }]; for (let i = 0; i < (C.m || 1); i++) seed.ships.push({ type: "colossus", hull: SHIPS.colossus.hull });
    C.stage = "awake"; C.heartBy = null; C.heartWith = null; C.nextWave = s.turn + 2; C.regrowAt = null;
    log(s, null, `A new Heart of the Wardens has grown at ${crPlace(s, seed.at)}, stronger than the last. The waves will come again.`, "war");
    const ev = { id: "returning", ctx: {}, turn: s.turn }; if (s.galEvent) C.queued = ev; else s.galEvent = ev;
  }
  R.save();
}

// ---- wilds.js ----
// The wild things: threats that belong to no power. Pirate havens appear in empty systems and send out raiders, who
// hold the orbits of weak worlds (a blockade) and take their credits. Crystal swarms nest on the rich systems everyone
// wants. Void leviathans drift between the stars and feed on unguarded worlds. All of them are at war with every power
// (never with each other); destroying one pays a bounty in credits and research (game.js, bounty).



const PIRATES = "pirates", BEASTS = "beasts";
const power = (id) => ({ id, name: WILDS[id].name, color: WILDS[id].color, ai: true, alive: true, wild: true, capital: null, credits: 0, exotics: 0,
  research: { current: null, progress: 0, done: [] }, explored: {}, visible: {}, relations: {}, met: {}, stats: { built: 0, lost: 0, won: 0 },
  focus: { industry: 0, science: 0, credits: 0, defense: 0 }, protos: {} });
const seenBy = (s, hex) => player(s).visible[hex];
const havens = (s) => fleetsOf(s, PIRATES).filter((f) => f.ships.some((x) => x.type === "haven"));
/** The havens that count toward the setting's limit: not those a new sector opened with (sectors.js). */
const ownHavens = (s) => havens(s).filter((f) => !f.sector);
const isHaven = (f) => f.ships.some((x) => x.type === "haven");
const colonyMin = (s, hex) => Math.min(99, ...Object.values(s.systems).filter((x) => x.colony).map((x) => distance(x.at, hex)));

/** Where things stand, for the panels: the havens, swarms and leviathans the player has seen. */
function wildsState(s) {
  if (!s.wilds) return null;
  const me = player(s), count = (fid, type) => fleetsOf(s, fid).filter((f) => f.ships.some((x) => x.type === type)).length;
  return { havens: count(PIRATES, "haven"), raiders: fleetsOf(s, PIRATES).filter((f) => !isHaven(f)).length,
    swarms: count(BEASTS, "swarm"), leviathans: count(BEASTS, "leviathan"), husks: count(BEASTS, "husk"),
    seen: [...fleetsOf(s, PIRATES), ...fleetsOf(s, BEASTS)].filter((f) => me.explored[f.at] && (isHaven(f) || f.ships.some((x) => x.type === "swarm" || x.type === "husk") || me.visible[f.at])).length };
}

/** The game's setting: none, light (the default, and for games saved before there was a choice) or heavy. */
const wildsLevel = (s) => (s.wildsOff ? "none" : WILD_LEVELS[s.wildsLevel] ? s.wildsLevel : "light");
const L = (s) => WILD_LEVELS[wildsLevel(s)];
/** Change the setting mid-game. Fewer: the havens and swarms beyond the new limit are gone (those nearest the settled
 * worlds first), with their raiders; None: every pirate and creature is gone. */
function setWildsLevel(s, level) {
  if (!WILD_LEVELS[level]) return { error: "No such setting." };
  s.wildsLevel = level; s.wildsOff = level === "none";
  prune(s);
  log(s, null, `Pirates and creatures: ${WILD_LEVELS[level].name.toLowerCase()}. ${WILD_LEVELS[level].text}`, "war");
  return { ok: true };
}
function prune(s) {
  if (wildsLevel(s) === "none") { for (const f of [...fleetsOf(s, PIRATES), ...fleetsOf(s, BEASTS)]) delete s.fleets[f.id]; return; }
  const P = L(s), near = (f) => colonyMin(s, f.at);
  const cut = (list, max, also) => { list.sort((a, b) => near(a) - near(b)); while (list.length > max) { const f = list.shift(); if (also) also(f); delete s.fleets[f.id]; } };
  cut(ownHavens(s), P.havens[s.size] || 1, (h) => { for (const r of fleetsOf(s, PIRATES)) if (!isHaven(r) && r.home === h.at) delete s.fleets[r.id]; });
  for (const h of havens(s)) cut(fleetsOf(s, PIRATES).filter((r) => !isHaven(r) && r.home === h.at), P.raidersPerHaven);
  cut(fleetsOf(s, BEASTS).filter((f) => f.ships[0].type === "swarm"), P.swarms[s.size] || 1);
  cut(fleetsOf(s, BEASTS).filter((f) => f.ships[0].type === "leviathan"), P.leviathans);
}

/** Once a turn, after the turn resolves: new havens and leviathans, the raids, the wandering. */
function wildsTurn(s) {
  if (s.wildsOff || s.winner) return;
  placeAnomalies(s); placeRelics(s);
  // A game saved before the setting existed starts on Light, trimmed to it.
  if (!s.wildsLevel) { s.wildsLevel = "light"; if (s.wilds) prune(s); }
  const P = L(s);
  if (!s.wilds) {
    s.wilds = { pirates: power(PIRATES), beasts: power(BEASTS), nextHaven: Math.max(s.turn + 2, WILDS.havenFirst), nextLeviathan: Math.max(s.turn + 5, P.leviathanFirst) };
    nestSwarms(s);
  }
  const W = s.wilds, R = rng(s);
  if (s.turn >= W.nextHaven) {
    W.nextHaven = s.turn + P.havenEvery;
    if (ownHavens(s).length < (P.havens[s.size] || 1)) newHaven(s, R);
  }
  if (s.turn >= W.nextLeviathan) {
    W.nextLeviathan = s.turn + WILDS.leviathanEvery;
    if (s.turn >= P.leviathanFirst && fleetsOf(s, BEASTS).filter((f) => f.ships.some((x) => x.type === "leviathan")).length < P.leviathans) newLeviathan(s, R);
  }
  for (const f of [...fleetsOf(s, PIRATES), ...fleetsOf(s, BEASTS)]) {
    if (!s.fleets[f.id]) continue;
    for (const x of f.ships) x.hull = Math.min(SHIPS[x.type].hull, x.hull + (x.type === "raider" && f.at !== f.home ? 0 : 1));
    const type = f.ships[0] && f.ships[0].type;
    if (type === "haven") launchRaiders(s, f);
    else if (type === "raider") raid(s, f, R);
    else if (type === "leviathan") wander(s, f, R);
  }
  R.save();
}

/** Crystal swarms nest, once, on rich or exotic systems no one holds, away from the starting worlds. */
function nestSwarms(s) {
  const R = makeRng("swarms:" + s.seed);
  const pool = Object.values(s.systems).filter((x) => !x.colony && (x.exotics || x.rich > 1) && colonyMin(s, x.at) >= 3 && !fleetsAt(s, x.at).length)
    .sort((a, b) => (a.id < b.id ? -1 : 1));
  for (let n = L(s).swarms[s.size] || 1; n > 0 && pool.length; n--) {
    const sys = pool.splice(R.int(pool.length), 1)[0];
    spawnFleet(s, BEASTS, sys.at, ["swarm"]).home = sys.at;
  }
}

function newHaven(s, R) {
  const taken = havens(s).map((f) => f.at);
  // An empty system 3–7 hexes from the nearest world; once the map fills up, an asteroid field in deep space 2 or more away.
  const ok = (k) => !fleetsAt(s, k).length && taken.every((h) => distance(h, k) >= 5);
  let pool = Object.values(s.systems).filter((x) => !x.colony && ok(x.at)).map((x) => ({ k: x.at, name: x.name, d: colonyMin(s, x.at) }))
    .filter((o) => o.d >= 3 && o.d <= 7);
  if (!pool.length) pool = Object.keys(s.hexes).filter((k) => s.hexes[k].terrain === "space" && !s.sysAt[k] && ok(k)).map((k) => ({ k, name: null, d: colonyMin(s, k) }))
    .filter((o) => o.d >= 2 && o.d <= 6);
  pool.sort((a, b) => a.d - b.d || (a.k < b.k ? -1 : 1));
  const pick = pool[R.int(Math.min(pool.length, 5))]; if (!pick) return;
  const f = spawnFleet(s, PIRATES, pick.k, ["haven"]); f.home = pick.k; f.born = s.turn;
  const near = Object.values(s.systems).filter((x) => x.colony && distance(x.at, pick.k) <= WILDS.raidRange).sort((a, b) => distance(a.at, pick.k) - distance(b.at, pick.k));
  const where = pick.name || `an asteroid field near ${near[0] ? near[0].name : "the frontier"}`;
  for (const fid of new Set(near.map((x) => x.colony.owner))) demandTribute(s, fid, f, where, R);
  for (const fid of new Set(near.map((x) => x.colony.owner))) log(s, fid, `Pirates have set up a haven at ${where}, close to your worlds. Its raiders will come for weak worlds until someone burns it (a bounty of ${WILDS.bounty.haven.credits} credits and ${WILDS.bounty.haven.research} research).`, "war");
}

function launchRaiders(s, haven) {
  const P = L(s);
  if ((s.turn - (haven.born || 0)) % P.raidEvery !== 0) return;
  const out = fleetsOf(s, PIRATES).filter((f) => !isHaven(f) && f.home === haven.at).length;
  if (out >= P.raidersPerHaven) return;
  const n = Math.min(P.raidMax, 2 + Math.floor(s.turn / 50));
  const f = spawnFleet(s, PIRATES, haven.at, []); f.home = haven.at; f.stay = 0;
  for (let i = 0; i < n; i++) f.ships.push({ type: "raider", hull: SHIPS.raider.hull });
}

/** Worth a raid: an established colony (population preyPop or more, and not newly founded). Outposts and young colonies
 * have nothing worth taking, so the frontier can still be settled. */
const worthRaiding = (s, x, home) => !protectedFrom(s, x.colony && x.colony.owner, home) && !!(x.colony && x.colony.kind === "colony" && x.colony.pop >= WILDS.preyPop && !(x.colony.founded && s.turn - x.colony.founded < WILDS.youngTurns)
  && !(s.wilds && s.wilds.avoid && s.wilds.avoid[x.id] > s.turn));   // a world that cost them ships: they stay away a while
/** Raiders: hold an unguarded orbit for a few turns, taking credits each turn (the blockade halves the world's yields
 * too); hurt or done, go home; otherwise pick the next weak world within reach of the haven. */
/** The nearest merchant convoy within TRADERS.hunt hexes with no warships beside it, and where to meet it: a hex or two
 * along its way. */
function convoyPrey(s, f) {
  const c = fleetsOf(s, "traders").filter((x) => distance(x.at, f.at) <= TRADERS.hunt && !fleetsAt(s, x.at).some((o) => o.owner !== "traders" && o.owner !== PIRATES && o.ships.some((y) => SHIPS[y.type].skill > 0)))
    .sort((a, b) => distance(a.at, f.at) - distance(b.at, f.at))[0];
  return c ? (c.path.length ? c.path[Math.min(c.path.length - 1, 1)].hex : c.at) : null;
}
function raid(s, f, R) {
  const hurt0 = f.ships.reduce((t, x) => t + x.hull, 0) < f.ships.length * SHIPS.raider.hull * 0.5;
  // On the way somewhere, or between raids: a convoy in reach is worth turning for.
  if (!hurt0 && !(f.stay > 0)) { const meet = convoyPrey(s, f); if (meet && meet !== f.at && setDestination(s, f.id, meet).ok) return; }
  if (f.path.length) return;

    const to = Object.values(s.systems).filter((y) => y !== from && y !== other && !y.deep && !s.hexes[y.at].sealed && !s.adj[from.id].includes(y.id) && distance(y.at, from.at) <= COLLAPSE.linkRange
      && !(y.sector && SECTORS.kinds[y.sector] && SECTORS.kinds[y.sector].corridors === false))
      .sort((p, q) => distance(p.at, other.at) - distance(q.at, other.at) || distance(p.at, from.at) - distance(q.at, from.at))[0];
    if (!to) { br.surveyed = { turn: s.turn, none: true }; continue; }
    s.adj[from.id].push(to.id); s.adj[to.id].push(from.id); s.corridors.push([from.id, to.id]);
    const F = faction(s, scout.owner); F.research.progress += COLLAPSE.research; F.stats.surveys = (F.stats.surveys || 0) + 1;
    br.surveyed = { turn: s.turn, by: scout.owner, from: from.id, to: to.id };
    secAnnounce(s, `${F.name}${/s$/.test(F.name) ? "'" : "'s"} scout charted a new corridor around the collapse: ${from.name} to ${to.name}.`);
    log(s, scout.owner, `Your scout charted a new corridor, ${from.name} to ${to.name}: +${COLLAPSE.research} research.`, "research");
  }
}

// ---- events.js ----
// Galactic events: every few turns something happens to the player's empire that asks for a decision. Each event is a
// short scene and two or three choices; each choice does something real (credits, research, exotics, population,
// ships, relations, a few turns of a golden age) and says what came of it. Ruins of the old empires are events too:
// surveying one asks what to do with what's found there.




const evMe = (s) => player(s);
const evMetRivals = (s) => s.factions.filter((f) => f.id !== evMe(s).id && f.alive && evMe(s).met[f.id]);
const evRelate = (s, fid, n) => { const r = faction(s, fid).relations[evMe(s).id]; if (r) r.score = Math.max(-60, Math.min(40, r.score + n)); };
const evName = (s, fid) => faction(s, fid).name;
const evResearch = (s, n) => { evMe(s).research.progress += n; const cur = researchItem(s, evMe(s).id); return `+${n} research${cur ? ` toward ${cur.name}` : ", banked for your next technology"}`; };
const evRoll3 = (R) => R.d6() + R.d6() + R.d6();

/**
 * Each event: when it can happen (`can` returns its context, or null), its scene, and its choices. A choice's `does`
 * says up front what it costs and brings; `apply` makes it so and returns what happened.

const EVENTS = {

      { id: "refuse", label: "Refuse", does: "No cost, if the world's defences hold.", apply: (s, c, R) => { const w = s.systems[c.world], guarded = fleetsOf(s, evMe(s).id).some((f) => f.at === w.at && f.ships.some((x) => SHIPS[x.type].skill > 0)) || w.colony.defense > 0; if (guarded || R.next() < 0.4) return `They try their luck against ${w.name}, and think better of it.`; if (w.colony.kind === "colony") w.colony.pop = Math.max(1, w.colony.pop - 1); w.colony.queue = []; return `They raid ${w.name}: its build queue is lost${w.colony.kind === "colony" ? ", and a population point with it" : ""}. Guard your worlds.`; } },

};

/** Every turn: a ruin surveyed becomes an event; otherwise, now and then, something happens. */
function eventsTurn(s) {
  if (s.winner || s.galEvent) return;
  const found = (s.ruinsFound || []).shift();
  if (found) { s.galEvent = { id: "ruins", ctx: found, turn: s.turn }; return; }
  if (s.turn < 6 || s.turn - (s.lastEvent || 0) < 6) return;
  const R = rng(s);
  const roll = R.next();
  if (roll > 0.25) { R.save(); return; }
  const seen = (s.eventsSeen = s.eventsSeen || {});
  const pool = Object.keys(EVENTS).filter((k) => k !== "ruins").sort((a, b) => (seen[a] || 0) - (seen[b] || 0));   // the least seen first
  const fresh = pool.filter((k) => (seen[k] || 0) === (seen[pool[0]] || 0));
  for (const k of [...fresh.sort(() => R.next() - 0.5), ...pool]) {
    const ctx = EVENTS[k].can(s);
    if (ctx) { s.galEvent = { id: k, ctx, turn: s.turn }; seen[k] = (seen[k] || 0) + 1; s.lastEvent = s.turn; break; }
  }
  R.save();
}
/** The event waiting for the player: its scene and its choices, ready to show. */
function currentEvent(s) {
  const e = s.galEvent; if (!e) return null;
  const E = EVENTS[e.id] || CRISIS_EVENTS[e.id];
  return { title: E.title, text: E.text(s, e.ctx), options: E.options.map((o) => ({ id: o.id, label: o.label, does: o.does })) };
}
/** The player's choice: what it does, and what came of it. */
function chooseEvent(s, optId) {
  const e = s.galEvent; if (!e) return { error: "Nothing is waiting." };
  const E = EVENTS[e.id] || CRISIS_EVENTS[e.id], o = E.options.find((x) => x.id === optId); if (!o) return { error: "No such choice." };
  const R = rng(s), text = o.apply(s, e.ctx, R); R.save();
  s.galEvent = null;
  log(s, evMe(s).id, `${E.title}: ${o.label}. ${text}`, "contact");
  return { ok: true, title: E.title, choice: o.label, text };
}

// ---- envoys.js ----
// Envoys: the rivals speak. Each people has a leader and a personality (data.js PERSONALITIES), and now and then sends
// the player a message in its own voice: a greeting at first contact, a demand for tribute, a warning to move a fleet,
// an offer of alliance, a call to join a war, a gift, a declaration of war, or (for an ally) a call to arms. Most ask for
// an answer, and every answer is remembered (game.js remember()): it moves their standing with you, and the Diplomacy
// tab lists what they remember.




const enMe = (s) => player(s);
const enP = (fid) => PERSONALITIES[fid] || PERSONALITIES.concord;
const enRivals = (s) => s.factions.filter((f) => f.id !== enMe(s).id && f.alive && enMe(s).met[f.id]);
const enScore = (s, fid) => faction(s, fid).relations[enMe(s).id].score;
/** Their best admiral, by wins, for a war message. */
const enAdmiral = (s, fid) => { const a = admiralsOf(s, fid).sort((x, y) => y.a.wins - x.a.wins)[0]; return a ? admTitle(a.a) : "our fleet"; };
/** A name inside a sentence ("the Concord"), and every sentence starting with a capital. */
const enIn = (n) => n.replace(/^The /, "the ");
const enCap = (t) => t.replace(/(^|[.!?]\s+)([a-z])/g, (m, a, b) => a + b.toUpperCase());
const enFill = (s, fid, kind, ctx) => enCap(enP(fid).voice[kind].replace(/\{you\}/g, enIn(enMe(s).name)).replace(/\{them\}/g, ctx.them ? enIn(faction(s, ctx.them).name) : "")
  .replace(/\{world\}/g, ctx.world ? s.systems[ctx.world].name : "").replace(/\{n\}/g, ctx.n || "").replace(/\{admiral\}/g, enAdmiral(s, fid)));
const ATTITUDES = [[25, "friendly"], [8, "cordial"], [-8, "neutral"], [-25, "wary"], [-99, "hostile"]];
/** One word for how a rival feels about you. */
function attitude(s, fid) { const r = faction(s, fid).relations[enMe(s).id]; if (r.allied) return "allied"; return ATTITUDES.find(([n]) => r.score >= n)[1]; }

/** What a message would be about, if this rival sent one now (null: nothing to say). */
const CANDIDATES = {
  demand: (s, F) => {
    const me = enMe(s), n = Math.min(120, Math.round(30 + s.turn * 0.4));
    if (!aiOpt(s, "tribute")) return null;   // the "Demand tribute from you" option
    if (atWar(s, F.id, me.id) || allied(s, F.id, me.id) || me.credits < n || enScore(s, F.id) > 10 || s.turn - (F.lastDemand || -99) < 20) return null;
    return militaryPower(s, F.id) >= militaryPower(s, me.id) * 1.2 || enP(F.id).weights.demand >= 1.4 ? { n } : null;
  },
  warn: (s, F) => {
    if (atWar(s, F.id, enMe(s).id) || allied(s, F.id, enMe(s).id)) return null;
    for (const f of fleetsOf(s, enMe(s).id)) {
      if (!armed(f)) continue;
      const w = coloniesOf(s, F.id).find((x) => distance(x.at, f.at) <= 2);
      if (w && !(s.sysAt[f.at] && s.systems[s.sysAt[f.at]].colony && s.systems[s.sysAt[f.at]].colony.owner === enMe(s).id)) return { world: w.id, fleet: f.id };
    }
    return null;
  },
  alliance: (s, F) => {
    const me = enMe(s), sc = enScore(s, F.id);
    if (atWar(s, F.id, me.id) || allied(s, F.id, me.id) || sc < 18) return null;
    const common = s.factions.some((z) => z.alive && z.id !== me.id && z.id !== F.id && atWar(s, F.id, z.id) && atWar(s, me.id, z.id));
    return common || sc >= 28 || (s.crisis && s.crisis.stage === "awake") ? {} : null;
  },
  joint: (s, F) => {
    const me = enMe(s); if (atWar(s, F.id, me.id) || enScore(s, F.id) < 8) return null;
    const z = s.factions.find((x) => x.alive && x.id !== me.id && x.id !== F.id && me.met[x.id] && atWar(s, F.id, x.id) && !atWar(s, me.id, x.id) && !allied(s, me.id, x.id));
    return z ? { them: z.id } : null;
  },
  gift: (s, F) => (!atWar(s, F.id, enMe(s).id) && enScore(s, F.id) >= 15 ? { what: ["credits", "research", "exotics"][s.turn % 3] } : null),
};

/** Once a turn: now and then (every four turns at most), one rival has something to say. */
function envoysTurn(s) {
  if (s.winner) return;
  s.inbox = (s.inbox || []).filter((m) => ["hello", "war", "callToArms"].includes(m.kind) || s.turn - m.turn <= (OUTSIDERS[m.kind] ? 1 : 3));

  return { from: F.id, name: F.name, color: F.color, leader: enCap(enP(F.id).leader), title: enP(F.id).title, kind: m.kind, text, attitude: attitude(s, F.id),
    options: ANSWERS[m.kind].map((o) => ({ id: o.id, label: o.label, does: fill(o.does) })) };
}
/** The player's answer: what it does, and what came of it. */
function answerEnvoy(s, optId) {

  if (OUTSIDERS[m.kind]) {
    const O = OUTSIDERS[m.kind], o = O.options(s, m.ctx).find((x) => x.id === optId); if (!o) return { error: "No such answer." };
    s.inbox.shift(); const text = o.apply(s);

    return { ok: true, name: O.title, choice: o.label, text };
  }
  const o = ANSWERS[m.kind].find((x) => x.id === optId); if (!o) return { error: "No such answer." };

// The computer factions: each turn they pick research, fill their build queues, explore, settle, defend and, when
// they're strong enough and angry enough, go to war. Simple rules, read from what each faction can see.



const PRIORITY = {
  // Orbital shipyards early: research reaches a power's existing ships only at a drydock.
  concord: ["xenology", "automation", "sensors", "orbitalYards", "domes", "commerce", "heavyHulls", "foldDrives", "terraforming", "refining"],
  tessan: ["commerce", "automation", "xenology", "orbitalYards", "sensors", "refining", "heavyHulls", "terraforming", "domes"],
  kel: ["automation", "xenology", "commerce", "orbitalYards", "domes", "terraforming", "sensors", "batteries", "heavyHulls"],
  hegemony: ["automation", "heavyHulls", "orbitalYards", "shields", "targeting", "xenology", "batteries", "refining", "capitalShips"],
  vael: ["sensors", "automation", "orbitalYards", "foldDrives", "xenology", "shields", "heavyHulls", "corridorTheory", "refining"],
  mirrun: ["automation", "sensors", "orbitalYards", "xenology", "domes", "commerce", "terraforming", "refining", "corridorTheory"],
  ylith: ["sensors", "foldDrives", "automation", "orbitalYards", "xenology", "commerce", "shields", "corridorTheory", "refining"],
  zhaq: ["automation", "batteries", "orbitalYards", "sensors", "shields", "heavyHulls", "xenology", "targeting", "refining"],

const AGGRESSION = { concord: 0.9, tessan: 0.7, kel: 0.9, hegemony: 1.4, vael: 1.0, mirrun: 0.7, ylith: 1.0, zhaq: 1.1 };
const DIFF = { easy: 0.7, normal: 1, hard: 1.35 };

function aiTurn(s, F) {
  const diff = aiOpt(s, "strength") || DIFF[s.difficulty] || 1;
  research(s, F);
  relics(s, F);
  beacons(s, F);
  outposts(s, F);
  diplomacy(s, F, diff);
  influence(s, F);
  production(s, F, diff);
  fleets(s, F);
}

/** A Rift beacon, when a world of ours sits by a sealed sector and the treasury can spare it (without Rift drives,
 * or with them but rich enough to want the corridor in). */
function beacons(s, F) {
  const B = SECTORS.beacon, site = beaconSites(s, F.id)[0];
  if (site && F.exotics >= B.exotics + 5 && F.credits >= B.credits + (has(s, F.id, "riftDrives") ? 300 : 120)) buildBeacon(s, F.id, site.sys.id);
}
function research(s, F) {
  if (F.research.current) return;
  const avail = availableTechs(s, F.id);
  // Every technology done (or nothing left worth more): an advance, the cheapest level first.
  if (!avail.length) { const adv = availableAdvances(s, F.id).sort((a, b) => a.cost - b.cost)[0]; if (adv) setResearch(s, F.id, adv.id); return; }
  // A sealed sector out there (or announced): Rift drives, to get in first.
  const sealedNear = Object.values(s.hexes).some((h) => h.sealed) || !!(s.sectors && s.sectors.coming && SECTORS.kinds[s.sectors.coming].sealed);
  if (sealedNear && avail.some((t) => t.id === "riftDrives")) { setResearch(s, F.id, "riftDrives"); return; }
  const pri = PRIORITY[F.id] || [];
  const want = pri.find((id) => avail.some((t) => t.id === id)) || [...avail].sort((a, b) => a.cost - b.cost)[0].id;
  // Late in the game, the Corridor Engine.
  setResearch(s, F.id, avail.some((t) => t.id === "engine") && s.turn > 90 ? "engine" : want);

/** Relics: the Star Chart is read as soon as it's found (game.js); the Gate Shard links the capital to the farthest
 * world of ours it can reach that isn't linked already. */
/**
 * Deep-space stations (the "stations" option): where this power's supply runs short on the way to its nearest rival,
 * a station in open space a hex or two past the edge. At most AI_STATIONS.perColonies colonies to a station.
 */
function stationTarget(s, F) {
  if (!aiOpt(s, "stations") || !has(s, F.id, "orbitalYards")) return null;
  const mine = coloniesOf(s, F.id), cols = mine.filter((x) => x.colony.kind === "colony");
  const have = mine.filter((x) => x.deep).length;
  if (have >= Math.min(AI_STATIONS.max, Math.floor(cols.length / AI_STATIONS.perColonies))) return null;
  const rivals = s.factions.filter((o) => o.alive && o.id !== F.id && F.met[o.id] && !allied(s, F.id, o.id));
  const range = supplyRange(s, F.id), sources = supplySources(s, F.id);
  // Approach lines: from our nearest world toward each rival's capital and its few worlds nearest us, shortest first.
  const lines = [];
  for (const o of rivals) {
    const theirs = coloniesOf(s, o.id); if (!theirs.length) continue;
    const near = (x) => Math.min(...cols.map((c) => distance(c.at, x.at)));
    const targets = [...new Set([s.systems[o.capital], ...theirs.sort((a, b) => near(a) - near(b)).slice(0, 3)])].filter((e) => e && e.colony && e.colony.owner === o.id);
    for (const e of targets) { const c = cols.slice().sort((a, b) => distance(a.at, e.at) - distance(b.at, e.at))[0]; if (c && distance(c.at, e.at) <= 18) lines.push({ c, e, theirs, d: distance(c.at, e.at) }); }
  }
  lines.sort((a, b) => a.d - b.d);
  // On each: open space 2–4 hexes out from our worlds (or just past the edge of our supply), 2 or more from theirs, not
  // near a station of ours; the most forward such hex on the shortest line that has one.
  for (const L of lines) {
    let pick = null;
    for (const k of hexLine(L.c.at, L.e.at)) {
      if (s.sysAt[k] || !s.hexes[k] || s.hexes[k].terrain !== "space") continue;
      const ours = Math.min(...mine.map((x) => distance(x.at, k))), gap = Math.min(99, ...sources.map((x) => distance(x.at, k)));
      if (ours < 2 || (ours > 4 && gap > range + 1)) continue;
      if (L.theirs.some((x) => distance(x.at, k) < 2)) continue;
      if (mine.some((x) => x.deep && distance(x.at, k) < 5) || fleetsOf(s, F.id).some((f) => f.stationAt === k)) continue;
      pick = k;
    }
    if (pick) return pick;
  }

}
/** Outposts: at war, a frontier outpost near the enemy gets an Orbital battery (or station) when the treasury is full. */
function outposts(s, F) {

  const foes = Object.entries(F.relations).filter(([, r]) => r.status === "war").map(([o]) => o); if (!foes.length) return;
  const enemyWorlds = foes.flatMap((o) => coloniesOf(s, o));
  for (const sys of coloniesOf(s, F.id).filter((x) => x.colony.kind === "outpost")) {
    if (!enemyWorlds.some((e) => distance(e.at, sys.at) <= 4)) continue;
    const o = outpostOptions(s, sys.id).sort((a, b) => (a.id === "battery" ? -1 : 1))[0];
    if (o && F.credits >= o.credits * 2.5) { buildAtOutpost(s, F.id, sys.id, o.id); return; }
  }
}
function relics(s, F) {
  if (!relicHeld(s, F.id, "shard")) return;

  const cap = s.systems[F.capital]; if (!cap || !cap.colony || cap.colony.owner !== F.id) return;
  const mineIds = new Set(coloniesOf(s, F.id).map((x) => x.id));
  const t = shardTargets(s, F.id, cap.id).filter((x) => mineIds.has(x.id)).sort((a, b) => distance(b.at, cap.at) - distance(a.at, cap.at))[0];

let logFilter = "all";
function logHTML() {

  // In order: oldest first, under a heading for each turn; the panel opens scrolled to the latest.

}

  $("end-turn").addEventListener("click", doEndTurn);
  $("zoom-in").addEventListener("click", () => zoomBy(1.25));
  $("zoom-out").addEventListener("click", () => zoomBy(0.8));
  $("home").addEventListener("click", () => { if (S) { centerOn(S.systems[player(S).capital].at); draw(); } });
  $("menu").addEventListener("click", () => showMenu());
  if ($("music-btn")) $("music-btn").addEventListener("click", (e) => { e.stopPropagation(); music.prefs.on = !music.prefs.on; music.gaveUp = false; savePrefs(); music.started = true; musicUpdate(); });
  renderMusicNow();
  $("next").addEventListener("click", nextIdle);
  $("to-panel").addEventListener("click", () => document.querySelector(".side").scrollIntoView({ behavior: "smooth", block: "start" }));

    if (!S || e.target.closest("input, textarea, select") || !$("modal").hidden) return;
    if (e.key === "Escape") { moveMode = false; renderPanel(); draw(); }

}
function idleThings() {
  const me = player(S);
  return [...fleetsOf(S, me.id).filter((f) => !f.path.length && !f.sentry).map((f) => ({ kind: "fleet", id: f.id, at: f.at })),
    ...coloniesOf(S, me.id).filter((x) => x.colony.kind === "colony" && !x.colony.queue.length).map((x) => ({ kind: "system", id: x.id, at: x.at }))];
}
let nextIdx = 0;
function nextIdle() {
  const list = idleThings(); if (!list.length) { toast("Everyone has orders."); return; }
  const it = list[nextIdx++ % list.length]; select({ kind: it.kind, id: it.id }); centerOn(it.at); draw();
}
function doEndTurn() {
  if (!S || S.winner) return;
  const me = player(S);
  if (!me.research.current && (availableTechs(S, me.id).length || availableAdvances(S, me.id).length)) { tab = "research"; renderTabs(); renderPanel(); toast("Choose what to research first.", true); return; }
  const before = { cols: coloniesOf(S, me.id).length, log: S.log.length };
  $("end-turn").disabled = true; $("end-turn").textContent = "Thinking…";
  const snapshot = JSON.stringify(S);   // if the turn fails partway, the game goes back to this
  setTimeout(() => {
    let step = "starting the turn";
    try {
      S.offers = S.offers.filter((o) => S.turn - o.turn < 3);
      step = "moving, fighting and the computer players' turns"; endTurn(S, aiTurn);
      step = "directives"; if (!S.winner) directivesTurn(S);
      step = "the Wardens"; if (!S.winner) crisisTurn(S);
      step = "pirates and creatures"; if (!S.winner) wildsTurn(S);
      step = "traders"; if (!S.winner) tradersTurn(S);
      step = "new sectors"; if (!S.winner) sectorsTurn(S);
      step = "corridors"; if (!S.winner) corridorsTurn(S);
      step = "galactic events"; if (!S.winner) eventsTurn(S);
      step = "envoys"; if (!S.winner) envoysTurn(S);

        <p class="small muted">${esc(err.message)}<\/p>
        <p>Please download a bug report and send it in: it has the error and your save, so the problem can be played back and fixed. You can try End turn again, or change your orders first.<\/p>
        <div class="btn-row"><button class="btn primary" id="err-dl">Download a bug report<\/button><button class="btn" id="err-close">Back to the game<\/button><\/div>`);
      $("err-dl").onclick = () => downloadBugReport(`End turn failed during ${step}`); $("err-close").onclick = closeModal;
      return;
    }

    const news = S.log.slice(before.log).filter((l) => l.fid === me.id || l.kind === "victory" || l.sector || (l.kind === "war" && (l.text.includes(me.name))) || ((l.kind === "diplo" || l.kind === "contact") && l.text.includes(me.name))).filter((l) => !l.text.startsWith("Charted ") && l.kind !== "turn");

    renderAll();
    if (S.winner) { showEnd(); return; }
    // A report of the turn, when anything happened to you: the books first, then the rest; charted systems are counted.
    const charted = S.log.slice(before.log).filter((l) => l.fid === me.id && l.text.startsWith("Charted ")).length;
    const go = () => {
      if (news.length || charted) {
        const books = S.log.slice(before.log).find((l) => l.fid === me.id && l.kind === "turn");
        report = { title: `Turn ${S.turn - 1}: what happened`, lines: [...news.map((l) => l.text), ...(charted ? [`${charted} new system${charted === 1 ? "" : "s"} charted (see the Log).`] : []), ...(books ? [books.text] : [])] };
        showReport();
      } else showNextMission();
    };
    // Battles first, as they happened; then the turn's report; then any event and directive reports.
    if (S.battleReports && S.battleReports.length) showBattle(go); else go();
  }, 30);
}

// ---------- battles, exchange by exchange ----------
/** The first battle report waiting: both sides' ships and every roll, stepped through, then the result. */
function showBattle(then) {
  const B = S.battleReports && S.battleReports[0]; if (!B) { then(); return; }
  const me = player(S).id, n = B.events.length;
  let shown = 0;
  const unitName = (u) => { if (u.fid === "wardens") return u.type === "heart" ? "The Heart" : `Warden ${u.name.toLowerCase()}`; const who = u.fid === me ? "Your" : faction(S, u.fid).name.replace(/^The /, ""); return u.type === "guns" ? `${who} orbital guns at ${u.name.replace(/'s orbital guns$/, "")}` : `${who} ${u.name.toLowerCase()}`; };
  const hullAt = (k) => B.units.map((u, i) => Math.max(0, u.hull - B.events.slice(0, k).filter((e) => e.t === i).reduce((t, e) => t + e.dmg, 0)));
  const icon = (u) => (u.type === "guns" ? `<svg width="22" height="22" viewBox="-13.5 -13.5 27 27" aria-hidden="true"><circle r="7" fill="${faction(S, u.fid).color}" fill-opacity=".3" stroke="${faction(S, u.fid).color}" stroke-width="1"/><path d="M0 -7 V-12 M7 0 H12 M0 7 V12 M-7 0 H-12" stroke="${faction(S, u.fid).color}" stroke-width="1"/><\/svg>` : shipSVG(u.type, faction(S, u.fid).color, 22, u.fid));
  const sideHTML = (fids, hull, title) => `<div class="bside"><h3>${title}<\/h3>${B.units.map((u, i) => fids.includes(u.fid) ? `<div class="bunit ${hull[i] <= 0 ? "dead" : ""}">${icon(u)}<span>${esc(unitName(u))}${u.stance && u.stance !== "balanced" ? ` <i class="small muted">(${esc(STANCES[u.stance].name.toLowerCase())})<\/i>` : ""}<\/span><span class="pips">${Array.from({ length: u.max }, (_, k) => `<i class="${k < hull[i] ? "on" : ""}"><\/i>`).join("")}<\/span><\/div>` : "").join("")}<\/div>`;
  const draw = () => {
    const hull = hullAt(shown), done = shown >= n;
    const mine = [me], theirs = B.sides.filter((x) => x !== me);
    const lines = B.events.slice(0, shown).map((e, k) => {
      const a = B.units[e.a], t = B.units[e.t], killed = e.hit && hullAt(k + 1)[e.t] <= 0 && hullAt(k)[e.t] > 0;
      const head = k === 0 || B.events[k - 1].round !== e.round ? `<li class="bround">Exchange ${e.round + 1}<\/li>` : "";
      return `${head}<li class="${e.hit ? (a.fid === me ? "good" : "bad") : "muted"}${k === shown - 1 ? " now" : ""}">${esc(unitName(a))} fires on ${esc(unitName(t).replace(/^Your /, "your "))}: <span class="dice">${e.dice.map((d) => `<span class="die">${d}<\/span>`).join("")}<\/span> ${e.dice.reduce((x, y) => x + y, 0)} against ${e.need}: <b>${e.hit ? (killed ? "destroyed!" : `hit, −${e.dmg}`) : "miss"}<\/b><\/li>`;
    }).join("");
    const lostMine = (B.lost || {})[me] || 0, lostTheirs = Object.entries(B.lost || {}).filter(([f]) => f !== me).reduce((t, [, x]) => t + x, 0);
    const gunsOut = B.silenced ? (B.silenced === me ? ` <b class="bad">Your orbital guns are knocked out:<\/b> they can't be repaired while enemy warships hold the orbit.` : ` <b class="good">Their orbital guns are knocked out:<\/b> the orbit is yours while you hold it. Bring troop transports to invade, or a barrage to bring down what they've built.`) : "";
    const result = (B.won === "won" ? `<b class="good">Victory.<\/b> You lost ${lostMine} ship${lostMine === 1 ? "" : "s"}; they lost ${lostTheirs}.` : B.won === "lost" ? `<b class="bad">Defeat.<\/b> You lost ${lostMine} ship${lostMine === 1 ? "" : "s"}; they lost ${lostTheirs}.` : `<b>No clear winner.<\/b> You lost ${lostMine}; they lost ${lostTheirs}. The fight goes on next turn if both sides stay.`) + gunsOut;
    modal(`<h1>Battle at ${esc(B.at)}<\/h1><p class="small muted">Turn ${B.turn} · ${esc(B.sides.map((f) => f === me ? "you" : faction(S, f).name).join(" against "))} · each shot is 3d6 at or under the gunner's skill<\/p>
      <div class="battle">${sideHTML(mine, hull, "Your side")}${sideHTML(theirs, hull, esc(theirs.map((f) => faction(S, f).name).join(", ")))}<\/div>
      <ol class="blog-list">${lines || `<li class="muted">The fleets close. Three exchanges of fire.<\/li>`}<\/ol>
      ${(B.admirals || []).length ? `<p class="small muted">Commanding: ${B.admirals.map((x) => `${x.fid === me ? "yours, " : `${esc(faction(S, x.fid).name)}, `}<b>${esc(x.name)}<\/b>${x.traits.length ? ` (${esc(x.traits.join(", "))})` : ""}`).join("; ")}<\/p>` : ""}
      ${done ? `<p>${result}<\/p>${(B.news || []).map((t) => `<p class="small"><b>${esc(t)}<\/b><\/p>`).join("")}` : ""}
      <div class="btn-row">${done ? `<button class="btn primary" id="b-ok">Continue<\/button>` : `<button class="btn primary" id="b-next">Next shot<\/button><button class="btn" id="b-round">Finish the exchange<\/button><button class="btn" id="b-all">Skip to the result<\/button>`}<\/div>`);
    const L = document.querySelector(".blog-list"); if (L) L.scrollTop = L.scrollHeight;
    if (done) $("b-ok").onclick = () => { S.battleReports.shift(); save(); closeModal(); renderAll(); showBattle(then); };

    }
  };
  draw();
}

// First steps: a checklist that ticks itself off as the player does each thing.
function stepsList() {
  const me = player(S), cols = coloniesOf(S, me.id);
  return [
    { id: "research", label: "Choose what to research", done: !!me.research.current || me.research.done.length > 0 },
    { id: "build", label: "Build something at your capital", done: cols.some((x) => x.colony.queue.length) || me.stats.built > 0 },
    { id: "scout", label: "Send your scout into the dark", done: !!(S.tutorial && S.tutorial.scouted) || S.turn > 12 },
    { id: "colony", label: "Found a second colony", done: cols.filter((x) => x.colony.kind === "colony").length >= 2 },
    { id: "turn", label: "End your turn", done: S.turn >= 2 },
  ];
}
function renderSteps() {
  const el = $("steps");
  if (!S || !S.tutorial || !S.tutorial.on || guideOn()) { el.hidden = true; return; }   // the guide does this job while it runs
  const list = stepsList(), n = list.filter((x) => x.done).length;
  el.hidden = false;
  if (n === list.length) {
    el.innerHTML = `<div class="steps-head"><b>First steps: done<\/b><button class="x" data-steps-off title="Hide">×<\/button><\/div>
      <p class="small">You're off. Next: build a Factory and a Research lab at your capital, keep two or three frigates at home, and look for your neighbours under <b>Diplomacy<\/b>.<\/p>
      <button class="btn small" data-steps-off>Hide the checklist<\/button>`;
    return;
  }
  const next = list.find((x) => !x.done);
  el.innerHTML = `<div class="steps-head"><b>First steps<\/b><span class="small muted">${n} of ${list.length}<\/span><button class="x" data-steps-off title="Hide the checklist">×<\/button><\/div>
    <span class="meter"><span style="width:${(n / list.length) * 100}%;background:var(--good)"><\/span><\/span>
    <ol class="steps">${list.map((x) => `<li class="${x.done ? "done" : x === next ? "now" : ""}"><span>${x.done ? "✓" : ""}<\/span>${esc(x.label)}${x === next ? ` <button class="btn small" data-show="${x.id}">Show me<\/button>` : ""}<\/li>`).join("")}<\/ol>`;
}
function showMe(id) {
  const me = player(S), cap = S.systems[me.capital];
  if (id === "research") { tab = "research"; renderTabs(); renderPanel(); toast("Click a technology to research it. Deep sensors and Xenology are good first picks."); return; }
  if (id === "build") { select({ kind: "system", id: cap.id }); centerOn(cap.at); draw(); toast("Under Add to the queue, click a Scout, a Factory or a Colony ship."); return; }
  if (id === "scout") {
    const f = fleetsOf(S, me.id).find((x) => x.ships.some((y) => y.type === "scout"));
    if (!f) { select({ kind: "system", id: cap.id }); toast("Build a Scout at your capital first."); return; }
    select({ kind: "fleet", id: f.id }); centerOn(f.at); moveMode = true; renderPanel(); draw();
    toast("Your scout is selected. Click a dark hex far from home to send it there."); return;
  }
  if (id === "colony") {
    const f = fleetsOf(S, me.id).find((x) => x.ships.some((y) => y.type === "colony"));
    if (!f) { select({ kind: "system", id: cap.id }); toast("Build a Colony ship at your capital (Add to the queue)."); return; }
    const here = S.sysAt[f.at] && S.systems[S.sysAt[f.at]];
    if (here && canSettle(S, me.id, here, "colony")) { select({ kind: "fleet", id: f.id }); toast(`Your colony ship is at ${here.name}: press Found a colony.`); return; }
    const best = Object.values(S.systems).filter((x) => me.explored[x.at] && canSettle(S, me.id, x, "colony"))
      .sort((a, b) => (WORLDS[b.world].pop + b.size * 2) / (1 + distance(f.at, b.at) / 3) - (WORLDS[a.world].pop + a.size * 2) / (1 + distance(f.at, a.at) / 3))[0];
    select({ kind: "fleet", id: f.id });
    if (best) { setDestination(S, f.id, best.at); centerOn(best.at); save(); renderPanel(); draw(); toast(`Your colony ship is on its way to ${best.name}, a good world nearby. When it arrives, select it and press Found a colony.`); }
    else { centerOn(f.at); moveMode = true; renderPanel(); draw(); toast("No good world seen yet: explore, or click a world to send the colony ship there."); }
    return;
  }
  if (id === "turn") { const b = $("end-turn"); b.classList.add("pulse"); setTimeout(() => b.classList.remove("pulse"), 2400); toast("Press End turn (or Enter) when your orders are given."); }
}

// ---------- the guide: a first game, step by step ----------
// A card that walks a new player through the first turns. Each step says what to do and why, puts a gold ring on what
// to use, and moves on by itself once it's done ("read" steps wait for Got it). Skippable; the menu starts it again.
const GUIDE = [
  { id: "welcome", read: true, title: "Welcome to the Fracture Lines", text: "You lead one world, a scout, a frigate and a colony ship. Rivals are out there in the dark, building the same way. This guide walks you through your first turns; it moves on by itself as you do each thing. Tap Got it on the ones that only explain." },
  { id: "bar", read: true, target: ".bar", title: "Your empire at a glance", text: "Across the top: Credits (income less upkeep), Industry (what your worlds build with), Science (research) and Exotics (for heavy ships and great works), and the turn." },
  { id: "research", target: '[data-tab="research"]', tab: "research", show: "research", title: "Choose what to research", text: "Open the Research tab and pick a technology. Deep sensors or Xenology (harsher worlds to settle) are good first picks. You can't end a turn with nothing to research.", done: () => !!player(S).research.current || player(S).research.done.length > 0 },
  { id: "build", target: "#panel", show: "build", title: "Build something at your capital", text: "Your capital is selected: under Add to the queue, pick a Scout, a Factory or a Colony ship. Industry fills the queue a little every turn; credits can rush the front of it.", done: () => coloniesOf(S, player(S).id).some((x) => x.colony.queue.length) || player(S).stats.built > 0 },
  { id: "scout", target: "#map", show: "scout", title: "Send your scout into the dark", text: "Select your scout, then click a dark hex far from home (or press Move, then the hex). Dashed lines are corridors: one move takes a ship all the way along one.", done: () => !!(S.tutorial && S.tutorial.scouted) || S.turn > 12 },
  { id: "colony", target: "#map", show: "colony", title: "Found a second colony", text: "Send the colony ship to a good world nearby (Show me picks one), and when it arrives, select it and press Found a colony. More worlds mean more of everything.", done: () => coloniesOf(S, player(S).id).filter((x) => x.colony.kind === "colony").length >= 2 || fleetsOf(S, player(S).id).some((f) => f.dest && f.ships.some((x) => x.type === "colony")) },
  { id: "end", target: "#end-turn", title: "End the turn", text: "Press End turn (or Enter). Everyone moves at once; then worlds grow, build and research, and a report tells you what happened.", done: () => S.turn >= 2 },
  { id: "objectives", target: '[data-tab="objectives"]', tab: "objectives", title: "Three ways to win", text: "The Objectives tab: conquest (the last power standing), the Corridor Engine (research it, then build it at your capital), or the best score at turn 200. It shows how close everyone is.", done: () => S.tutorial.seen && S.tutorial.seen.objectives },
  { id: "mission", target: '[data-tab="mission"]', tab: "mission", title: "Directives and campaigns", text: "Your people send directives (the Mission tab): each pays credits, and each is a race against a rival. From turn 8, campaigns: three in a row, each against your nearest rival. Your research arm sends field tests that leave a prototype upgrade.", done: () => S.tutorial.seen && S.tutorial.seen.mission },
  { id: "empire", target: '[data-tab="empire"]', tab: "empire", title: "Focus", text: "The Empire tab: share three Focus points between industry, science, credits and defense (2 at most to one). Change it whenever you like. Your prototypes are listed here too.", done: () => S.tutorial.seen && S.tutorial.seen.empire },
  { id: "fleets", read: true, title: "Fleets: stance, supply and fuel", text: "Select a fleet to set its battle stance (aggressive, balanced, defensive). Your colonies give supply within 3 hexes, and so does an outpost with a fuel depot (claim it with one, or build it later for credits). Beyond supply a fleet burns a turn of fuel each turn it moves (its panel shows the tank); run dry and it crawls a hex a turn, and its warships wear down. Back in supply it refuels from your fuel reserve (top bar): your colonies make a little, fuel depots and stations make most of it and raise how much you can store. Fleets moving in supply, refuelling, filling tankers and burning hard (a fleet's button: a hex a turn faster) all draw on it; short of fuel, your fleets move slower. More depots, more fleets kept moving. A fuel tanker extends your lines: travelling with a fleet it tops up the tank; parked, it keeps your fleets within 2 hexes in supply. Enemy warships in a supply point's system cut it, so defend your tankers and depots. In a battle a fleet is engaged and can't just leave: press Withdraw to pull it out after the first exchange. Detach and send sends part of a fleet somewhere else." },
  { id: "trade", read: true, title: "Trade and sieges", text: "Your colonies trade with each other and with treaty partners' worlds within 4 hexes, for credits (an Exchange doubles it; the Empire tab's market buys and sells exotics). Warships in an enemy's orbit besiege it: half its industry and credits, no trade, no growth, it starves, its garrison weakens, and an ordinary colony starved low enough surrenders. Your own worlds can be besieged too: break the siege with a fleet." },
  { id: "done", read: true, title: "The galaxy is yours", text: "That's the turn: research, build, move, end the turn. Next: a Factory and a Research lab at your capital, two or three frigates at home, and meet your neighbours (Diplomacy). Menu → Restart the guide brings this back any time." },
];
const guideOn = () => S && S.tutorial && S.tutorial.guide && !S.tutorial.guideDone;
function guideStep() {
  const T = S.tutorial; T.ack = T.ack || {}; T.done = T.done || {};
  // A step once done stays done (a colony ship that arrives no longer has a course, but it was sent).
  for (let i = 0; i < GUIDE.length; i++) { const g = GUIDE[i]; if (!g.read && !T.done[g.id] && g.done()) T.done[g.id] = true; if (g.read ? !T.ack[g.id] : !T.done[g.id]) return [g, i]; }
  return [null, GUIDE.length];
}
function renderCoach() {
  const el = $("coach"); document.querySelectorAll(".coach-target").forEach((x) => x.classList.remove("coach-target"));
  if (!guideOn()) { el.hidden = true; return; }
  const [g, i] = guideStep();
  if (!g) { S.tutorial.guideDone = true; el.hidden = true; save(); return; }
  if (S.tutorial.minFor && S.tutorial.minFor !== g.id) { S.tutorial.min = false; S.tutorial.minFor = null; }   // a new step opens the card again
  el.hidden = false; el.classList.toggle("min", !!S.tutorial.min);
  el.innerHTML = `<div class="coach-step">Your first game · step ${i + 1} of ${GUIDE.length}<\/div><h4>${esc(g.title)}<\/h4><p>${esc(g.text)}<\/p>
    <div class="btn-row">${g.read ? `<button class="btn small primary" data-coach="ack">Got it<\/button>` : g.target ? `<button class="btn small primary" data-coach="show">Show me<\/button>` : ""}<button class="btn small" data-coach="min">${S.tutorial.min ? "Open" : "Hide for now"}<\/button><button class="coach-skip" data-coach="skip">End the guide<\/button><\/div>`;
  if (g.target) document.querySelectorAll(g.target).forEach((x) => x.classList.add("coach-target"));
}
const seeTab = (t) => { if (S && S.tutorial) { (S.tutorial.seen = S.tutorial.seen || {})[t] = true; save(); } };
function coachClick(e) {
  const b = e.target.closest("[data-coach]"); if (!b || !S) return;
  const [g] = guideStep(), a = b.dataset.coach, T = S.tutorial;
  if (a === "ack" && g) T.ack[g.id] = true;
  else if (a === "skip") { T.guideDone = true; toast("Guide ended. Menu → Restart the guide brings it back."); }
  else if (a === "min") T.min = !T.min;
  else if (a === "show" && g) {
    if (g.show && g.id !== "research") showMe(g.show);
    if (g.tab) { tab = g.tab; seeTab(tab); renderTabs(); renderPanel(); }
    if (g.id === "research") toast("Click a technology to research it. Deep sensors and Xenology are good first picks.");
    if (g.id === "end") showMe("turn");
    const t = g.target && document.querySelector(g.target); if (t) t.scrollIntoView({ behavior: "smooth", block: "center" });
    // On a phone the card would cover the map: fold it down while the map step is done.
    if (g.target === "#map" && matchMedia("(max-width: 820px)").matches) { T.min = true; T.minFor = g.id; window.scrollTo({ top: 0, behavior: "smooth" }); }

}
function startGuide() { S.tutorial = { ...(S.tutorial || {}), on: true, guide: true, guideDone: false, ack: {}, seen: {}, done: {}, min: false }; save(); renderAll(); }

function showHelp(back) {
  modal(`<h1>How to play<\/h1>
    <ul class="help">
      <li><b>Each turn<\/b>, give orders, then press <b>End turn<\/b> (or Enter). Everyone moves at once.<\/li>
      <li><b>Worlds<\/b> grow population, which makes <b>industry<\/b> (to build), <b>science<\/b> (to research) and <b>credits<\/b> (to pay upkeep). Pick what each world builds in its queue; rush the first item with credits.<\/li>
      <li><b>Space travel.<\/b> Each ship has a speed: the moves it gets each turn (a scout 4, frigates and cruisers 3, colony ships and dreadnoughts 2; Fold drives add 1). A fleet moves at its slowest ship's speed. Right-click where it should go; the route and the turns it takes show on the map.
        <ul>
          <li><b>Open space:<\/b> a move a hex. You can fly anywhere this way, just slowly.<\/li>
          <li><b>Corridors<\/b> (the dashed lines) are the fast way: folds in space between two systems. A jump along one costs 1 move however long it is, so a corridor can cross half the map in a single move. <b>Corridor theory<\/b> makes corridor jumps cost almost nothing (a quarter of a move), and the holder of the Corridor Engine travels them free. The route-finder uses corridors by itself whenever they're faster.<\/li>
          <li><b>Nebulae<\/b> (purple): 2 moves a hex, and ships inside are hidden from anyone not in the same nebula.<\/li>
          <li><b>Rifts<\/b> (red, jagged): tears in space that nothing of ours can cross; routes go round them. The Wardens' machines come out of the rifts late in the game, so worlds near them are on the front line.<\/li>
          <li><b>Sealed sectors<\/b> (a teal tint): new space that only Rift drives can enter, until someone lights a Rift beacon beside it.<\/li>
          <li><b>Corridors can change:<\/b> a rare collapse (red, dashed, with warning) cuts one, and a scout can chart a new one. The Gate Shard relic opens a new corridor; the Corridor Engine's gate jumps a fleet to any of its holder's worlds.<\/li>
          <li><b>Fuel and supply:<\/b> within ${SUPPLY.range} hexes of your colonies, depots and stations, fleets are in supply. Beyond it, each turn a fleet moves uses a turn of its own fuel; out of fuel it crawls a hex a turn. Moving in supply draws on your fuel reserve. A fleet that <b>burns hard<\/b> moves a hex a turn farther, for more fuel.<\/li>
          <li><b>Stopping:<\/b> a fleet stops in a hex where armed enemies at war wait for it. Once engaged in a battle it can't just leave: it has to withdraw.<\/li>
        <\/ul><\/li>
      <li><b>Colony ships<\/b> settle worlds you can live on; <b>outpost ships<\/b> claim any system, for its exotics ◆ and territory. Xenology and Habitat domes open harsher worlds.<\/li>

      <li><b>Battles<\/b> happen when fleets of factions at war share a hex. Each armed ship rolls 3d6 under its skill to hit (3–4 always hits, 17–18 always misses), three exchanges a turn. Worlds with guns fire back: they fire first in each exchange and finish off the most damaged ship. Knocking a world's guns out counts toward winning the battle, and they can't be repaired while you hold the orbit.<\/li>
      <li><b>Engaged:<\/b> a fleet sharing a hex with enemy warships (or an enemy world's guns) is engaged. It can't simply sail away. Press <b>Withdraw<\/b>: it fights the next battle's first exchange defensively, then pulls back toward your nearest world.<\/li>
      <li><b>Detach and send:<\/b> on a fleet's panel, choose how many of each ship to take, then click where to send them (a world, or an enemy fleet). The soundest ships go and the admiral stays. In a battle you can detach some ships and withdraw just those. <b>Split off by type<\/b> does the same for one type at a time, most damaged first.<\/li>

      <li><b>Music:<\/b> the ♪ button (top right) turns it on or off. Menu → Music has the volume, Next track, and Loop this track. The main theme plays at the start; after that the music follows the galaxy (exploring, war, the Wardens).<\/li>
      <li><b>Invading:<\/b> clear the orbit (warships and guns), then land troop transports whose troops match the defense.<\/li>
      <li><b>Diplomacy:<\/b> meet rivals by seeing them. Trade for credits; settling next to them makes them angry. A power's <b>regard<\/b> for you decides whether it trades, allies, or attacks you. Their memory shows why they feel as they do.<\/li>
      <li><b>Influence<\/b> (each power's card on the Diplomacy tab): send <b>gifts<\/b> of credits or exotics (gifts close together count for less); <b>make amends<\/b> for a grievance they remember; see whether they'd accept a proposal, and <b>sweeten<\/b> it with credits; <b>demand tribute<\/b> from a power whose fleet is far weaker than yours (they resent it); <b>denounce<\/b> a rival to them; or ask them to <b>join your war<\/b> (free if they like you, for credits if they're only lukewarm). The computer players do all of this too, with each other and with you: a weak neighbour may send you gifts, a rival may denounce you to others, and a far stronger one may demand tribute (both are options on the new-game form).<\/li>
      <li><b>Win<\/b> by conquest (the last people standing), by building the <b>Corridor Engine<\/b> (research it, then build it at your capital), or with the highest score at turn ${RULES.maxTurns}.<\/li>
      <li><b>Map:<\/b> drag to pan, scroll to zoom, click to select, right-click to move the selected fleet. <b>M<\/b> toggles move, <b>Esc<\/b> cancels.<\/li>
    <\/ul><div class="btn-row"><button class="btn primary" id="help-back">Back<\/button><\/div>`);
  $("help-back").onclick = back;
}
/** This game's galaxy: its seed and the settings that, with it, rebuild the same map. */
function galaxyInfo() {
  const size = { small: "Small", medium: "Medium", large: "Large", vast: "Vast" }[S.size] || S.size, rivals = S.factions.length - 1;
  const diff = difficultyLabel(S);
  return { seed: String(S.seed), text: `Seed ${S.seed} · ${size} galaxy · ${rivals} rival${rivals === 1 ? "" : "s"} · ${diff}`,
    preset: { seed: String(S.seed), size: S.size, rivals, difficulty: S.difficulty, player: player(S).id, mode: S.mode || "standard", crisisOff: !!S.crisisOff, sectorsOff: !!S.sectorsOff, collapsesOff: !!S.collapsesOff, wilds: wildsLevel(S), ai: S.aiOpts || null } };
}
function galaxyBox() {
  const g = galaxyInfo();
  return `<div class="seedbox"><h3>This galaxy<\/h3><p><b class="seed" id="seed-text">${esc(g.seed)}<\/b><\/p><p class="small muted">${esc(g.text)}. The same seed and settings build the same map.<\/p>
    <div class="btn-row"><button class="btn small" id="seed-copy">Copy the seed<\/button><button class="btn small" id="seed-replay">Replay this galaxy<\/button><\/div><\/div>`;
}
function bindGalaxyBox() {
  const g = galaxyInfo();
  $("seed-copy").onclick = () => {
    const text = `Fracture Lines: Dominion — ${g.text}`, p = navigator.clipboard && navigator.clipboard.writeText(text);
    const fail = () => { const r = document.createRange(); r.selectNodeContents($("seed-text")); const sl = getSelection(); sl.removeAllRanges(); sl.addRange(r); toast("Copying is blocked here: the seed is selected, copy it yourself."); };
    if (p) p.then(() => toast("Seed copied, with its settings."), fail); else fail();
  };
  $("seed-replay").onclick = () => showNewGame(true, g.preset);
}
/** The bug report: what's been recorded, a note to add, and the download. */
function showBugReport() {
  const L = errLog.list.slice(-8).reverse();
  modal(`<h1>Bug report<\/h1><p>A bug report is a file with any errors the game recorded, your browser, the game's settings, its recent log and your save, so the problem can be played back exactly. Download it and send it in.<\/p>
    ${L.length ? `<p class="small"><b>Errors recorded (${errLog.list.length}):<\/b><\/p><ul class="small mem">${L.map((x) => `<li class="bad">${esc(x.time.slice(0, 16).replace("T", " "))}${x.turn ? `, turn ${x.turn}` : ""}: ${esc(x.where)}: ${esc(x.message)}<\/li>`).join("")}<\/ul>` : `<p class="small muted">No errors recorded. If something looks wrong anyway, describe it below.<\/p>`}
    <label class="small">What happened? <textarea id="bug-note" rows="3" style="width:100%;margin-top:4px" placeholder="What you did, and what you expected"><\/textarea><\/label>
    <div class="btn-row"><button class="btn primary" id="bug-dl">Download the bug report<\/button>${errLog.list.length ? `<button class="btn" id="bug-clear">Clear the error log<\/button>` : ""}<button class="btn" id="bug-back">Back<\/button><\/div>`);
  $("bug-dl").onclick = () => downloadBugReport($("bug-note").value.trim());
  if ($("bug-clear")) $("bug-clear").onclick = () => { errLog.list = []; try { localStorage.removeItem(ERR_KEY); } catch {} showBugReport(); };
  $("bug-back").onclick = showMenu;
}
function showMenu() {
  modal(`<h1>Menu<\/h1>${musicMenuHTML()}<div class="btn-row col">
    <button class="btn" id="m-resume">Back to the game<\/button>
    <button class="btn" id="m-help">How to play<\/button>
    <button class="btn" id="m-guide">The starter guide<\/button>
    <button class="btn" id="m-guide-go">${guideOn() ? "Restart" : "Start"} the guide<\/button>
    <button class="btn" id="m-steps">${S && S.tutorial && S.tutorial.on ? "Hide" : "Show"} the First steps checklist<\/button>
    <a class="btn" href="strategy.html" target="_blank" rel="noopener" style="text-align:center;text-decoration:none">Strategy guide: how to win<\/a>
    <a class="btn" href="peoples.html" target="_blank" rel="noopener" style="text-align:center;text-decoration:none">The peoples: who they are<\/a>
    <a class="btn" href="tokens.html" target="_blank" rel="noopener" style="text-align:center;text-decoration:none">Printable ship tokens<\/a>
    <button class="btn" id="m-bug">Download a bug report${errLog.list.length ? ` (${errLog.list.length} error${errLog.list.length === 1 ? "" : "s"} recorded)` : ""}<\/button>
    <button class="btn" id="m-export">Save code (copy)<\/button>
    <button class="btn" id="m-load">Load a saved game<\/button>
    ${S && !S.winner ? `<label class="small" style="display:block;margin:4px 0">Pirates and creatures <select id="m-wilds">${Object.entries(WILD_LEVELS).map(([k, v]) => `<option value="${k}" ${k === wildsLevel(S) ? "selected" : ""}>${v.name}<\/option>`).join("")}<\/select><\/label><p class="small muted" id="m-wilds-text" style="margin-top:-2px">${esc(WILD_LEVELS[wildsLevel(S)].text)}<\/p>` : ""}
    ${S && S.mode === "open" && !S.winner ? `<button class="btn" id="m-retire">Retire: end the game here<\/button>` : ""}
    <button class="btn danger" id="m-new">New game<\/button><\/div>
    <p class="small muted">Your game saves itself in this browser after every action. Version: ${esc(VERSION)}<\/p>${galaxyBox()}`);
  if ($("m-wilds")) $("m-wilds").onchange = () => { const v = $("m-wilds").value; setWildsLevel(S, v); save(); $("m-wilds-text").textContent = WILD_LEVELS[v].text; renderAll(); toast(`Pirates and creatures: ${WILD_LEVELS[v].name}.`); };
  if ($("m-retire")) $("m-retire").onclick = () => { retire(S); save(); closeModal(); renderAll(); showEnd(); };
  bindGalaxyBox();
  $("m-resume").onclick = closeModal;
  bindMusicMenu();
  $("m-help").onclick = () => showHelp(showMenu);
  $("m-bug").onclick = () => showBugReport();
  $("m-guide").onclick = () => showStarter(true);
  $("m-guide-go").onclick = () => { closeModal(); startGuide(); };
  $("m-steps").onclick = () => { S.tutorial = S.tutorial || {}; S.tutorial.on = !S.tutorial.on; save(); closeModal(); renderSteps(); };
  $("m-new").onclick = () => showNewGame(!!S);
  $("m-load").onclick = () => showLoad(showMenu);
  $("m-export").onclick = () => {
    const code = btoa(unescape(encodeURIComponent(JSON.stringify(S))));
    modal(`<h1>Save code<\/h1><p class="small">Keep this text somewhere safe; paste it into <b>Load a saved game<\/b> to come back to this turn.<\/p><textarea id="save-code" rows="8" readonly>${esc(code)}<\/textarea><div class="btn-row"><button class="btn primary" id="sc-copy">Copy<\/button><button class="btn" id="sc-back">Back<\/button><\/div>`);
    $("sc-back").onclick = showMenu;
    $("sc-copy").onclick = () => { const p = navigator.clipboard && navigator.clipboard.writeText(code); const fail = () => { $("save-code").select(); toast("Copying is blocked here: the code is selected, copy it yourself."); }; if (p) p.then(() => toast("Copied."), fail); else fail(); };
  };
}
function showLoad(back) {
  modal(`<h1>Load a saved game<\/h1><p class="small">Paste a save code.<\/p><textarea id="load-code" rows="8"><\/textarea><div class="btn-row"><button class="btn primary" id="ld-go">Load<\/button><button class="btn" id="ld-back">Back<\/button><\/div>`);
  $("ld-back").onclick = back;
  $("ld-go").onclick = () => {
    try { const st = JSON.parse(decodeURIComponent(escape(atob($("load-code").value.trim())))); if (!st.factions || !st.systems) throw 0; startGame(st); save(); toast("Loaded."); }
    catch { toast("That isn't a save code.", true); }
  };
}
function showEnd() {
  const me = player(S), won = S.winner === me.id, W = S.winner && S.winner !== "none" ? faction(S, S.winner) : null;
  const why = { conquest: "by conquest", engine: "by finishing the Corridor Engine", score: `with the highest score at turn ${RULES.maxTurns}`, fallen: "", retired: `on your own terms, at turn ${S.turn}` }[S.winReason] || "";
  modal(`<h1>${won ? "Victory" : "Defeat"}<\/h1><p class="lede">${won ? `You win ${why}.` : W ? `${esc(W.name)} wins ${why}.` : "Your people have fallen."}<\/p>
    <table class="tbl"><tr><th>Faction<\/th><th>Worlds<\/th><th>Score<\/th><\/tr>${S.factions.map((F) => `<tr><td><span class="dot" style="background:${F.color}"><\/span>${esc(F.name)}${F.alive ? "" : " †"}<\/td><td>${coloniesOf(S, F.id).length}<\/td><td>${score(S, F.id)}<\/td><\/tr>`).join("")}<\/table>
    ${pastVictories().length ? `<p class="gold">🏆 Earlier in this game you ${esc(pastVictories().join(", and "))}, and played on.<\/p>` : ""}
    ${won && S.winReason !== "retired" ? `<p class="small">Keep ruling and the game goes on in open rule, with no end but the one you choose. The directives and campaigns go on too.<\/p>` : ""}
    <div class="btn-row">${won && S.winReason !== "retired" ? `<button class="btn primary" id="end-keep">Keep ruling<\/button>` : ""}<button class="btn ${won && S.winReason !== "retired" ? "" : "primary"}" id="end-new">New game<\/button><button class="btn" id="end-look">Look at the map<\/button><\/div>${galaxyBox()}`);
  bindGalaxyBox();
  if ($("end-keep")) $("end-keep").onclick = () => { keepRuling(S); save(); closeModal(); renderAll(); };
  $("end-new").onclick = () => showNewGame(false);
  $("end-look").onclick = closeModal;
}
let toastTimer = null;
function toast(msg, bad) { const t = $("toast"); t.textContent = msg; t.className = "toast show" + (bad ? " bad" : ""); clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.className = "toast"), 4200); }

if (document.readyState === "loading") window.addEventListener("DOMContentLoaded", boot); else boot();

})();
</script>
